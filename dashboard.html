elasticsearch:9200\n      - ELASTICSEARCH_USERNAME=elastic\n      - ELASTICSEARCH_PASSWORD=changeme\n    volumes:\n      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml\n    ports:\n      - \"5601:5601\"\n    networks:\n      - elk\n    depends_on:\n      elasticsearch:\n        condition: service_healthy\n    restart: unless-stopped\n\n  # Filebeat服务（日志收集器）\n  filebeat:\n    image: docker.elastic.co/beats/filebeat:8.12.0\n    container_name: filebeat\n    user: root\n    volumes:\n      - ./config/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro\n      - /var/log:/var/log:ro\n      - /var/lib/docker/containers:/var/lib/docker/containers:ro\n      - /var/run/docker.sock:/var/run/docker.sock:ro\n    networks:\n      - elk\n    depends_on:\n      elasticsearch:\n        condition: service_healthy\n    restart: unless-stopped\n\nnetworks:\n  elk:\n    driver: bridge\nEOF\n\n# 2. 创建Filebeat配置目录和文件\nmkdir -p /opt/elk/config/filebeat\n\ncat > /opt/elk/config/filebeat/filebeat.yml << 'EOF'\nfilebeat.inputs:\n  # 收集系统日志\n  - type: log\n    enabled: true\n    paths:\n      - /var/log/*.log\n      - /var/log/syslog\n      - /var/log/auth.log\n    fields:\n      log_type: system\n    fields_under_root: true\n\n  # 收集Docker容器日志\n  - type: container\n    enabled: true\n    paths:\n      - /var/lib/docker/containers/*/*.log\n    processors:\n      - add_docker_metadata: ~\n\n  # 收集Nginx日志（如果安装了Nginx）\n  - type: log\n    enabled: true\n    paths:\n      - /var/log/nginx/access.log\n      - /var/log/nginx/error.log\n    fields:\n      log_type: nginx\n    fields_under_root: true\n\n# 输出到Logstash\noutput.logstash:\n  hosts: [\"logstash:5044\"]\n  loadbalance: true\n\n# 输出到Elasticsearch（可选，跳过Logstash直接输出）\n# output.elasticsearch:\n#   hosts: [\"elasticsearch:9200\"]\n#   protocol: \"http\"\n\n# 监控设置\nmonitoring.enabled: false\nEOF\n```\n\n**代码解释**：\n- **elasticsearch**：配置单节点模式、JVM内存、数据卷挂载\n- **logstash**：依赖Elasticsearch，配置管道文件挂载\n- **kibana**：依赖Elasticsearch，配置界面语言\n- **filebeat**：收集宿主机日志，挂载`/var/log`和Docker日志目录\n- **healthcheck**：健康检查，确保Elasticsearch完全启动后其他服务才启动\n- **depends_on**：定义服务启动顺序\n\n> [!warning] 旁批：版本兼容性\n> ELK三个组件版本必须一致！8.12.0是目前稳定的版本，不建议混用不同版本。\n\n### 步骤 7：启动ELK服务\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：启动ELK容器集群\n\n```bash\n# 1. 进入项目目录\ncd /opt/elk\n\n# 2. 拉取Docker镜像（第一次需要，约2GB）\ndocker compose pull\n\n# 3. 启动所有服务（后台运行）\ndocker compose up -d\n\n# 4. 查看服务状态\ndocker compose ps\n# 应该看到4个服务都是running状态\n\n# 5. 查看日志（启动过程）\ndocker compose logs -f\n# 按Ctrl+C退出日志查看\n\n# 6. 等待服务完全启动（约1-2分钟）\n# 检查Elasticsearch是否就绪\ncurl -s http://localhost:9200/_cluster/health?pretty\n# 应该看到：\"status\" : \"green\" 或 \"yellow\"\n\n# 7. 检查Kibana是否就绪\ncurl -s http://localhost:5601/api/status | python3 -m json.tool\n# 应该看到：\"status\" : {\"overall\" : {\"level\" : \"available\"}}\n```\n\n**代码解释**：\n- `docker compose up -d`：后台启动所有容器\n- `docker compose ps`：查看容器状态\n- `docker compose logs -f`：实时查看日志（`-f`表示跟随）\n- `_cluster/health`：Elasticsearch集群健康API\n\n> [!tip] 旁批：首次启动较慢\n> 第一次启动需要初始化Elasticsearch索引，可能需要1-2分钟。如果看到\"yellow\"状态是正常的（单节点模式下没有副本分片）。\n\n### 步骤 8：访问Kibana界面\n\n**在哪里操作**：本地电脑浏览器\n\n**操作目的**：验证ELK平台是否正常工作\n\n```bash\n# 1. 在浏览器访问Kibana\n# 地址：http://你的服务器IP:5601\n# 用户名：elastic\n# 密码：changeme（如果没修改的话）\n\n# 2. 首次登录会看到欢迎页面\n# 点击 \"Explore on my own\" 进入主界面\n\n# 3. 进入Management → Stack Management\n# 检查Elasticsearch索引是否创建成功\n\n# 4. 进入Discover页面\n# 应该能看到Filebeat收集的日志数据\n```\n\n> [!warning] 旁批：安全提醒\n> 生产环境**必须**修改默认密码！这里为了演示方便禁用了安全认证。生产环境请参考Elastic官方文档配置安全。\n\n### 步骤 9：创建Index Pattern\n\n**在哪里操作**：Kibana界面\n\n**操作目的**：让Kibana识别Elasticsearch索引\n\n```bash\n# 1. 在Kibana界面，进入 Management → Stack Management → Index Patterns\n\n# 2. 点击 \"Create index pattern\"\n\n# 3. 输入索引模式名称\n# Filebeat索引格式：filebeat-8.12.0-*\n# 输入：filebeat-*\n# 点击 \"Next step\"\n\n# 4. 选择时间字段\n# 选择：@timestamp\n# 点睛 \"Create index pattern\"\n\n# 5. 进入 Discover页面\n# 在左上角选择刚创建的索引模式\n# 应该能看到日志数据了\n```\n\n**代码解释**：\n- Index Pattern告诉Kibana如何匹配Elasticsearch索引\n- `filebeat-*`匹配所有以filebeat-开头的索引\n- `@timestamp`是日志的时间戳字段，用于时间筛选\n\n### 步骤 10：配置日志收集（测试用例）\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：生成测试日志验证平台工作\n\n```bash\n# 1. 创建测试日志生成脚本\ncat > /opt/elk/test-logs.sh << 'EOF'\n#!/bin/bash\n\n# 生成系统日志\necho \"$(date) [INFO] 系统启动完成\" | sudo tee -a /var/log/test-app.log\necho \"$(date) [WARN] 磁盘空间不足80%\" | sudo tee -a /var/log/test-app.log\necho \"$(date) [ERROR] 数据库连接失败\" | sudo tee -a /var/log/test-app.log\n\n# 生成Nginx日志（如果安装了Nginx）\nif [ -d /var/log/nginx ]; then\n    echo \"$(date +%d/%b/%Y:%H:%M:%S %z) GET /api/users HTTP/1.1 200 1234 \"-\" \"Mozilla/5.0\" \"-\" 0.001\" | sudo tee -a /var/log/nginx/access.log\n    echo \"$(date +%d/%b/%Y:%H:%M:%S %z) GET /api/orders HTTP/1.1 500 567 \"-\" \"Mozilla/5.0\" \"-\" 0.002\" | sudo tee -a /var/log/nginx/access.log\nfi\n\n# 生成Docker容器日志\ndocker run --rm alpine echo \"Docker container log message\"\n\necho \"测试日志已生成，请在Kibana Discover页面查看\"\nEOF\n\nchmod +x /opt/elk/test-logs.sh\n\n# 2. 执行测试脚本\nsudo /opt/elk/test-logs.sh\n\n# 3. 等待几秒钟，让日志被收集和索引\nsleep 10\n\n# 4. 在Kibana Discover页面刷新\n# 应该能看到刚刚生成的测试日志\n```\n\n**代码解释**：\n- `tee -a`：同时输出到屏幕和文件\n- `date`：生成当前时间戳\n- 测试日志包含INFO、WARN、ERROR三种级别，方便演示过滤功能\n\n### 步骤 11：创建可视化仪表盘\n\n**在哪里操作**：Kibana界面\n\n**操作目的**：创建日志分析图表\n\n```bash\n# 1. 在Kibana界面，进入 Analytics → Dashboard\n\n# 2. 点击 \"Create dashboard\"\n\n# 3. 点击 \"Create visualization\"\n\n# 4. 创建第一个图表：日志级别分布\n# - 选择：Pie chart\n# - 数据源：filebeat-*\n# - 分组：Terms，字段：log_level\n# - 点击 \"Save and return\"\n# - 命名：日志级别分布\n\n# 5. 创建第二个图表：日志时间趋势\n# - 选择：Line chart\n# - 数据源：filebeat-*\n# - X轴：Date Histogram，字段：@timestamp，间隔：Auto\n# - Y轴：Count\n# - 点击 \"Save and return\"\n# - 命名：日志时间趋势\n\n# 6. 创建第三个图表：错误日志统计\n# - 选择：Bar chart\n# - 数据源：filebeat-*\n# - 添加过滤器：log_level : \"ERROR\"\n# - X轴：Terms，字段：message.keyword\n# - Y轴：Count\n# - 点击 \"Save and return\"\n# - 命名：错误日志TOP10\n\n# 7. 保存仪表盘\n# 点击 \"Save\"\n# 命名：ELK日志监控仪表盘\n```\n\n### 步骤 12：配置告警规则\n\n**在哪里操作**：Kibana界面\n\n**操作目的**：配置关键错误实时告警\n\n```bash\n# 1. 在Kibana界面，进入 Stack Management → Rules and Connectors\n\n# 2. 点击 \"Create rule\"\n\n# 3. 配置规则\n# - 规则类型：Index threshold\n# - 名称：错误日志告警\n# - 检查频率：每1分钟\n# - 索引：filebeat-*\n# - 时间字段：@timestamp\n# - 阈值条件：\n#   - WHEN count\n#   - IS ABOVE 10\n#   - FOR THE LAST 5 minutes\n# - 这表示：5分钟内错误日志超过10条就触发告警\n\n# 4. 配置动作（Webhook）\n# - 动作类型：Webhook\n# - 方法：POST\n# - URL：你的钉钉/企微机器人Webhook地址\n# - Headers：Content-Type: application/json\n# - Body：\n{\n  \"msgtype\": \"text\",\n  \"text\": {\n    \"content\": \"ELK告警：检测到大量错误日志，请立即检查！\\n时间：{{date}}\\n错误数量：{{context.value}}\"\n  }\n}\n\n# 5. 点击 \"Save\"\n```\n\n**代码解释**：\n- Index threshold：基于索引阈值的告警规则\n- 检查频率：每分钟检查一次\n- 阈值条件：5分钟内错误日志超过10条\n- Webhook：通过HTTP请求发送告警到钉钉/企微\n\n> [!tip] 旁批：告警最佳实践\n> - 不要设置太灵敏的阈值，避免告警疲劳\n> - 建议设置不同级别的告警（警告、严重、紧急）\n> - 告警信息要包含足够的上下文（时间、数量、影响范围）\n\n### 步骤 13：配置日志保留策略\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：防止磁盘空间耗尽\n\n```bash\n# 1. 创建生命周期管理策略\ncat > /opt/elk/config/elasticsearch/lifecycle-policy.json << 'EOF'\n{\n  \"policy\": {\n    \"phases\": {\n      \"hot\": {\n        \"min_age\": \"0ms\",\n        \"actions\": {\n          \"rollover\": {\n            \"max_primary_shard_size\": \"10gb\",\n            \"max_age\": \"1d\"\n          }\n        }\n      },\n      \"warm\": {\n        \"min_age\": \"7d\",\n        \"actions\": {\n          \"shrink\": {\n            \"number_of_shards\": 1\n          },\n          \"forcemerge\": {\n            \"max_num_segments\": 1\n          }\n        }\n      },\n      \"cold\": {\n        \"min_age\": \"30d\",\n        \"actions\": {\n          \"freeze\": {}\n        }\n      },\n      \"delete\": {\n        \"min_age\": \"90d\",\n        \"actions\": {\n          \"delete\": {}\n        }\n      }\n    }\n  }\n}\nEOF\n\n# 2. 应用生命周期策略\ncurl -X PUT \"http://localhost:9200/_ilm/policy/log-lifecycle-policy\" \\\n  -H 'Content-Type: application/json' \\\n  -d @/opt/elk/config/elasticsearch/lifecycle-policy.json\n\n# 3. 应用到Filebeat索引模板\ncurl -X PUT \"http://localhost:9200/_index_template/filebeat\" \\\n  -H 'Content-Type: application/json' \\\n  -d '{\n    \"index_patterns\": [\"filebeat-*\"],\n    \"template\": {\n      \"settings\": {\n        \"index.lifecycle.name\": \"log-lifecycle-policy\",\n        \"index.lifecycle.rollover_alias\": \"filebeat\"\n      }\n    }\n  }'\n```\n\n**代码解释**：\n- **hot阶段**：最新日志，每天或每10GB滚动一次\n- **warm阶段**：7天后的日志，合并分片，提升查询性能\n- **cold阶段**：30天后的日志，冻结索引，节省内存\n- **delete阶段**：90天后自动删除\n\n> [!warning] 旁批：生产环境建议\n> 生产环境日志保留时间根据合规要求设置，金融行业通常要求保留180天或更长。\n\n### 步骤 14：性能优化\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：优化ELK性能\n\n```bash\n# 1. 优化Elasticsearch配置\ncat > /opt/elk/config/elasticsearch/elasticsearch-optimized.yml << 'EOF'\ncluster.name: \"elk-cluster\"\nnode.name: \"elasticsearch-1\"\npath.data: /usr/share/elasticsearch/data\npath.logs: /usr/share/elasticsearch/logs\nnetwork.host: 0.0.0.0\nhttp.port: 9200\ndiscovery.type: single-node\nbootstrap.memory_lock: true\n\n# 性能优化\nindices.memory.index_buffer_size: 30%\nthread_pool.write.queue_size: 2000\nthread_pool.search.queue_size: 1000\n\n# 查询优化\naction.auto_create_index: false\naction.destructive_requires_name: true\nEOF\n\n# 2. 优化JVM配置（/etc/elasticsearch/jvm.options.d/）\n# 如果内存充足，可以增加JVM堆内存\n# 建议：物理内存的50%，但不超过32GB\n\n# 3. 重启Elasticsearch使配置生效\ncd /opt/elk\ndocker compose restart elasticsearch\n\n# 4. 监控性能指标\n# 在Kibana中进入 Stack Monitoring\n# 可以看到Elasticsearch、Logstash、Kibana的性能指标\n```\n\n## 📊 成果量化模板\n\n| 指标 | 改造前 | 改造后 |\n|------|--------|--------|\n| 日志查看方式 | 登录多台服务器，grep搜索 | Kibana统一界面，实时查询 |\n| 故障定位时间 | 2小时（逐台服务器排查） | 5分钟（关键词搜索+时间筛选） |\n| 日志查询效率 | 手动grep，慢且不准确 | 全文搜索，毫秒级响应 |\n| 故障响应时间 | 30分钟（人工发现） | 5分钟（自动告警） |\n| 日志存储方式 | 本地文件，易丢失 | 集中存储，高可用 |\n| 日志分析能力 | 无 | 可视化图表、趋势分析、异常检测 |\n\n## ❓ 面试高频问题\n\n### 1. **ELK三个组件分别负责什么？**\n- **Elasticsearch**：分布式搜索引擎，负责存储和检索日志数据\n- **Logstash**：数据处理管道，负责收集、解析、转换日志\n- **Kibana**：可视化界面，负责展示和分析日志数据\n- **补充组件**：Filebeat（轻量级日志收集器）、Beats（各种数据收集器）\n\n### 2. **为什么用Filebeat而不是Logstash收集日志？**\n- **资源占用**：Filebeat用Go语言编写，占用资源极少（约10MB内存）\n- **可靠性**：Filebeat有背压机制，不会压垮下游服务\n- **稳定性**：Filebeat专门为日志收集设计，稳定性更好\n- **架构**：Filebeat → Logstash → Elasticsearch（分工明确）\n\n### 3. **Elasticsearch的索引是什么？和数据库的表有什么区别？**\n- **索引**：类似于数据库的表，但更灵活\n- **文档**：类似于表中的行，JSON格式\n- **字段**：类似于表中的列\n- **区别**：\n  - 数据库需要预定义Schema，Elasticsearch可以动态添加字段\n  - 数据库适合事务处理，Elasticsearch适合搜索和分析\n  - 数据库有ACID，Elasticsearch是近实时（1秒延迟）\n\n### 4. **如何保证日志不丢失？**\n- **Filebeat**：本地持久化队列，断线重连后继续发送\n- **Logstash**：持久化队列，数据先写磁盘再处理\n- **Elasticsearch**：副本分片，默认1个副本，数据冗余存储\n- **网络层面**：使用TCP协议，确保数据完整传输\n\n### 5. **日志量很大时如何优化？**\n- **索引策略**：按时间滚动索引（每天一个索引）\n- **生命周期管理**：自动清理过期数据\n- **分片优化**：合理设置分片数量（单个分片建议10-50GB）\n- **硬件优化**：SSD硬盘、充足内存、多核CPU\n- **查询优化**：避免全量查询，使用时间范围过滤\n\n### 6. **如何监控ELK本身的健康状态？**\n```bash\n# 1. Elasticsearch健康检查\ncurl -s http://localhost:9200/_cluster/health?pretty\n# 关注：status、number_of_nodes、active_shards\n\n# 2. 索引状态\ncurl -s http://localhost:9200/_cat/indices?v\n# 关注：health、status、docs.count、store.size\n\n# 3. 节点状态\ncurl -s http://localhost:9200/_cat/nodes?v\n# 关注：heap.percent、disk.avail、load\n\n# 4. 使用Kibana Stack Monitoring\n# 在Kibana界面进入 Stack Monitoring\n# 可以图形化监控所有组件\n```\n\n### 7. **生产环境ELK集群如何部署？**\n- **Elasticsearch**：至少3个节点，1主2从，分布在不同可用区\n- **Logstash**：至少2个节点，负载均衡\n- **Kibana**：1个节点，挂了不影响数据\n- **Filebeat**：每台服务器部署一个\n- **负载均衡**：前面加Nginx或HAProxy\n- **安全**：开启SSL/TLS、配置认证和授权\n\n## 🔧 故障排查\n\n### 问题1：Elasticsearch启动失败\n```bash\n# 错误信息：max virtual memory areas vm.max_map_count [65530] is too low\n# 原因：内存映射数量不足\n# 解决：\nsudo sysctl -w vm.max_map_count=262144\necho \"vm.max_map_count=262144\" | sudo tee -a /etc/sysctl.conf\n```\n\n### 问题2：Logstash连接Elasticsearch失败\n```bash\n# 错误信息：Failed to connect to Elasticsearch\n# 原因：Elasticsearch还没完全启动\n# 解决：\n# 1. 等待Elasticsearch健康检查通过\ncurl -s http://localhost:9200/_cluster/health\n# 2. 重启Logstash\ndocker compose restart logstash\n```\n\n### 问题3：Kibana无法连接Elasticsearch\n```bash\n# 错误信息：Unable to connect to Elasticsearch\n# 原因：网络问题或认证失败\n# 解决：\n# 1. 检查容器网络\ndocker network ls\ndocker network inspect elk_elk\n\n# 2. 测试连通性\ndocker exec -it kibana ping elasticsearch\n\n# 3. 检查配置\ncat /opt/elk/config/kibana/kibana.yml\n```\n\n## 📚 扩展学习\n\n### 1. 使用Elastic Agent（Filebeat的替代方案）\n```yaml\n# Elastic Agent是新一代的数据收集器\n# 集成了Filebeat、Metricbeat等功能\n# 配置更简单，功能更强大\n\n# 在Kibana中进入 Fleet → Agents\n# 添加Integration：System、Nginx、Docker等\n# 自动生成配置并部署Agent\n```\n\n### 2. 集成Prometheus监控\n```yaml\n# 在docker-compose.yml中添加Prometheus\nprometheus:\n  image: prom/prometheus:latest\n  container_name: prometheus\n  volumes:\n    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml\n  ports:\n    - \"9090:9090\"\n  networks:\n    - elk\n\n# 配置Prometheus监控Elasticsearch\n# scrape_configs:\n#   - job_name: 'elasticsearch'\n#     static_configs:\n#       - targets: ['elasticsearch:9200']\n```\n\n### 3. 使用OpenSearch（Elasticsearch的开源分支）\n```yaml\n# OpenSearch是AWS fork的Elasticsearch开源分支\n# 完全兼容Elasticsearch API\n# 许可证更友好（Apache 2.0）\n\n# 修改docker-compose.yml中的镜像\nimage: opensearchproject/opensearch:2.11.0\n```\n\n## 相关笔记\n\n- [[20260730-Prometheus监控体系|Prometheus 监控体系]] — 与ELK形成完整的可观测性平台\n- [[20260730-CI-CD流水线搭建|CI/CD 流水线搭建]] — 日志收集可集成到CI/CD\n- [[20260827-Nginx-HTTPS自动化部署|Nginx HTTPS部署]] — 收集Nginx日志\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-08-27T11:00:00"}, {"title": "Nginx + Let's Encrypt 自动化HTTPS部署与证书管理", "path": "简历项目实战/01-运维项目/20260827-Nginx-HTTPS自动化部署.md", "pillar": "projects", "status": "seedling", "summary": "> HTTPS自动化部署与证书管理平台 · 项目角色：主导搭建 · 2026.XX\n>\n> - 针对企业网站HTTP明文传输存在数据泄露风险、手动管理SSL证书易过期导致服务中断的问题，基于 Nginx + Let's Encrypt + Certbot 设计并实现全自动HTTPS部署与证书生命周期", "content": "# Nginx + Let's Encrypt 自动化HTTPS部署与证书管理\n\n## 📄 简历写法（可直接抄）\n\n> **HTTPS自动化部署与证书管理平台** · 项目角色：主导搭建 · 2026.XX\n>\n> - 针对企业网站HTTP明文传输存在**数据泄露风险**、手动管理SSL证书**易过期导致服务中断**的问题，基于 **Nginx + Let's Encrypt + Certbot** 设计并实现全自动HTTPS部署与证书生命周期管理\n> - 实现证书**自动申请、自动部署、自动续期**，证书管理效率提升 **95%**，HTTPS部署时间从 **2小时** 缩短至 **5分钟**\n> - 配置 **HSTS、OCSP Stapling、TLS 1.3** 等安全特性，SSL Labs 评分从 **C级** 提升至 **A+级**，安全合规性达到金融行业标准\n\n> [!tip] 旁批：数字怎么来\n> 没有公司数据就按个人项目如实写：\"个人博客/开源项目HTTPS改造\"。面试官追问时，讲清楚**改造前后的对比逻辑**（手动证书管理有哪些痛点、HTTPS能解决什么安全问题）比编数字更有说服力。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它（面试考点） |\n|------|------|------------------------|\n| Nginx 1.24+ | Web服务器 + 反向代理 | 性能优异、配置灵活、国内使用最广泛 |\n| Let's Encrypt | 免费SSL证书颁发机构 | 免费、自动化、全球信任、ozilla推荐 |\n| Certbot | 证书申请与管理客户端 | 官方推荐、自动续期、支持Nginx插件 |\n| OpenSSL | 证书生成与验证工具 | 行业标准、功能完整 |\n| Systemd | 服务管理 | 自动续期定时器、日志管理 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 0：准备环境\n\n**在哪里操作**：您的本地电脑（Windows/Mac/Linux都可以）\n\n**操作目的**：准备一台云服务器作为实验环境\n\n```bash\n# 1. 购买云服务器（推荐配置）\n# - 阿里云/腾讯云/华为云 学生机（约¥10/月）\n# - 配置：2核CPU、2GB内存、40GB硬盘\n# - 系统：Ubuntu 22.04 LTS（推荐）或 CentOS 7/8\n\n# 2. 登录服务器（在本地电脑终端执行）\n# Windows用户：使用PowerShell或Git Bash\n# Mac/Linux用户：打开终端\nssh root@你的服务器IP\n\n# 3. 更新系统（必须执行）\nsudo apt update && sudo apt upgrade -y\n\n# 4. 安装必要工具\nsudo apt install -y curl wget git vim\n```\n\n> [!warning] 旁批：为什么选Ubuntu\n> Ubuntu对新手更友好，apt包管理器简单易用，文档也最全。CentOS已经停止维护，不推荐新项目使用。\n\n### 步骤 1：安装Nginx\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：安装Web服务器\n\n```bash\n# 1. 安装Nginx\nsudo apt install -y nginx\n\n# 2. 启动Nginx并设置开机自启\nsudo systemctl start nginx\nsudo systemctl enable nginx\n\n# 3. 检查Nginx状态（应该显示 active (running)）\nsudo systemctl status nginx\n\n# 4. 验证安装（在本地浏览器访问）\n# 打开浏览器，访问：http://你的服务器IP\n# 应该看到 \"Welcome to nginx!\" 页面\n```\n\n**代码解释**：\n- `sudo apt install -y nginx`：使用apt包管理器安装Nginx，`-y`表示自动确认\n- `systemctl start nginx`：启动Nginx服务\n- `systemctl enable nginx`：设置开机时自动启动Nginx\n- `systemctl status nginx`：查看服务状态\n\n> [!tip] 旁批：验证安装\n> 如果浏览器打不开，检查云服务器的安全组设置，确保开放了80端口（HTTP）。\n\n### 步骤 2：配置域名解析\n\n**在哪里操作**：您的域名管理控制台（阿里云/腾讯云等）\n\n**操作目的**：将域名指向您的服务器IP\n\n```bash\n# 1. 购买域名（如果没有）\n# 推荐：阿里云万网、腾讯云DNSPod、Cloudflare\n# 价格：.com域名约¥50/年\n\n# 2. 添加DNS解析记录\n# 记录类型：A记录\n# 主机记录：@（代表根域名）和 www（代表www子域名）\n# 记录值：你的服务器IP\n# TTL：600（10分钟）\n\n# 3. 等待DNS生效（通常5-10分钟）\n# 在本地电脑验证解析是否生效：\nnslookup 你的域名\n```\n\n**代码解释**：\n- **A记录**：将域名指向一个IPv4地址\n- **@**：代表根域名（如 example.com）\n- **www**：代表www子域名（如 www.example.com）\n- **TTL**：Time To Live，DNS缓存时间，600秒=10分钟\n\n> [!warning] 旁批：域名备案\n> 如果使用国内服务器，域名需要备案才能正常使用。建议使用香港或海外服务器进行测试，无需备案。\n\n### 步骤 3：安装Certbot（Let's Encrypt客户端）\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：安装证书申请工具\n\n```bash\n# 1. 安装Certbot和Nginx插件\nsudo apt install -y certbot python3-certbot-nginx\n\n# 2. 验证安装\ncertbot --version\n# 应该显示类似：certbot 2.7.4\n\n# 3. 查看帮助信息\ncertbot --help\n```\n\n**代码解释**：\n- `certbot`：Let's Encrypt官方推荐的客户端工具\n- `python3-certbot-nginx`：Nginx插件，可以自动修改Nginx配置\n- 安装后Certbot会自动配置Nginx的HTTPS\n\n> [!tip] 旁批：为什么用Certbot\n> Certbot是Let's Encrypt官方推荐的工具，支持自动申请、自动部署、自动续期，是目前最简单的HTTPS解决方案。\n\n### 步骤 4：申请SSL证书\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：为您的域名申请免费SSL证书\n\n```bash\n# 1. 申请证书（替换为你的域名和邮箱）\nsudo certbot --nginx -d 你的域名.com -d www.你的域名.com --email 你的邮箱@example.com\n\n# 示例：\nsudo certbot --nginx -d example.com -d www.example.com --email admin@example.com\n\n# 2. 按照提示操作\n# - 同意服务条款：输入 Y\n# - 是否分享邮箱：输入 N（或Y，随意）\n# - 选择重定向：选择 2（将HTTP重定向到HTTPS）\n\n# 3. 验证证书安装\n# 浏览器访问：https://你的域名.com\n# 应该看到安全锁标志，表示HTTPS生效\n```\n\n**代码解释**：\n- `--nginx`：使用Nginx插件，自动修改Nginx配置\n- `-d`：指定要申请证书的域名，可以指定多个\n- `--email`：用于接收证书过期提醒的邮箱\n- 选择\"重定向\"会自动将所有HTTP请求转为HTTPS\n\n> [!warning] 旁批：常见错误\n> 如果出现\"DNS问题\"，说明域名解析还没生效。等待5-10分钟后重试，或检查DNS记录是否正确。\n\n### 步骤 5：配置Nginx（手动配置示例）\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：了解Nginx配置结构，以便后续自定义\n\n```bash\n# 1. 查看Nginx配置文件位置\nls -la /etc/nginx/\n# 主配置文件：/etc/nginx/nginx.conf\n# 站点配置：/etc/nginx/sites-available/\n# 启用站点：/etc/nginx/sites-enabled/\n\n# 2. 备份原始配置（重要！）\nsudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.backup\nsudo cp /etc/nginx/sites-available/default /etc/nginx/sites-available/default.backup\n\n# 3. 查看当前Nginx配置（Certbot自动修改后的）\nsudo cat /etc/nginx/sites-available/default\n```\n\n**代码解释**：\n- `/etc/nginx/nginx.conf`：Nginx主配置文件\n- `/etc/nginx/sites-available/`：存放所有可用站点配置\n- `/etc/nginx/sites-enabled/`：存放已启用的站点配置（通常是符号链接）\n\n### 步骤 6：深入理解Nginx配置\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：编写自定义Nginx配置\n\n```bash\n# 1. 创建新的站点配置文件\nsudo vim /etc/nginx/sites-available/mysite\n\n# 2. 输入以下内容（请将域名替换为你的实际域名）：\n```\n\n```nginx\n# HTTP服务器（80端口）- 自动跳转到HTTPS\nserver {\n    listen 80;\n    listen [::]:80;\n    server_name example.com www.example.com;\n    \n    # 将所有HTTP请求重定向到HTTPS\n    return 301 https://$server_name$request_uri;\n}\n\n# HTTPS服务器（443端口）\nserver {\n    listen 443 ssl http2;\n    listen [::]:443 ssl http2;\n    server_name example.com www.example.com;\n    \n    # SSL证书配置（Certbot自动生成）\n    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;\n    \n    # SSL安全配置（重要！）\n    ssl_protocols TLSv1.2 TLSv1.3;  # 只允许TLS 1.2和1.3\n    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;\n    ssl_prefer_server_ciphers off;\n    \n    # HSTS配置（告诉浏览器只用HTTPS访问）\n    add_header Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;\n    \n    # OCSP Stapling配置（提升性能）\n    ssl_stapling on;\n    ssl_stapling_verify on;\n    resolver 8.8.8.8 8.8.4.4 valid=300s;\n    resolver_timeout 5s;\n    \n    # 网站根目录\n    root /var/www/html;\n    index index.html index.htm;\n    \n    # 日志配置\n    access_log /var/log/nginx/mysite.access.log;\n    error_log /var/log/nginx/mysite.error.log;\n    \n    # 主要位置配置\n    location / {\n        try_files $uri $uri/ =404;\n    }\n    \n    # 静态文件缓存\n    location ~* \\.(jpg|jpeg|png|gif|ico|css|js)$ {\n        expires 30d;\n        add_header Cache-Control \"public, immutable\";\n    }\n}\n```\n\n**代码解释**：\n- `listen 443 ssl http2`：监听443端口，启用SSL和HTTP/2\n- `ssl_protocols`：指定允许的SSL/TLS协议版本，禁用不安全的旧版本\n- `ssl_ciphers`：指定加密算法套件，选择安全且高性能的组合\n- `add_header Strict-Transport-Security`：启用HSTS，强制浏览器使用HTTPS\n- `ssl_stapling`：启用OCSP Stapling，提升SSL握手性能\n- `try_files`：尝试按顺序查找文件，找不到则返回404\n\n### 步骤 7：启用站点并测试配置\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：启用新配置并测试\n\n```bash\n# 1. 创建符号链接启用站点\nsudo ln -s /etc/nginx/sites-available/mysite /etc/nginx/sites-enabled/\n\n# 2. 删除默认站点（可选）\nsudo rm /etc/nginx/sites-enabled/default\n\n# 3. 测试Nginx配置语法\nsudo nginx -t\n# 应该显示：\n# nginx: the configuration file /etc/nginx/nginx.conf syntax is ok\n# nginx: configuration file /etc/nginx/nginx.conf test is successful\n\n# 4. 重新加载Nginx（不中断服务）\nsudo systemctl reload nginx\n\n# 5. 验证配置\n# 浏览器访问：https://你的域名.com\n# 应该看到安全锁标志，SSL Labs评分应该很高\n```\n\n**代码解释**：\n- `ln -s`：创建符号链接，相当于Windows的快捷方式\n- `nginx -t`：测试配置文件语法是否正确\n- `reload`：重新加载配置，不会中断现有连接\n\n> [!tip] 旁批：为什么用reload而不是restart\n> reload会平滑地重新加载配置，不会中断正在处理的请求。restart会完全停止再启动，可能导致用户访问中断。\n\n### 步骤 8：配置自动续期\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：设置证书自动续期，避免过期\n\n```bash\n# 1. 测试证书续期命令\nsudo certbot renew --dry-run\n# 如果没有错误，说明自动续期配置正确\n\n# 2. 查看Certbot创建的定时器\nsudo systemctl list-timers | grep certbot\n# 应该看到：certbot.timer\n\n# 3. 查看定时器详情\nsudo systemctl status certbot.timer\n\n# 4. 手动续期证书（如果需要）\nsudo certbot renew\n\n# 5. 查看证书信息\nsudo certbot certificates\n```\n\n**代码解释**：\n- `--dry-run`：模拟运行，不实际续期，用于测试\n- `certbot.timer`：Systemd定时器，每天运行两次检查是否需要续期\n- Let's Encrypt证书有效期90天，Certbot会在过期前30天自动续期\n\n> [!warning] 旁批：自动续期原理\n> Certbot安装时会创建一个Systemd定时器，每天运行两次。如果距离过期不足30天，会自动续期并重新加载Nginx。\n\n### 步骤 9：配置防火墙\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：只开放必要端口，提升安全性\n\n```bash\n# 1. 查看当前防火墙状态\nsudo ufw status\n# 如果显示inactive，需要先启用\n\n# 2. 允许SSH连接（重要！否则会锁死自己）\nsudo ufw allow OpenSSH\n\n# 3. 允许HTTP和HTTPS\nsudo ufw allow 'Nginx Full'\n\n# 4. 启用防火墙\nsudo ufw enable\n# 输入 y 确认\n\n# 5. 查看状态\nsudo ufw status verbose\n# 应该看到：\n# 22/tcp (OpenSSH)    ALLOW    Anywhere\n# 80/tcp (Nginx HTTP) ALLOW    Anywhere\n# 443/tcp (Nginx HTTPS) ALLOW   Anywhere\n```\n\n**代码解释**：\n- `ufw`：Uncomplicated Firewall，Ubuntu默认的防火墙管理工具\n- `allow OpenSSH`：允许SSH连接（端口22），否则无法远程管理\n- `allow 'Nginx Full'`：允许HTTP(80)和HTTPS(443)端口\n- `enable`：启用防火墙，拒绝所有未明确允许的连接\n\n> [!warning] 旁批：防火墙重要性\n> 不配置防火墙，服务器就像没关门的房子。开放SSH后先测试能否连接，再启用防火墙。\n\n### 步骤 10：验证HTTPS配置\n\n**在哪里操作**：本地电脑浏览器\n\n**操作目的**：验证HTTPS是否正确配置\n\n```bash\n# 1. 在浏览器访问您的网站\n# https://你的域名.com\n# 应该看到：\n# - 安全锁标志（地址栏左侧）\n# - 网站内容正常显示\n# - 没有混合内容警告\n\n# 2. 使用SSL Labs测试（重要！）\n# 访问：https://www.ssllabs.com/ssltest/\n# 输入您的域名，等待测试完成\n# 目标：评分达到A+\n\n# 3. 使用命令行测试（可选）\n# 在本地电脑终端执行：\nopenssl s_client -connect 你的域名.com:443 -servername 你的域名.com\n# 查看输出中的\"Verify return code: 0 (ok)\"\n```\n\n**代码解释**：\n- SSL Labs是业界最权威的SSL测试工具\n- A+评级表示配置符合最佳安全实践\n- `openssl s_client`：命令行SSL测试工具\n\n### 步骤 11：配置安全增强（可选但推荐）\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：进一步提升安全性\n\n```bash\n# 1. 安全加固Nginx配置\nsudo vim /etc/nginx/nginx.conf\n\n# 2. 在http块中添加以下内容：\n```\n\n```nginx\nhttp {\n    # 隐藏Nginx版本号（安全最佳实践）\n    server_tokens off;\n    \n    # 限制请求体大小（防止大文件攻击）\n    client_max_body_size 10M;\n    \n    # 限制连接数（防止DDoS）\n    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;\n    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;\n    \n    # 安全响应头\n    add_header X-Frame-Options \"SAMEORIGIN\" always;\n    add_header X-Content-Type-Options \"nosniff\" always;\n    add_header X-XSS-Protection \"1; mode=block\" always;\n    add_header Referrer-Policy \"strict-origin-when-cross-origin\" always;\n    add_header Content-Security-Policy \"default-src 'self' http: https: ws: wss:\" always;\n    \n    # gzip压缩（提升性能）\n    gzip on;\n    gzip_vary on;\n    gzip_proxied any;\n    gzip_comp_level 6;\n    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;\n}\n```\n\n**代码解释**：\n- `server_tokens off`：隐藏Nginx版本号，防止攻击者利用已知漏洞\n- `client_max_body_size`：限制上传文件大小，防止大文件攻击\n- `limit_conn_zone/limit_req_zone`：限制连接数和请求率，防止DDoS\n- `X-Frame-Options`：防止点击劫持攻击\n- `X-Content-Type-Options`：防止MIME类型嗅探\n- `X-XSS-Protection`：启用浏览器XSS防护\n- `Content-Security-Policy`：防止XSS和数据注入攻击\n\n### 步骤 12：配置日志轮转\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：防止日志文件过大\n\n```bash\n# 1. 查看当前日志大小\nls -lh /var/log/nginx/\n# 可以看到access.log和error.log\n\n# 2. 查看日志轮转配置\ncat /etc/logrotate.d/nginx\n\n# 3. 自定义日志轮转（可选）\nsudo vim /etc/logrotate.d/nginx-custom\n```\n\n```bash\n/var/log/nginx/*.log {\n    daily\n    missingok\n    rotate 14\n    compress\n    delaycompress\n    notifempty\n    create 0640 www-data adm\n    sharedscripts\n    postrotate\n        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`\n    endscript\n}\n```\n\n**代码解释**：\n- `daily`：每天轮转一次\n- `rotate 14`：保留14天的日志\n- `compress`：压缩旧日志\n- `create 0640 www-data adm`：创建新日志文件的权限\n- `kill -USR1`：通知Nginx重新打开日志文件\n\n## 📊 成果量化模板\n\n| 指标 | 改造前 | 改造后 |\n|------|--------|--------|\n| 部署HTTPS时间 | 2小时（手动申请、配置） | 5分钟（一键自动化） |\n| 证书管理方式 | 手动下载、手动部署、手动续期 | 全自动（申请、部署、续期） |\n| SSL Labs评分 | C级（配置不规范） | A+级（符合最佳实践） |\n| 安全特性 | 仅基础HTTPS | HSTS + OCSP + TLS 1.3 + 安全头 |\n| 证书过期风险 | 经常忘记续期，导致服务中断 | 自动续期，零风险 |\n| 运维成本 | 每季度人工检查证书 | 全自动，零人工干预 |\n\n## ❓ 面试高频问题\n\n### 1. **Let's Encrypt证书有什么优缺点？**\n**优点**：\n- 完全免费，适合个人和中小企业\n- 自动化程度高，支持自动申请和续期\n- 全球信任，主流浏览器都支持\n- 证书有效期90天，安全性更高（短有效期减少泄露风险）\n\n**缺点**：\n- 只提供域名验证（DV）证书，不提供企业验证（EV）证书\n- 证书有效期短（90天），需要自动续期\n- 对通配符证书支持有限（需要DNS验证）\n\n### 2. **HTTPS和HTTP有什么区别？**\n- **HTTP**：明文传输，数据可被窃取和篡改\n- **HTTPS**：加密传输，数据安全\n- **加密方式**：TLS/SSL协议，在HTTP下增加一层加密\n- **端口**：HTTP使用80端口，HTTPS使用443端口\n- **证书**：HTTPS需要SSL证书，由CA机构签发\n\n### 3. **什么是HSTS？为什么重要？**\n- **HSTS**：HTTP Strict Transport Security，强制浏览器使用HTTPS\n- **作用**：防止降级攻击（攻击者强制用户使用HTTP）\n- **配置**：`Strict-Transport-Security: max-age=63072000; includeSubDomains; preload`\n- **max-age**：浏览器记住使用HTTPS的时间（63072000秒=2年）\n- **preload**：提交到HSTS预加载列表，新用户首次访问也使用HTTPS\n\n### 4. **什么是OCSP Stapling？有什么好处？**\n- **OCSP**：Online Certificate Status Protocol，检查证书是否吊销\n- **问题**：传统OCSP需要浏览器向CA服务器查询，增加延迟和隐私风险\n- **OCSP Stapling**：服务器定期查询OCSP状态，并在TLS握手时\"钉\"在证书链中\n- **好处**：减少延迟、保护隐私、提高性能\n\n### 5. **Nginx配置中常见的安全头有哪些？**\n- `X-Frame-Options`：防止点击劫持，禁止页面被嵌入iframe\n- `X-Content-Type-Options`：防止MIME类型嗅探\n- `X-XSS-Protection`：启用浏览器XSS过滤器\n- `Content-Security-Policy`：定义允许加载资源的来源，防止XSS\n- `Referrer-Policy`：控制Referer头信息，保护用户隐私\n\n### 6. **证书过期了怎么办？有什么影响？**\n**影响**：\n- 浏览器显示安全警告，用户无法正常访问\n- SEO排名下降\n- API调用失败（很多API要求HTTPS）\n\n**解决方案**：\n1. 立即续期：`sudo certbot renew`\n2. 重启Nginx：`sudo systemctl reload nginx`\n3. 验证：浏览器访问网站，检查证书状态\n\n**预防措施**：\n- 配置自动续期（Certbot默认配置）\n- 监控证书过期时间（可用Prometheus监控）\n- 设置过期提醒（Certbot会发邮件提醒）\n\n### 7. **如何监控SSL证书状态？**\n```bash\n# 1. 使用openssl检查证书过期时间\nopenssl s_client -connect 域名:443 2>/dev/null | openssl x509 -noout -dates\n\n# 2. 使用Certbot检查\nsudo certbot certificates\n\n# 3. 编写监控脚本（可集成到Prometheus）\ncat > /opt/scripts/check_ssl.sh << 'EOF'\n#!/bin/bash\nDOMAIN=\"example.com\"\nEXPIRE_DATE=$(echo | openssl s_client -servername $DOMAIN -connect $DOMAIN:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)\nEXPIRE_EPOCH=$(date -d \"$EXPIRE_DATE\" +%s)\nCURRENT_EPOCH=$(date +%s)\nDAYS_LEFT=$(( ($EXPIRE_EPOCH - $CURRENT_EPOCH) / 86400 ))\necho \"SSL证书剩余天数: $DAYS_LEFT\"\nif [ $DAYS_LEFT -lt 30 ]; then\n    echo \"警告：证书即将过期！\"\n    # 发送告警（邮件/钉钉/企微）\nfi\nEOF\nchmod +x /opt/scripts/check_ssl.sh\n```\n\n## 🔧 故障排查\n\n### 问题1：证书申请失败\n```bash\n# 错误信息：DNS problem: NXDOMAIN looking up A for example.com\n# 原因：域名解析未生效\n# 解决：\nnslookup example.com  # 检查解析是否正确\ndig example.com       # 更详细的DNS查询\n# 等待DNS生效（通常5-10分钟）\n```\n\n### 问题2：Nginx配置错误\n```bash\n# 错误信息：nginx: [emerg] bind() to 0.0.0.0:80 failed (98: Address already in use)\n# 原因：80端口被占用\n# 解决：\nsudo lsof -i :80  # 查看占用80端口的进程\nsudo kill -9 <PID>  # 停止占用进程\nsudo systemctl restart nginx\n```\n\n### 问题3：HTTPS访问显示不安全\n```bash\n# 原因：混合内容（页面中加载了HTTP资源）\n# 解决：\n# 1. 检查浏览器控制台，找到HTTP资源\n# 2. 将所有资源改为HTTPS或相对协议\n# 3. 添加CSP头：Content-Security-Policy: upgrade-insecure-requests\n```\n\n## 📚 扩展学习\n\n### 1. 通配符证书申请\n```bash\n# 申请通配符证书（需要DNS验证）\nsudo certbot certonly --manual --preferred-challenges dns \\\n  -d \"*.example.com\" -d example.com\n\n# 按照提示添加DNS TXT记录\n# 验证：dig TXT _acme-challenge.example.com\n```\n\n### 2. 多域名证书（SAN证书）\n```bash\n# 申请包含多个域名的证书\nsudo certbot --nginx \\\n  -d example.com \\\n  -d www.example.com \\\n  -d api.example.com \\\n  -d mail.example.com\n```\n\n### 3. 使用ACME.sh（Certbot替代方案）\n```bash\n# 安装ACME.sh\ncurl https://get.acme.sh | sh\n\n# 申请证书\n~/.acme.sh/acme.sh --issue -d example.com -d www.example.com --webroot /var/www/html\n\n# 安装证书到Nginx\n~/.acme.sh/acme.sh --install-cert -d example.com \\\n  --key-file /etc/letsencrypt/live/example.com/privkey.pem \\\n  --fullchain-file /etc/letsencrypt/live/example.com/fullchain.pem \\\n  --reloadcmd \"systemctl reload nginx\"\n```\n\n## 相关笔记\n\n- [[20260730-CI-CD流水线搭建|CI/CD 流水线搭建]] — 证书自动部署可集成到CI/CD\n- [[20260730-Prometheus监控体系|Prometheus 监控体系]] — 监控证书过期状态\n- [[20260730-K8s容器编排实战|K8s 容器编排实战]] — 在K8s中管理证书\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-08-27T10:00:00"}, {"title": "AI Agent 智能助手实战", "path": "简历项目实战/02-AI项目/20260730-AI-Agent智能助手.md", "pillar": "projects", "status": "seedling", "summary": "> 基于 Function Calling 的 AI Agent 自动化助手 · 项目角色：独立设计开发 · 2026.XX\n>\n> - 针对「数据查询→整理→报表→发送」类重复性工作（单次 30 分钟），开发具备工具调用与多步规划能力的 AI Agent\n> - 封装 8+ 个工具（数据库查询、E", "content": "# AI Agent 智能助手 — 让模型自己干活\n\n## 📄 简历写法（可直接抄）\n\n> **基于 Function Calling 的 AI Agent 自动化助手** · 项目角色：独立设计开发 · 2026.XX\n>\n> - 针对「数据查询→整理→报表→发送」类重复性工作（单次 **30 分钟**），开发具备**工具调用与多步规划**能力的 AI Agent\n> - 封装 **8+ 个工具**（数据库查询、Excel 生成、邮件/钉钉发送、网页抓取等），Agent 自主拆解任务、按序调用、异常重试\n> - 单任务处理时间降至 **2 分钟**，准确率 **95%+**，人工只做最终确认，每周节省 **10+ 小时**重复劳动\n\n> [!tip] 旁批：Agent 和\"调了一次 API\"的区别（面试分水岭）\n> 很多人把\"LLM + 提示词\"叫 Agent，面试官一问就露馅。真 Agent 三个特征：**① 自主决策下一步做什么（规划）② 能调工具获取外部信息/执行动作 ③ 有反馈循环（工具结果再喂回模型继续推理）**。你的项目讲清这三点，就站在\"会调 API\"的人前面了。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它 |\n|------|------|------------|\n| DeepSeek/GLM-4 Function Calling | Agent 大脑 | 原生支持工具调用，国产便宜稳定 |\n| LangChain Agent / 手写 ReAct 循环 | 编排框架 | 学习阶段建议**手写 ReAct 循环**——理解原理后框架只是语法糖 |\n| SQLite/MySQL | 数据查询工具 | 任意业务库都行 |\n| openpyxl/pandas | 报表生成 | Python 数据处理标配 |\n| smtplib / 钉钉 Webhook | 结果送达 | 闭环的最后一公里 |\n| MCP（可选进阶） | 工具协议标准 | 2025 年后的新趋势，Anthropic 主导的\"工具 USB 接口\" |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 1：定义工具集（Agent 的\"手和脚\"）\n\n```python\n# tools.py —— 每个工具 = 一个函数 + 一段 JSON Schema 描述\nimport sqlite3\nimport pandas as pd\n\ndef query_sales_db(sql: str) -> str:\n    \"\"\"执行只读 SQL 查询，返回结果（最多 100 行）\"\"\"\n    if not sql.strip().lower().startswith(\"select\"):\n        return \"错误：仅允许 SELECT 查询\"     # 安全护栏！\n    conn = sqlite3.connect(\"sales.db\")\n    try:\n        df = pd.read_sql_query(sql + \" LIMIT 100\", conn)\n        return df.to_string(index=False)\n    finally:\n        conn.close()\n\ndef generate_excel(data: str, filename: str) -> str:\n    \"\"\"把 CSV 格式文本存成 Excel 文件\"\"\"\n    from io import StringIO\n    df = pd.read_csv(StringIO(data))\n    df.to_excel(f\"./output/{filename}\", index=False)\n    return f\"文件已生成: ./output/{filename}\"\n\ndef send_dingtalk(message: str) -> str:\n    \"\"\"发送钉钉消息到运营群\"\"\"\n    import requests\n    webhook = \"https://oapi.dingtalk.com/robot/send?access_token=xxx\"\n    requests.post(webhook, json={\"msgtype\": \"text\", \"text\": {\"content\": message}})\n    return \"已发送\"\n\n# ---- 工具的 JSON Schema 描述（模型靠这个理解工具）----\nTOOLS_SCHEMA = [\n    {\n        \"type\": \"function\",\n        \"function\": {\n            \"name\": \"query_sales_db\",\n            \"description\": \"查询销售数据库（SQLite）。表结构：sales(id, product, region, amount, date)\",\n            \"parameters\": {\n                \"type\": \"object\",\n                \"properties\": {\n                    \"sql\": {\"type\": \"string\", \"description\": \"SELECT 查询语句\"}\n                },\n                \"required\": [\"sql\"]\n            }\n        }\n    },\n    # ... generate_excel / send_dingtalk 的 schema 同理\n]\n\nTOOL_MAP = {\n    \"query_sales_db\": query_sales_db,\n    \"generate_excel\": generate_excel,\n    \"send_dingtalk\": send_dingtalk,\n}\n```\n\n> [!important] 旁批：description 写得好，模型才会用\n> Schema 里的 `description` 是模型决定\"何时用、怎么用\"这个工具的唯一依据。写\"查询数据库\"模型可能乱传 SQL；写清**表结构、字段含义、限制条件**，调用准确率立马上来。这和写提示词是同一门手艺。\n\n### 步骤 2：实现 Agent 主循环（ReAct 模式，项目灵魂）\n\n```python\n# agent.py\nimport json\nfrom openai import OpenAI\n\nclient = OpenAI(api_key=\"sk-xxx\", base_url=\"https://api.deepseek.com\")\n\nSYSTEM_PROMPT = \"\"\"你是一个运营数据助手。你可以使用工具完成任务。\n工作规则：\n1. 先分析任务需要哪几步，再逐步执行\n2. 调用工具失败时，分析原因并重试（最多 3 次）\n3. 数据相关的问题必须查数据库，禁止编造数字\n4. 完成后向用户汇报：做了什么、结果摘要、产出文件位置\"\"\"\n\ndef run_agent(user_task: str, max_steps: int = 10):\n    messages = [\n        {\"role\": \"system\", \"content\": SYSTEM_PROMPT},\n        {\"role\": \"user\", \"content\": user_task}\n    ]\n\n    for step in range(max_steps):\n        resp = client.chat.completions.create(\n            model=\"deepseek-chat\",\n            messages=messages,\n            tools=TOOLS_SCHEMA,        # 把工具集告诉模型\n            tool_choice=\"auto\"\n        )\n        msg = resp.choices[0].message\n\n        # ---- 情况 A：模型想调工具 ----\n        if msg.tool_calls:\n            messages.append(msg)     # 把模型的工具调用请求记入对话\n            for call in msg.tool_calls:\n                fn_name = call.function.name\n                fn_args = json.loads(call.function.arguments)\n                print(f\"[步骤{step+1}] 调用工具: {fn_name}({fn_args})\")\n\n                try:\n                    result = TOOL_MAP[fn_name](**fn_args)\n                except Exception as e:\n                    result = f\"工具执行出错: {e}\"   # 错误也喂回模型，让它自愈\n\n                messages.append({\n                    \"role\": \"tool\",\n                    \"tool_call_id\": call.id,\n                    \"content\": str(result)\n                })\n\n        # ---- 情况 B：模型给出最终答复，任务结束 ----\n        else:\n            print(f\"[完成] 共执行 {step+1} 步\")\n            return msg.content\n\n    return \"达到最大步数限制，任务未完全完成\"\n\n# ---- 使用 ----\nresult = run_agent(\n    \"查一下上个季度各区域的销售额，生成 Excel 报表，\"\n    \"然后把销量 TOP3 的区域和金额发到钉钉群\"\n)\nprint(result)\n```\n\n> [!important] 旁批：这个循环里藏着四个面试考点\n> 1. **工具结果回喂**：`role: \"tool\"` 的消息把执行结果放回对话，模型据此决定下一步——这就是\"反馈循环\"\n> 2. **错误自愈**：工具报错不中断，把错误信息给模型，它通常能修正参数重试——体现 Agent 的\"鲁棒性\"\n> 3. **max_steps 保险丝**：防止模型陷入死循环烧钱，生产必须设\n> 4. **全过程日志**：`[步骤N] 调用工具: xxx` 的轨迹既方便调试，也是给老板演示时的\"哇塞时刻\"\n\n### 步骤 3：加一道安全护栏（体现工程思维）\n\n```python\n# 危险操作二次确认\nDANGEROUS_TOOLS = {\"send_dingtalk\", \"send_email\"}\n\ndef confirm_before_run(fn_name, fn_args):\n    if fn_name in DANGEROUS_TOOLS:\n        print(f\"⚠️ 即将执行: {fn_name}\")\n        print(f\"   参数: {fn_args}\")\n        if input(\"   确认执行? (y/n): \").lower() != \"y\":\n            return \"用户取消了操作\"\n    return TOOL_MAP[fn_name](**fn_args)\n```\n\n> [!tip] 旁批：为什么\"外发类\"工具必须人工确认\n> 查数据出错可以重来，发错群/发错邮件收不回来。业界共识：**Agent 自主性的边界画在\"不可逆操作\"之前**。面试讲这句，证明你考虑过 Agent 落地的真实风险，不是只会跑 demo。\n\n### 步骤 4：定时任务化（真正\"替你上班\"）\n\n```python\n# 挂到系统定时任务，每周一 9:00 自动生成周报\n# Linux crontab:\n# 0 9 * * 1 /usr/bin/python3 /opt/agent/weekly_report.py\n\ndef weekly_report():\n    run_agent(\"\"\"\n        执行每周例行任务：\n        1. 查询上周销售额、订单量、客单价\n        2. 与上上周数据对比，计算环比\n        3. 生成 Excel 明细报表\n        4. 把核心指标和环比变化发到钉钉群\n    \"\"\")\n```\n\n## 📊 成果量化模板\n\n| 指标 | 人工处理 | Agent 处理 |\n|------|----------|------------|\n| 单次周报耗时 | 30 分钟 | 2 分钟（人工仅确认） |\n| 数据准确率 | 手工复制易错 | 直查库，95%+ |\n| 频率 | 累了就拖延 | 定时触发，永不偷懒 |\n| 每周节省 | — | 10+ 小时重复劳动 |\n\n## ❓ 面试高频问题\n\n1. **Agent 和固定工作流的区别？** → 工作流每一步是写死的；Agent 由模型**根据中间结果动态决定**下一步。任务路径可预测用工作流（便宜稳定），路径不确定才用 Agent（灵活但贵、有幻觉风险）——这句\"选型观\"很加分\n2. **怎么控制 Agent 不乱调工具？** → 工具白名单 + 危险操作人工确认 + max_steps 熔断 + 只读权限账号（数据库用 read-only 用户）\n3. **ReAct 是什么？** → Reasoning + Acting：模型先输出\"思考\"再决定\"动作\"，交替进行。Function Calling 是它的工程实现\n4. **多 Agent 了解吗？** → 复杂任务拆给不同专长的 Agent（研究员/写手/审校），由编排层协调。个人项目不必上，知道适用边界即可\n5. **MCP 是什么？** → 模型上下文协议，把\"工具接入\"标准化——工具方按 MCP 标准实现一次，所有支持 MCP 的模型都能用。类似 AI 工具界的 USB-C\n\n## 相关笔记\n\n- [[20260730-RAG企业知识库问答|RAG 企业知识库问答]] — RAG 可以封装成 Agent 的一个\"查知识\"工具\n- [[20260730-私有化LLM部署|私有化 LLM 部署]] — Agent 的大脑可以换成内网模型\n- [[20260730-CI-CD流水线搭建|CI/CD 流水线搭建]] — 运维场景也能做 Agent：自动巡检→分析→发报告\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "LLM 微调实战（LoRA）", "path": "简历项目实战/02-AI项目/20260730-LLM微调实战.md", "pillar": "projects", "status": "seedling", "summary": "> 垂直领域大模型 LoRA 微调 · 项目角色：独立完成 · 2026.XX\n>\n> - 针对通用大模型在垂直领域（如：医疗问答/法务咨询/客服话术） 专业术语理解弱、回复风格不符的问题，基于 LLaMA-Factory + LoRA 微调 Qwen2.5-7B\n> - 构建 3000+ 条高质量", "content": "# LoRA 微调实战 — 消费级 GPU 定制行业模型\n\n## 📄 简历写法（可直接抄）\n\n> **垂直领域大模型 LoRA 微调** · 项目角色：独立完成 · 2026.XX\n>\n> - 针对通用大模型在**垂直领域（如：医疗问答/法务咨询/客服话术）** 专业术语理解弱、回复风格不符的问题，基于 **LLaMA-Factory + LoRA** 微调 Qwen2.5-7B\n> - 构建 **3000+ 条**高质量指令数据集（含清洗、去重、格式统一），在单张 RTX 4090 上完成训练（成本 < ¥50）\n> - 领域问答准确率从 **62% 提升至 89%**，术语使用规范度显著提升，并通过 **vLLM 部署上线**提供服务\n\n> [!tip] 旁批：什么时候该微调、什么时候别微调（面试第一问）\n> **该微调**：需要模型学会特定风格/术语/格式（客服话术、病历文书、代码规范），且这些知识稳定不变\n> **不该微调**：知识频繁更新（今天的产品价目表明天就过时）→ 用 RAG；通用能力缺失（模型本身不会推理）→ 换更强的基座模型\n> 一句话：**微调教\"怎么说话\"，RAG 教\"说什么话\"**。讲出这句，面试官就知道你不是跟风跑了个脚本。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它 |\n|------|------|------------|\n| LLaMA-Factory | 微调框架 | 国产开源、Web UI 零代码、支持 LoRA/QLoRA 全参，社区活跃 |\n| Qwen2.5-7B-Instruct | 基座模型 | 中文最强 7B，Apache 2.0 可商用 |\n| LoRA / QLoRA | 高效微调方法 | 只训练 0.1%~1% 参数，单卡可跑，效果接近全参 |\n| RTX 4090 / AutoDL | 训练硬件 | 7B LoRA 需 ~16GB 显存；AutoDL 按需租用 ~¥1.5/时 |\n| 自构数据集 | 训练燃料 | 项目成败 80% 在数据质量 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 1：构建数据集（最花时间的环节，占 60%）\n\n```json\n// data/domain_qa.json —— Alpaca 指令格式\n[\n  {\n    \"instruction\": \"患者问：感冒持续一周不退烧怎么办？\",\n    \"input\": \"\",\n    \"output\": \"持续一周不退烧提示可能并非普通感冒，建议：\\n1. 尽快就医检查血常规+C反应蛋白，明确感染类型\\n2. 排查流感、肺炎等并发症\\n3. 就医前注意休息、多饮水\\n⚠️ 本建议仅供参考，具体诊疗请遵医嘱。\"\n  },\n  {\n    \"instruction\": \"把这段客服对话改写成标准安抚话术\",\n    \"input\": \"客户：你们的产品太烂了，我要投诉！\",\n    \"output\": \"非常抱歉给您带来了不好的体验，您反馈的问题我已详细记录。为尽快帮您解决，方便提供一下订单号吗？我会在 24 小时内给您答复。\"\n  }\n]\n```\n\n> [!important] 旁批：数据质量 > 数据数量（核心认知）\n> - **1000 条精品 > 10000 条垃圾**：错误、重复、风格不一的数据会\"教坏\"模型\n> - **格式必须统一**：输出都要带\"\\n1. xxx\\n2. xxx\"就全带，别有的分点有的不分\n> - **去重**：近重复样本（语义相似度 > 0.9）会让模型过拟合这几句\n> - 数据来源：真实业务日志脱敏 > 强模型（GPT-4/DeepSeek）生成 > 手工编写。个人练习可用强模型生成 + 人工抽检\n> - 面试追问\"你的 3000 条怎么来的\"——必须答得出构建流程，这是微调项目的真实性检验\n\n### 步骤 2：租卡 + 装环境（10 分钟）\n\n```bash\n# AutoDL 租一张 RTX 4090（选 PyTorch 2.x 镜像）\n# 安装 LLaMA-Factory\ngit clone https://github.com/hiyouga/LLaMA-Factory.git\ncd LLaMA-Factory\npip install -e \".[torch,metrics]\"\n\n# 验证 GPU\npython -c \"import torch; print(torch.cuda.is_available(), torch.cuda.get_device_name(0))\"\n```\n\n### 步骤 3：配置训练（Web UI 或 YAML 二选一）\n\n```bash\n# 方式一：Web UI（推荐给初学者，可视化配置）\nllamafactory-cli webui\n# 浏览器打开 http://localhost:7860\n\n# 方式二：YAML 命令行（可复现，适合简历展示）\n```\n\n```yaml\n# train_lora.yaml\nmodel_name_or_path: Qwen/Qwen2.5-7B-Instruct\nstage: sft                        # 监督微调\ndo_train: true\nfinetuning_type: lora\nlora_rank: 16                     # LoRA 秩：越大能力越强但越易过拟合\nlora_alpha: 32                    # 一般设为 rank 的 2 倍\nlora_target: all                  # 所有线性层都挂 LoRA\ndataset: domain_qa                # 在 dataset_info.json 注册你的数据集\ntemplate: qwen                    # 对话模板必须和基座模型匹配！\ncutoff_len: 2048\nlearning_rate: 1.0e-4             # LoRA 经典学习率\nnum_train_epochs: 3               # 3 轮足够，多了过拟合\nper_device_train_batch_size: 4\ngradient_accumulation_steps: 4    # 等效 batch_size = 4×4 = 16\nbf16: true                        # 4090 支持 bf16，训练更稳\noutput_dir: saves/qwen-lora-v1\nlogging_steps: 10\nsave_steps: 500\n```\n\n```bash\nllamafactory-cli train train_lora.yaml\n# 7B + LoRA + 3000 条数据：约 1~2 小时，花费 ~¥3\n```\n\n> [!important] 旁批：三个最容易翻车的参数\n> 1. **`template` 必须匹配基座模型**（Qwen 用 qwen，LLaMA 用 llama3）——配错了模型输出会胡言乱语，这是新手第一坑\n> 2. **学习率**：LoRA 用 1e-4，全参微调用 1e-5~2e-5，差一个数量级；LoRA 用全参的学习率会不收敛\n> 3. **epoch 不是越多越好**：3 轮左右最佳，10 轮以上基本都在背答案（过拟合），表现为\"训练集完美、新问题翻车\"\n\n### 步骤 4：评估效果（没有评估的微调等于没做）\n\n```bash\n# 1. 训练曲线：loss 应平稳下降（LLaMA-Factory 自动生成 loss 图）\n#    正常：0.9 → 0.3 缓降；异常：一开始就 0.01（数据泄露/过拟合）\n\n# 2. 构建 50 道领域测试题（不能出现在训练集里！），微调前后各测一次\n```\n\n```python\n# eval.py —— 简易对比评估\nfrom openai import OpenAI\n\nclient = OpenAI(base_url=\"http://localhost:8000/v1\", api_key=\"EMPTY\")\n\ntest_cases = [\n    {\"q\": \"患者问：感冒药和降压药能一起吃吗？\", \n     \"keywords\": [\"遵医嘱\", \"间隔\", \"相互作用\"]},  # 期望答案包含的要点\n    # ... 50 道\n]\n\ndef score(model_name):\n    hit = 0\n    for c in test_cases:\n        resp = client.chat.completions.create(\n            model=model_name,\n            messages=[{\"role\": \"user\", \"content\": c[\"q\"]}],\n            temperature=0.1\n        ).choices[0].message.content\n        if all(k in resp for k in c[\"keywords\"]):\n            hit += 1\n    return hit / len(test_cases)\n\n# 微调前: 62%  →  微调后: 89%  ← 这个数字就是简历上的\n```\n\n> [!tip] 旁批：测试集绝对不能进训练集\n> 这是机器学习的基本纪律，但微调时特别容易犯——数据是一起收集的，没分开。泄漏的后果：评估分数虚高（95%+），上线就露馅。简历上写\"构建独立测试集评估\"，懂行的面试官会点头。\n\n### 步骤 5：合并权重 + 部署（闭环）\n\n```bash\n# LoRA 产出的是\"适配器\"（只有几百 MB），要合并进基座模型\nllamafactory-cli export \\\n  --model_name_or_path Qwen/Qwen2.5-7B-Instruct \\\n  --adapter_name_or_path saves/qwen-lora-v1 \\\n  --export_dir models/qwen-domain-v1 \\\n  --export_size 2 \\\n  --export_legacy_format False\n\n# 用你私有化部署项目里的 vLLM 直接加载\ndocker run -d --gpus all -p 8000:8000 \\\n  -v $(pwd)/models:/models \\\n  vllm/vllm-openai:latest \\\n  --model /models/qwen-domain-v1\n```\n\n至此完成闭环：**数据 → 训练 → 评估 → 部署 → 服务**。面试时可以画完整链路图。\n\n## 📊 成果量化模板\n\n| 指标 | 微调前（基座） | 微调后 |\n|------|----------------|--------|\n| 领域问答准确率 | 62% | 89% |\n| 术语规范度 | 口语化/随意 | 符合行业规范 |\n| 训练成本 | — | ¥3（AutoDL 1.5h） |\n| 部署方式 | — | vLLM，单卡 4090 |\n\n## ❓ 面试高频问题\n\n1. **LoRA 原理？** → 冻结原模型权重，在旁路训练一对低秩矩阵（A×B），用低秩分解近似权重更新量。16 秩的 LoRA 只需训练原模型 ~0.3% 的参数\n2. **LoRA rank 怎么选？** → 8~64 常用。任务和基座差异小（风格调整）→ 8~16；差异大（新领域知识）→ 32~64。太大过拟合且失去省显存的意义\n3. **QLoRA 是什么？** → 基座模型先量化到 4bit 再挂 LoRA，显存需求再降一半，单卡 24G 可微调 32B——代价是轻微精度损失\n4. **SFT 之后还有 DPO/RLHF，了解吗？** → SFT 教模型\"怎么答\"，DPO/RLHF 教模型\"哪个答案更好\"（偏好对齐）。垂直场景 SFT 通常够用，回答质量有明确优劣对时再上 DPO\n5. **微调后模型忘了通用能力怎么办？** → 灾难性遗忘。对策：混入 10~20% 通用指令数据一起训练；降低学习率和 epoch；或干脆只 LoRA（基座权重没动，随时摘掉适配器还原）\n\n## 相关笔记\n\n- [[20260730-私有化LLM部署|私有化 LLM 部署]] — 微调产出的模型用 vLLM 部署，两个项目天然串联\n- [[20260730-RAG企业知识库问答|RAG 企业知识库问答]] — 微调 vs RAG 的选型对比是面试经典题\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "RAG 企业知识库问答系统", "path": "简历项目实战/02-AI项目/20260730-RAG企业知识库问答.md", "pillar": "projects", "status": "seedling", "summary": "> 基于 RAG 的企业知识库智能问答系统 · 项目角色：全栈独立完成 · 2026.XX\n>\n> - 针对内部文档分散、新人查找知识平均耗时 20 分钟/次 的问题，基于 LangChain + 向量数据库 + 国产大模型 搭建检索增强问答系统\n> - 完成「文档解析 → 智能切分 → 向量化 →", "content": "# RAG 企业知识库问答 — 当前最热的 AI 落地项目\n\n## 📄 简历写法（可直接抄）\n\n> **基于 RAG 的企业知识库智能问答系统** · 项目角色：全栈独立完成 · 2026.XX\n>\n> - 针对内部文档分散、新人查找知识平均耗时 **20 分钟/次** 的问题，基于 **LangChain + 向量数据库 + 国产大模型** 搭建检索增强问答系统\n> - 完成「文档解析 → 智能切分 → 向量化 → 混合检索 → 重排序 → 答案生成」全链路，支持 **5000+ 页** PDF/Word/Markdown 文档\n> - 问答首查命中率 **85%+**，知识获取时间从 20 分钟降至 **30 秒**，并支持答案溯源（点击跳转原文段落），有效抑制模型幻觉\n\n> [!tip] 旁批：为什么 RAG 是简历第一 AI 项目\n> 三个原因：① 它是企业 AI 落地的**第一大场景**（几乎每个公司都在做）；② 技术栈覆盖广——你能在 15 分钟面试里讲完从数据到前端的完整链路；③ 门槛低天花板高——跑通 demo 只要 200 行代码，但优化点（切分策略、混合检索、重排、幻觉抑制）每一个都能展开深聊，面试官往深挖你有东西接。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它（面试考点） |\n|------|------|------------------------|\n| LangChain / LlamaIndex | RAG 编排框架 | 生态最全，组件化（加载器、切分器、检索器可插拔） |\n| Chroma / Milvus | 向量数据库 | Chroma 零部署适合起步；Milvus 分布式支持亿级向量，简历上写 Milvus 更硬 |\n| BGE-M3 / text-embedding-3 | 文本向量化 | BGE-M3 中文效果第一梯队且**开源免费**，支持稠密+稀疏混合 |\n| DeepSeek / GLM-4 / Qwen | 答案生成 LLM | 国产 API 便宜（DeepSeek 百万 token 几块钱）、中文好、无需特殊网络 |\n| BGE-Reranker | 检索结果重排序 | 检索粗排 + 重排精排是工业标配，召回质量提升明显 |\n| FastAPI + Streamlit | 后端接口 + 前端界面 | Streamlit 50 行出可交互 demo，FastAPI 负责生产接口 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 0：环境准备\n\n```bash\n# Python 3.10+\npip install langchain langchain-community chromadb \\\n            sentence-transformers pypdf python-docx \\\n            fastapi uvicorn streamlit openai\n```\n\n### 步骤 1：文档加载与智能切分\n\n```python\n# ingest.py —— 文档入库管线\nfrom langchain_community.document_loaders import PyPDFLoader, Docx2txtLoader\nfrom langchain.text_splitter import RecursiveCharacterTextSplitter\nfrom pathlib import Path\n\ndef load_documents(doc_dir: str):\n    docs = []\n    for f in Path(doc_dir).rglob(\"*\"):\n        if f.suffix == \".pdf\":\n            docs.extend(PyPDFLoader(str(f)).load())\n        elif f.suffix == \".docx\":\n            docs.extend(Docx2txtLoader(str(f)).load())\n    return docs\n\n# 切分：中文场景的关键参数\nsplitter = RecursiveCharacterTextSplitter(\n    chunk_size=500,           # 每块 500 字\n    chunk_overlap=80,         # 块间重叠 80 字，防止语义被切断\n    separators=[\"\\n\\n\", \"\\n\", \"。\", \"；\", \"，\", \" \"],  # 中文分隔符优先\n)\n\ndocs = load_documents(\"./company_docs\")\nchunks = splitter.split_documents(docs)\nprint(f\"共切分 {len(chunks)} 个块\")\n```\n\n> [!important] 旁批：切分是 RAG 效果的第一变量\n> - **chunk_size 太大**：一块里混入多个主题，向量表达\"什么都像什么都不像\"，检索不准\n> - **太小**：语义不完整，\"报销流程的第三步是…\"单独一块，检索到了也答不全\n> - **overlap 的意义**：一句话被切在两半时，重叠区保证至少有一块含完整语义\n> - 中文一定要把 `。；` 加进 separators，否则会按空格乱切（中文没空格）\n> - 面试深挖就讲**语义切分**（按 embedding 相似度找切点）作为进一步优化方向\n\n### 步骤 2：向量化与入库\n\n```python\n# 用开源 BGE-M3，本地跑不花钱\nfrom langchain_community.embeddings import HuggingFaceEmbeddings\nfrom langchain_community.vectorstores import Chroma\n\nembeddings = HuggingFaceEmbeddings(\n    model_name=\"BAAI/bge-m3\",\n    model_kwargs={\"device\": \"cpu\"},      # 有 GPU 改 cuda，快 10 倍\n    encode_kwargs={\"normalize_embeddings\": True}  # 归一化后用余弦相似度\n)\n\nvectordb = Chroma.from_documents(\n    documents=chunks,\n    embedding=embeddings,\n    persist_directory=\"./chroma_db\"\n)\nvectordb.persist()\n```\n\n### 步骤 3：检索 + 重排 + 生成（核心链路）\n\n```python\n# qa.py\nfrom langchain_community.vectorstores import Chroma\nfrom openai import OpenAI\n\n# ---- 1. 向量检索（粗排）----\nretriever = vectordb.as_retriever(\n    search_type=\"similarity\",\n    search_kwargs={\"k\": 10}          # 先捞 10 个候选\n)\n\n# ---- 2. 重排序（精排）----\nfrom sentence_transformers import CrossEncoder\nreranker = CrossEncoder(\"BAAI/bge-reranker-v2-m3\")\n\ndef retrieve_and_rerank(query: str, top_k: int = 3):\n    candidates = retriever.get_relevant_documents(query)\n    pairs = [[query, doc.page_content] for doc in candidates]\n    scores = reranker.predict(pairs)\n    ranked = sorted(zip(candidates, scores), key=lambda x: x[1], reverse=True)\n    return [doc for doc, _ in ranked[:top_k]]\n\n# ---- 3. 组装 Prompt 生成答案 ----\nclient = OpenAI(\n    api_key=\"sk-你的key\",\n    base_url=\"https://api.deepseek.com\"   # DeepSeek API\n)\n\ndef ask(question: str):\n    docs = retrieve_and_rerank(question)\n    context = \"\\n\\n---\\n\\n\".join(\n        f\"[文档{i+1}] {d.page_content}\\n来源: {d.metadata.get('source')}\"\n        for i, d in enumerate(docs)\n    )\n    prompt = f\"\"\"你是企业知识库助手。仅根据以下参考资料回答问题：\n1. 答案中标注引用来源，如[文档1]\n2. 资料中没有的内容，明确说\"知识库中未找到相关信息\"，不要编造\n3. 回答简洁，分点呈现\n\n参考资料：\n{context}\n\n问题：{question}\"\"\"\n\n    resp = client.chat.completions.create(\n        model=\"deepseek-chat\",\n        messages=[{\"role\": \"user\", \"content\": prompt}],\n        temperature=0.1          # 低温度，求稳不求创意\n    )\n    return resp.choices[0].message.content, docs\n\nanswer, sources = ask(\"报销流程需要哪些审批节点？\")\nprint(answer)\n```\n\n> [!important] 旁批：抑制幻觉的三道防线（面试必考）\n> 1. **Prompt 约束**：明确\"只根据资料回答，没有就说没有\"——成本最低，先做这个\n> 2. **低 temperature**：0.1~0.3，减少自由发挥\n> 3. **答案溯源**：每句话标注引用文档编号，用户可点击核验——这既是信任机制，也倒逼模型贴着资料说话\n>\n> 加上 reranker 后召回准确率通常提升 10~20%，这是\"检索粗排+重排精排\"两段式架构的价值。\n\n### 步骤 4：Streamlit 前端（50 行出 demo）\n\n```python\n# app.py\nimport streamlit as st\n\nst.set_page_config(page_title=\"企业知识库问答\", page_icon=\"📚\")\nst.title(\"📚 企业知识库智能问答\")\n\nif \"history\" not in st.session_state:\n    st.session_state.history = []\n\nquestion = st.chat_input(\"请输入问题…\")\nif question:\n    with st.spinner(\"检索中…\"):\n        answer, sources = ask(question)\n    st.session_state.history.append((question, answer, sources))\n\nfor q, a, srcs in st.session_state.history:\n    with st.chat_message(\"user\"):\n        st.write(q)\n    with st.chat_message(\"assistant\"):\n        st.write(a)\n        with st.expander(\"📎 查看引用来源\"):\n            for i, d in enumerate(srcs):\n                st.caption(f\"[文档{i+1}] {d.metadata.get('source')}\")\n                st.text(d.page_content[:200] + \"…\")\n```\n\n```bash\nstreamlit run app.py\n# 浏览器打开 http://localhost:8501 即可问答\n```\n\n### 步骤 5：FastAPI 生产接口（对接前端/钉钉/企微）\n\n```python\n# api.py\nfrom fastapi import FastAPI\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass Query(BaseModel):\n    question: str\n\n@app.post(\"/ask\")\ndef ask_api(q: Query):\n    answer, sources = ask(q.question)\n    return {\n        \"answer\": answer,\n        \"sources\": [{\"file\": d.metadata.get(\"source\")} for d in sources]\n    }\n```\n\n## 📊 成果量化模板\n\n| 指标 | 系统上线前 | 上线后 |\n|------|------------|--------|\n| 单次知识查找 | 翻文档/问同事 ~20 分钟 | 30 秒 |\n| 答案准确率 | — | 首查命中 85%+ |\n| 覆盖文档 | 散落 N 个网盘/群文件 | 5000+ 页统一索引 |\n| 幻觉控制 | 裸 LLM 经常编造 | 溯源机制 + 低温度，可控 |\n\n## ❓ 面试高频问题\n\n1. **RAG 和微调怎么选？** → 知识更新频繁/需要溯源 → RAG；需要改变模型行为风格/术语习惯 → 微调；实际项目两者常结合（先微调行业术语，再 RAG 挂实时知识）\n2. **向量检索为什么不直接用关键词？** → 关键词匹配不懂语义（\"辞退\"和\"解除劳动合同\"是同一个意思但零重合词）；向量检索懂语义但漏精确匹配（工号、法条编号）→ 工业界做法是 **BM25 + 向量混合检索**\n3. **怎么评估 RAG 系统效果？** → 构建测试问题集，看召回率（对的文档有没有被检索到）和答案忠实度（RAGAS 框架可自动化评估）\n4. **文档更新了怎么办？** → 增量索引：按文件哈希判断是否变化，只重建变化文档的向量\n5. **长文档怎么处理？** → 层级索引（先检索章节摘要，再下钻到块）或父子切分（小块检索、大块喂给模型保证上下文完整）\n\n## 相关笔记\n\n- [[20260730-私有化LLM部署|私有化 LLM 部署]] — 把 DeepSeek API 换成内网本地模型，满足数据合规\n- [[20260730-AI-Agent智能助手|AI Agent 智能助手]] — 把 RAG 问答作为 Agent 的一个工具，是自然的下一步\n- [[20260730-LLM微调实战|LoRA 微调实战]] — 检索再好答不好时，就该微调出场了\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "私有化 LLM 部署实战", "path": "简历项目实战/02-AI项目/20260730-私有化LLM部署.md", "pillar": "projects", "status": "seedling", "summary": "> 大模型私有化推理平台建设 · 项目角色：独立完成 · 2026.XX\n>\n> - 针对业务数据禁止出内网的合规要求，基于 vLLM + 开源大模型（Qwen2.5/DeepSeek-R1） 搭建私有化推理服务\n> - 通过 量化（AWQ/GPTQ）+ 连续批处理（Continuous Batch", "content": "# 私有化 LLM 部署 — 数据不出内网的合规方案\n\n## 📄 简历写法（可直接抄）\n\n> **大模型私有化推理平台建设** · 项目角色：独立完成 · 2026.XX\n>\n> - 针对业务数据**禁止出内网**的合规要求，基于 **vLLM + 开源大模型（Qwen2.5/DeepSeek-R1）** 搭建私有化推理服务\n> - 通过 **量化（AWQ/GPTQ）+ 连续批处理（Continuous Batching）** 优化，单卡 RTX 4090 支撑 **20+ 并发**，首 token 延迟 < 1s\n> - 提供 **OpenAI 兼容 API**，上层应用零改造切换；配套 Prometheus 监控 QPS/延迟/GPU 利用率\n\n> [!tip] 旁批：这个项目为什么\"值钱\"\n> 金融、政务、医疗行业**必须**私有化部署（数据合规是红线），但会部署 + 调优 + 监控大模型服务的人远少于会调 API 的人。这是 AI 岗和运维岗的**交叉稀缺技能**——运维背景的人做这个项目，比纯算法背景的人更有优势（服务化、监控、高可用是你的主场）。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它 |\n|------|------|------------|\n| vLLM | 高性能推理引擎 | PagedAttention 显存管理 + 连续批处理，吞吐比原生高 **5~10 倍** |\n| Ollama | 轻量本地部署 | 一条命令跑模型，开发调试神器，不适合高并发生产 |\n| Qwen2.5-7B/14B | 开源基座模型 | 中文最强开源模型之一，Apache 2.0 可商用 |\n| DeepSeek-R1-Distill | 推理模型 | 蒸馏版 7B/14B 可单卡跑，推理能力强 |\n| Open WebUI | 开箱即用对话界面 | 类 ChatGPT 界面，接 Ollama/OpenAI 兼容 API |\n| GPU（RTX 4090/A6000） | 推理硬件 | 4090 24G 是性价比之王；无卡可租 AutoDL（~¥1.5/时） |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 0：摸清硬件账（先算再跑）\n\n| 模型规模 | FP16 显存 | INT8 量化 | INT4 量化 | 可行的卡 |\n|----------|-----------|-----------|-----------|----------|\n| 7B | ~14GB | ~8GB | ~5GB | 4090(24G) 轻松，3060(12G) 量化可行 |\n| 14B | ~28GB | ~15GB | ~9GB | 4090 需量化 |\n| 32B | ~64GB | ~34GB | ~20GB | 4090 INT4 勉强，A6000(48G) 稳 |\n| 70B | ~140GB | ~72GB | ~40GB | 双卡 A6000 / A100 |\n\n> [!important] 旁批：显存估算公式（面试高频）\n> **参数量 × 每参数字节数**。FP16 每参数 2 字节 → 7B × 2B = 14GB；INT4 量化每参数 0.5 字节 → 7B 只要 3.5GB（加上 KV Cache 和框架开销实际 ~5GB）。KV Cache 随并发数增长，这是并发上不去的根本原因——vLLM 的 PagedAttention 就是解决这个问题的。\n\n### 步骤 1：Ollama 快速验证（5 分钟跑起来）\n\n```bash\n# 安装（Linux）\ncurl -fsSL https://ollama.com/install.sh | sh\n\n# 拉模型并运行\nollama pull qwen2.5:7b\nollama run qwen2.5:7b \"用一句话解释什么是 RAG\"\n\n# Ollama 自带 OpenAI 兼容接口\ncurl http://localhost:11434/v1/chat/completions \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"model\": \"qwen2.5:7b\", \"messages\": [{\"role\":\"user\",\"content\":\"你好\"}]}'\n```\n\n### 步骤 2：vLLM 生产级部署（核心）\n\n```bash\n# Docker 一条命令起 OpenAI 兼容服务\ndocker run -d --name vllm-server \\\n  --gpus all \\\n  -p 8000:8000 \\\n  -v ~/.cache/huggingface:/root/.cache/huggingface \\\n  vllm/vllm-openai:latest \\\n  --model Qwen/Qwen2.5-7B-Instruct \\\n  --max-model-len 8192 \\\n  --gpu-memory-utilization 0.9 \\\n  --quantization awq                  # 量化省显存\n```\n\n```python\n# 调用方式和 OpenAI API 完全一致——这就是\"零改造切换\"\nfrom openai import OpenAI\nclient = OpenAI(base_url=\"http://服务器IP:8000/v1\", api_key=\"EMPTY\")\nresp = client.chat.completions.create(\n    model=\"Qwen/Qwen2.5-7B-Instruct\",\n    messages=[{\"role\": \"user\", \"content\": \"写一个 Python 快排\"}]\n)\n```\n\n> [!tip] 旁批：三个关键启动参数\n> - `--gpu-memory-utilization 0.9`：vLLM 预分配 90% 显存做 KV Cache 池，给小了并发上不去，给大了模型加载不了\n> - `--max-model-len`：上下文窗口，设小一点（8192 vs 32768）KV Cache 池能容纳更多并发会话\n> - `--quantization awq`：AWQ 是激活感知量化，比 naive INT4 掉点少；精度敏感场景换 `--quantization fp8`（4090 支持）\n\n### 步骤 3：并发压测（量化成果的来源）\n\n```bash\n# 用 vLLM 官方 benchmark 工具\npip install vllm\n\npython -m vllm.entrypoints.openai.benchmark_serving \\\n  --backend openai \\\n  --model Qwen/Qwen2.5-7B-Instruct \\\n  --host localhost --port 8000 \\\n  --num-prompts 200 \\\n  --request-rate 10\n\n# 关注输出：\n# Throughput: XX tokens/s     ← 总吞吐\n# TTFT (Time To First Token)  ← 首 token 延迟，影响体感\n# TPOT (Time Per Output Token)← 生成速度\n```\n\n### 步骤 4：挂 Open WebUI 提供对话界面\n\n```bash\ndocker run -d --name open-webui \\\n  -p 3000:8080 \\\n  -e OPENAI_API_BASE_URL=http://host.docker.internal:8000/v1 \\\n  -e OPENAI_API_KEY=EMPTY \\\n  -v open-webui:/app/backend/data \\\n  ghcr.io/open-webui/open-webui:main\n\n# 浏览器打开 http://服务器IP:3000 → 类 ChatGPT 界面，支持多用户/RAG/联网\n```\n\n### 步骤 5：Prometheus 监控推理服务（运维差异化优势）\n\nvLLM 原生暴露 `/metrics` 端点，直接接入你监控项目里的 Prometheus：\n\n```yaml\n# prometheus.yml 增加一个 job\nscrape_configs:\n  - job_name: \"vllm\"\n    static_configs:\n      - targets: [\"服务器IP:8000\"]\n    metrics_path: /metrics\n```\n\n可监控指标：`vllm:num_requests_running`（当前并发）、`vllm:gpu_cache_usage_perc`（KV Cache 占用率）、`vllm:time_to_first_token_seconds` 等。\n\n> [!tip] 旁批：KV Cache 占用率是扩容量信号\n> `gpu_cache_usage_perc` 长期 > 80% 说明并发快到顶了，新请求会排队——这时候该加卡或换量化方案。把这条做成 Grafana 告警，就是你简历上\"AI 服务可观测性\"的实证。\n\n## 📊 成果量化模板\n\n| 指标 | 数据 |\n|------|------|\n| 支撑并发 | 单卡 4090，20+ 并发会话 |\n| 首 token 延迟 | < 1s（P99 < 2s） |\n| 生成速度 | 40+ tokens/s/会话 |\n| 数据安全 | 全链路内网，0 外传 |\n| 成本 | 一次性硬件投入 vs API 按量计费，月调用量 > X 次后更省 |\n\n## ❓ 面试高频问题\n\n1. **vLLM 为什么快？** → PagedAttention：像操作系统管理内存页一样管理 KV Cache，消除显存碎片；Continuous Batching：不等整批结束，完成一个插进一个，GPU 不空转\n2. **量化损失多少精度？** → AWQ INT4 在多数任务上掉 1~3 个点，远小于显存收益；精度敏感场景用 FP8/INT8\n3. **并发上不去怎么排查？** → 看 KV Cache 占用率（显存瓶颈）→ 降 max-model-len / 上量化 / 加卡；看 GPU util（计算瓶颈）→ 换更强卡或更小的模型\n4. **Ollama 和 vLLM 怎么选？** → Ollama：个人开发、单机低并发、求简单；vLLM：生产、高并发、要监控和 SLA——讲出这个边界说明你理解\"工具服务于场景\"\n5. **模型文件怎么管理？** → 公司场景一般从内网 HuggingFace 镜像站（hf-mirror）或对象存储拉取，配合版本目录管理，回滚 = 切版本目录\n\n## 相关笔记\n\n- [[20260730-RAG企业知识库问答|RAG 企业知识库问答]] — 本地模型作为 RAG 的生成端，全链路内网闭环\n- [[20260730-Prometheus监控体系|Prometheus 监控体系]] — 监控方案直接复用，AI 服务只是新的 job\n- [[20260730-LLM微调实战|LoRA 微调实战]] — 部署自己微调过的模型是最终形态\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "Ansible 实操课·第 1 课 — 环境搭建与核心概念", "path": "简历项目实战/03-Ansible实操课/第01课-环境搭建与核心概念.md", "pillar": "projects", "status": "seedling", "summary": "> 本课目标：① 脑子里有 Ansible 的工作模型 ② 电脑上有一个能跑的 Ansible 环境 ③ 亲手跑通第一条命令", "content": "# 第 1 课：环境搭建与核心概念\n\n> 本课目标：① 脑子里有 Ansible 的工作模型 ② 电脑上有一个能跑的 Ansible 环境 ③ 亲手跑通第一条命令\n\n## 一、先记住三个词（全部概念的地基）\n\n| 概念 | 是什么 | 生活类比 |\n|------|--------|----------|\n| **控制节点** | 装了 ansible 的机器（你的电脑） | 导演 |\n| **被管节点** | 被操作的远程机器（只开 SSH，零安装） | 演员 |\n| **Playbook** | YAML 写的任务清单（要什么状态） | 剧本 |\n\n执行一次任务时发生的事：\n\n```\n导演（控制节点）按剧本 → 把任务翻译成小脚本 → 通过 SSH 发给每个演员\n→ 演员各自执行 → 回报结果：ok（本来就是这样）或 changed（我改好了）\n```\n\n> [!tip] 旁批：为什么「无 agent」是杀手锏\n> 竞品（Puppet/SaltStack）要求先在每台被管机器上装客户端——可\"装客户端\"这件事本身就得逐台登录做一遍，鸡生蛋问题。Ansible 走 SSH，而**每台 Linux 天生就有 SSH**，所以零准备直接开工。\n\n## 二、环境搭建（Windows 用户路线）\n\nAnsible 官方不支持 Windows 做控制端，我们用 **WSL2**（Windows 里的完整 Linux，微软官方方案）。\n\n### 步骤 1：安装 WSL2 + Ubuntu（一次性，需重启）\n\n**右键开始菜单 → 终端管理员（或 Windows PowerShell 管理员）**，执行：\n\n```powershell\nwsl --install\n```\n\n> [!tip] 旁批：这一条命令做了四件事\n> ① 启用「适用于 Linux 的 Windows 子系统」功能 ② 启用「虚拟机平台」功能 ③ 下载 WSL2 内核 ④ 安装默认 Ubuntu 发行版。执行完**重启电脑**才会生效。\n\n### 步骤 2：首次启动 Ubuntu\n\n重启后，开始菜单找到 **Ubuntu** 打开，第一次启动会要求：\n\n```\nEnter new UNIX username:  （小写英文，如 lin）\nNew password:             （输入时不显示，正常的，放心敲）\n```\n\n> [!warning] 旁批：密码输入不显示\n> Linux 终端输密码**没有任何回显**（没有星号），这是安全设计不是卡死。输完直接回车。这个密码以后 `sudo` 时要用，记牢。\n\n### 步骤 3：在 Ubuntu 里装 Ansible\n\n```bash\n# 更新软件源（让 apt 知道最新的软件清单，类似手机应用商店刷新）\nsudo apt update\n\n# 安装 Ansible\nsudo apt install -y ansible\n\n# 验证：看到版本号即成功\nansible --version\n```\n\n> [!tip] 旁批：apt 是什么\n> Ubuntu 的包管理器，相当于 Linux 的应用商店命令行版。`apt install` 会自动处理依赖。`sudo` = 以管理员身份执行（安装软件需要管理员权限）。\n\n### 步骤 4：跑通第一条 Ansible 命令\n\n```bash\n# 让 Ansible 管理「本机」练手（localhost 也需要 ssh 或用 local 模式）\nansible localhost -m ping -c local\n```\n\n期望输出：\n\n```\nlocalhost | SUCCESS => {\n    \"changed\": false,\n    \"ping\": \"pong\"\n}\n```\n\n> [!important] 逐段拆解这条命令（这就是\"每段代码都讲清楚\"）\n> - `ansible` —— 调起 ansible 主程序（ad-hoc 模式：临时执行一条命令，不写剧本）\n> - `localhost` —— 目标机器：本机（从 inventory 名单里选，localhost 是内置默认名）\n> - `-m ping` —— `-m` = module（模块），`ping` 模块：测试目标机器是否可被 Ansible 管理（不是网络 ping！它测的是\"SSH 通不通 + Python 在不在\"）\n> - `-c local` —— connection 插件选 local：本机练习时不走 SSH，直接本地执行\n> - 输出 `SUCCESS` + `pong` —— 控制端和被管端握手成功，Ansible 工作的最小闭环跑通了\n\n## 三、验证清单（打勾即过关）\n\n- [ ] `wsl` 命令可用，开始菜单有 Ubuntu\n- [ ] Ubuntu 内 `ansible --version` 有输出\n- [ ] `ansible localhost -m ping -c local` 返回 SUCCESS\n\n## 四、本课术语表\n\n| 术语 | 含义 |\n|------|------|\n| ad-hoc | 临时命令模式：`ansible 目标 -m 模块`，不写剧本，用于一次性操作 |\n| inventory | 主机名单：登记哪些机器归 Ansible 管、怎么分组 |\n| module | 模块：Ansible 的功能单元（ping/apt/copy/service…），每个模块保证幂等 |\n| playbook | 剧本：YAML 文件，把多个模块编排成完整任务 |\n| WSL2 | Windows Subsystem for Linux：Windows 内运行完整 Linux 的官方方案 |\n\n## 下节课预告\n\n**第 2 课：Inventory 名单 + ad-hoc 批量命令** —— 学会给机器分组，体验\"一条命令，多台机器同时执行\"的快感，并用 ad-hoc 完成真实操作（查磁盘、装软件、起服务）。\n\n## 相关笔记\n\n- [[20260730-Ansible自动化运维|Ansible 项目总览（简历写法）]]\n- [[00-底层逻辑图解|8 个项目底层逻辑]]\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-31T09:20:00"}, {"title": "Linux文件系统与权限", "path": "Linux学习/02-基础概念/20260905-Linux文件系统与权限.md", "pillar": "linux", "status": "seedling", "summary": "Linux 使用一棵从 / 开始的目录树。路径分为绝对路径和相对路径：绝对路径从 / 开始，相对路径以当前目录为参照。", "content": "# Linux 文件系统与权限\n\n## 一、路径与文件系统\n\nLinux 使用一棵从 `/` 开始的目录树。路径分为绝对路径和相对路径：绝对路径从 `/` 开始，相对路径以当前目录为参照。\n\n| 目录 | 用途 |\n|---|---|\n| `/etc` | 系统和服务配置 |\n| `/var/log` | 经常变化的数据与日志 |\n| `/home` | 普通用户的家目录 |\n| `/tmp` | 临时文件 |\n| `/usr/bin` | 大多数用户态命令 |\n| `/proc` | 内核提供的进程和运行时信息 |\n| `/dev` | 设备文件 |\n\n常用探索命令：\n\n```bash\npwd                         # 查看当前目录\nls -lah                     # 查看详细目录内容，包括隐藏文件\nfind /var/log -type f -name '*.log' 2>/dev/null\ndu -sh ./*                  # 查看当前目录下各项占用空间\ndf -h                       # 查看文件系统整体空间\n```\n\n## 二、用户、组与权限\n\n每个文件都至少有三组权限：所有者（user）、所属组（group）、其他用户（other）。权限数字为读 `4`、写 `2`、执行 `1` 的相加值。\n\n```text\n-rwxr-x---\n │  │  │\n │  │  └─ other：--- = 0\n │  └──── group：r-x = 5\n └─────── user ：rwx = 7\n```\n\n因此 `chmod 750 deploy.sh` 表示所有者可读写执行，组用户可读执行，其他用户无权限。目录的执行权限表示「能否进入并访问其中的条目」，不只是运行文件。\n\n```bash\nid                         # 查看当前用户、组和 UID/GID\nls -l deploy.sh            # 查看所有者、组和权限\nchmod u+x deploy.sh        # 给所有者增加执行权限\nchmod 640 app.conf         # 配置文件常见的安全权限\nchown app:app app.log      # 修改所有者和所属组，需要相应权限\n```\n\n## 三、排错原则\n\n1. 先确认自己在哪：`pwd`、`whoami`、`id`。\n2. 再确认目标是什么：`ls -ld path`、`file path`、`stat path`。\n3. 最后按最小权限修改，不要为了省事直接使用 `chmod -R 777`。\n\n> [!warning] 安全提醒\n> `sudo` 会扩大命令权限。执行删除、递归修改权限或修改系统配置前，先用 `pwd`、`ls` 和 `--dry-run`（如果命令支持）确认目标。\n\n## 一句话带走\n\n> Linux 权限问题的核心不是「多试几个 chmod」，而是分清路径、用户、组、权限和进程实际身份。\n\n## 相关笔记\n\n- [[20260905-Linux进程与服务]]\n- [[20260905-Linux练习题-基础篇]]\n- [[Linux学习迭代任务]]", "created": "2026-09-05T00:00:00"}, {"title": "Linux网络与排错", "path": "Linux学习/02-基础概念/20260905-Linux网络与排错.md", "pillar": "linux", "status": "seedling", "summary": "网络问题不要凭感觉反复重启。可以从「本机接口 → 路由 → DNS → TCP 端口 → 应用协议」逐层验证。", "content": "# Linux 网络与排错\n\n## 一、先分层，再执行命令\n\n网络问题不要凭感觉反复重启。可以从「本机接口 → 路由 → DNS → TCP 端口 → 应用协议」逐层验证。\n\n```bash\nip addr                     # 网卡和 IP 地址\nip route                    # 路由表和默认网关\nping -c 4 127.0.0.1        # 验证本机协议栈\nping -c 4 <网关 IP>          # 验证局域网连通性\nping -c 4 1.1.1.1           # 验证外网 IP 连通性\ngetent hosts example.com    # 验证 DNS 解析\n```\n\n## 二、端口与连接\n\n端口是传输层的入口。监听端口只能说明程序绑定了端口，不代表应用一定能正确处理请求。\n\n```bash\nss -lntp                   # TCP 监听端口及关联进程\nss -ant                    # 全部 TCP 连接状态\ncurl -I http://127.0.0.1:8080  # 验证 HTTP 响应\nnc -vz 127.0.0.1 22       # 验证 TCP 端口是否可达\n```\n\n常见状态：`LISTEN` 表示监听，`ESTAB` 表示已建立连接，`TIME-WAIT` 是连接关闭后的正常等待状态。不要看到 `TIME-WAIT` 就直接调内核参数，先确认是否真的影响业务。\n\n## 三、实用排错路径\n\n以「网页打不开」为例：\n\n1. `curl -I URL`：先看是否能得到 HTTP 响应。\n2. `getent hosts 域名`：确认域名是否解析到预期地址。\n3. `ip route get 目标 IP`：确认流量走哪条路由。\n4. `ss -lntp`：服务是否监听正确地址和端口。\n5. `journalctl -u 服务名`：查看服务日志。\n6. 检查防火墙、安全组、反向代理和应用日志。\n\n## 一句话带走\n\n> 网络排错要把「解析失败、路由失败、端口不通、协议报错、应用异常」分开验证，每一步都留下证据。\n\n## 相关笔记\n\n- [[20260905-Linux进程与服务]]\n- [[20260905-Linux文件系统与权限]]\n- [[20260905-Linux练习题-基础篇]]", "created": "2026-09-05T00:00:00"}, {"title": "Linux进程与服务", "path": "Linux学习/02-基础概念/20260905-Linux进程与服务.md", "pillar": "linux", "status": "seedling", "summary": "进程是程序运行后的实例，每个进程都有 PID、父进程、用户、状态和资源占用。", "content": "# Linux 进程与服务\n\n## 一、进程观察\n\n进程是程序运行后的实例，每个进程都有 PID、父进程、用户、状态和资源占用。\n\n```bash\nps aux                       # 查看当前系统进程\nps -ef --forest              # 查看父子进程关系\ntop                          # 实时查看 CPU、内存和负载\npgrep -af nginx              # 按名称查找 PID 和完整命令\n```\n\n排查时先记录 PID，再看命令和日志，不要一上来就 `kill -9`。常见信号包括：`SIGTERM`（15，礼貌请求退出）、`SIGKILL`（9，无法捕获的强制终止）和 `SIGHUP`（1，常用于重新加载配置）。\n\n```bash\nkill -TERM <PID>             # 优先请求程序自行退出\nkill -KILL <PID>             # 程序失控时最后使用\njobs -l                      # 查看当前 Shell 的后台任务\nfg %1                        # 将后台任务带回前台\n```\n\n## 二、systemd 服务\n\n现代 Linux 常用 `systemd` 管理系统服务。`systemctl` 管理生命周期，`journalctl` 查看日志。\n\n```bash\nsystemctl status ssh         # 查看服务状态\nsudo systemctl restart ssh   # 重启服务\nsudo systemctl enable --now ssh  # 设置开机启动并立即启动\njournalctl -u ssh -n 50 --no-pager\njournalctl -u ssh --since '1 hour ago'\n```\n\n「进程存在」不等于「服务健康」。服务排错通常按以下顺序：\n\n1. `systemctl status 服务名`：是否启动、是否反复崩溃。\n2. `journalctl -u 服务名`：启动失败的直接原因。\n3. `ss -lntp`：是否监听预期端口。\n4. 配置检查命令和应用自身日志：配置语法、依赖和权限是否正确。\n\n## 三、资源与信号的边界\n\n- CPU 高：先用 `top` 定位进程，再查看线程、请求和日志。\n- 内存高：区分真实占用、缓存和 OOM；查看 `free -h` 与 `dmesg`。\n- 磁盘满：查看 `df -h`（文件系统）和 `du -xhd1`（目录），两者回答的问题不同。\n- 服务异常：先优雅停止和保留现场，再决定是否强杀。\n\n## 一句话带走\n\n> 进程是运行实例，服务是可管理的运行单元；`ps/top` 看现状，`systemctl/journalctl` 查服务生命周期和原因。\n\n## 相关笔记\n\n- [[20260905-Linux文件系统与权限]]\n- [[20260905-Linux网络与排错]]\n- [[20260905-Linux练习题-基础篇]]", "created": "2026-09-05T00:00:00"}, {"title": "Linux练习题-基础篇", "path": "Linux学习/03-练习题/20260905-Linux练习题-基础篇.md", "pillar": "linux", "status": "seedling", "summary": "> 建议：先在 Ubuntu/Debian 虚拟机、WSL 或容器中完成。涉及 sudo、删除和改权限的题目只在练习环境执行。", "content": "# Linux 练习题：基础篇\n\n> 建议：先在 Ubuntu/Debian 虚拟机、WSL 或容器中完成。涉及 `sudo`、删除和改权限的题目只在练习环境执行。\n\n## 练习清单\n\n1. 显示当前目录、当前用户和当前内核版本。\n2. 在 `/tmp` 创建 `linux-lab/logs`，再创建一个空文件 `app.log`。\n3. 找出当前目录下最近修改的 5 个文件。\n4. 将 `app.log` 的权限设置为所有者可读写、其他人无权限。\n5. 用一条命令统计 `app.log` 的行数、单词数和字节数。\n6. 查找占用当前目录空间最大的 3 个项目。\n7. 找出名为 `sshd` 的进程，并输出 PID 和完整命令。\n8. 查看本机正在监听的 TCP 端口及对应进程。\n9. 验证 `example.com` 是否能解析，并查看 HTTP 响应头。\n10. 使用管道筛选当前进程列表中包含 `python` 的行。\n11. 解释 `chmod 640 config.ini` 中的 `640` 分别代表什么。\n12. 某服务启动失败时，写出你会执行的 3 个排错命令，并说明顺序。\n\n## 参考答案\n\n<details>\n<summary>展开参考命令<\/summary>\n\n```bash\n# 1\npwd && whoami && uname -r\n\n# 2\nmkdir -p /tmp/linux-lab/logs && touch /tmp/linux-lab/logs/app.log\n\n# 3（GNU/Linux）\nfind . -type f -printf '%T@ %p\\n' | sort -nr | head -n 5\n\n# 4\nchmod 600 /tmp/linux-lab/logs/app.log\n\n# 5\nwc -l -w -c /tmp/linux-lab/logs/app.log\n\n# 6\ndu -xhd1 . 2>/dev/null | sort -hr | head -n 3\n\n# 7\npgrep -af sshd\n\n# 8\nss -lntp\n\n# 9\ngetent hosts example.com && curl -I https://example.com\n\n# 10\nps aux | grep '[p]ython'\n```\n\n`chmod 640` 的含义是：所有者 `6 = 4+2`，即读写；所属组 `4`，即只读；其他用户 `0`，即无权限。\n\n服务启动失败可以按「状态 → 日志 → 端口/配置」排查，例如：\n\n```bash\nsystemctl status <服务名>\njournalctl -u <服务名> -n 50 --no-pager\nss -lntp\n```\n\n<\/details>\n\n## 自评标准\n\n- **入门**：能独立完成 1～6 题，并说清 `640` 与 `600` 的区别。\n- **合格**：能完成 1～10 题，遇到命令失败会保留错误输出。\n- **进阶**：能把第 12 题写成自己的排错清单，并在下一轮迭代中补充真实案例。\n\n## 相关笔记\n\n- [[20260905-Linux文件系统与权限]]\n- [[20260905-Linux进程与服务]]\n- [[20260905-Linux网络与排错]]\n- [[Linux学习迭代任务]]", "created": "2026-09-05T00:00:00"}, {"title": "Linux学习迭代任务", "path": "Linux学习/04-迭代任务/Linux学习迭代任务.md", "pillar": "linux", "status": "project", "summary": "> 目标：每周完成「学一个概念、做一组练习、记录一次排错、升级一篇笔记」的最小闭环。旧的知识汇出、周回顾和 dashboard 重建任务继续运行，不与本计划冲突。", "content": "# Linux 学习迭代任务\n\n> 目标：每周完成「学一个概念、做一组练习、记录一次排错、升级一篇笔记」的最小闭环。旧的知识汇出、周回顾和 dashboard 重建任务继续运行，不与本计划冲突。\n\n## 当前迭代：第 1 周｜命令行与基础排错\n\n**周期：2026-09-05 ～ 2026-09-11**\n\n- [ ] 阅读并用自己的话复述 [[20260905-Linux文件系统与权限]]\n- [ ] 完成 [[20260905-Linux练习题-基础篇]] 第 1～6 题\n- [ ] 完成一次文件权限实验：创建用户/组或使用现有用户验证 `640`、`750`\n- [ ] 完成一次进程与端口观察：记录 `ps`、`ss` 的输出和结论\n- [ ] 将一个真实报错写入本页「问题记录」\n- [ ] 周回顾时把一条可靠结论从 `seedling` 升级为 `evergreen`\n\n## 后续迭代队列\n\n### 第 2 周：进程、systemd 与日志\n\n- [ ] 熟悉 `systemctl status/restart/enable` 和 `journalctl -u`\n- [ ] 模拟一个服务启动失败，按「状态 → 日志 → 端口」顺序排错\n- [ ] 补充一篇「服务异常排错案例」永久笔记\n\n### 第 3 周：网络、DNS 与端口\n\n- [ ] 用 `ip`、`ss`、`curl`、`getent` 完成一条端到端排错链路\n- [ ] 区分 DNS 失败、端口未监听和 HTTP 状态码异常\n- [ ] 将练习题扩展到 20 题，并标注易错点\n\n### 第 4 周：Shell 自动化与复盘\n\n- [ ] 编写一个带参数、退出码和日志的 Shell 脚本\n- [ ] 用 `shellcheck` 检查脚本并修复至少 3 个问题\n- [ ] 汇总一个月的命令清单，整理为可复用永久笔记\n\n## 问题记录\n\n| 日期 | 现象 / 命令 | 原因 | 解决方案 | 是否沉淀为笔记 |\n|---|---|---|---|---|\n| 2026-09-05 | 待记录 | 待确认 | 待处理 | [ ] |\n\n## 每周验收\n\n- [ ] `python _系统/03-脚本/知识汇出.py` 已生成本周汇出\n- [ ] `python _系统/03-脚本/周回顾.py` 已生成本周回顾\n- [ ] Linux MOC 已补充新链接\n- [ ] 至少 1 个 Linux 知识点从练习结果中得到验证\n- [ ] 至少 1 篇 seedling 已评估是否升级为 evergreen\n\n## 相关工作流\n\n- [[_系统/04-工作流/每日快速捕获]]：把命令输出、错误和疑问先放入收件箱。\n- [[_系统/04-工作流/每周回顾]]：每周自动生成回顾并检查 MOC。\n- [[_系统/04-工作流/知识汇出-2026-08-07]]：历史汇出报告示例。", "created": "2026-09-05T00:00:00"}];

/* ---------- 登录守卫与存储工具 ----------
 * file:// 协议下各页面 localStorage 相互隔离：
 * 登录态由登录页通过 URL hash 编码接力，本页接收后存入自己的存储区 */
function lsGet(key){ try{ return JSON.parse(localStorage.getItem(key)); }catch{ return null; } }
function lsSet(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function lsDel(key){ try{ localStorage.removeItem(key); }catch(e){} }
function encodeUser(u){ return btoa(encodeURIComponent(JSON.stringify(u))); }
function decodeUser(s){ try{ return JSON.parse(decodeURIComponent(atob(s))); }catch{ return null; } }

const curUser = (() => {
  // 0. 退出标记：清除本页登录态
  if (location.hash.indexOf('out=1') !== -1) {
    lsDel('zsk.user');
    history.replaceState(null, '', location.pathname + location.search);
    return null;
  }
  // 1. 本页已存有登录态（刷新/再次进入时直接命中）
  let u = lsGet('zsk.user');
  if (u) return u;
  // 2. 从 URL hash 接力登录态（来自登录页或另一功能页的跳转）
  const m = location.hash.match(/u=([^&]+)/);
  if (m) {
    u = decodeUser(m[1]);
    if (u && u.name) {
      lsSet('zsk.user', u);
      history.replaceState(null, '', location.pathname + location.search);
      return u;
    }
  }
  return null;
})();

/* ======== 打卡摘要（联动 今日打卡.html 的数据） ======== */
function renderCheckinStrip(){
  const uid = curUser ? (curUser.account || curUser.name || 'guest') : 'guest';
  const d = new Date();
  const todayStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let todayData = null;
  try { todayData = JSON.parse(localStorage.getItem('checkin.today.'+uid)); } catch {}
  let history = {};
  try { history = JSON.parse(localStorage.getItem('checkin.history.'+uid)) || {}; } catch {}

  // 连续打卡天数
  let streak = 0, cur = new Date(d);
  const rateOf = items => items.length ? items.filter(t=>t.done).length/items.length : 0;
  if (todayData && todayData.date === todayStr && rateOf(todayData.items) >= (todayData.goal||80)/100) streak = 1;
  cur.setDate(cur.getDate()-1);
  for(;;){ const h = history[cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0')];
    if (h && h.success) { streak++; cur.setDate(cur.getDate()-1); } else break; }

  const done = todayData && todayData.date===todayStr ? todayData.items.filter(t=>t.done).length : 0;
  const total = todayData && todayData.date===todayStr ? todayData.items.length : 0;
  document.getElementById('csTitle').textContent = done
    ? `今日已完成 ${done}/${total} 项`
    : (total ? '今日任务待完成' : '今日还没有计划');
  document.getElementById('csSub').textContent = `🔥 已连续打卡 ${streak} 天`;
}

function renderStats() {
  const total = notes.length;
  const bp = {}; notes.forEach(n => bp[n.pillar]=(bp[n.pillar]||0)+1);
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="stat-top"><div class="icon-box ib-34 lavender"><i class="fa-solid fa-file-lines"></i></div><div class="stat-label">总笔记</div></div><div class="stat-value">${total}</div></div>
    <div class="stat-card"><div class="stat-top"><div class="icon-box ib-34 sky"><i class="fa-brands fa-python"></i></div><div class="stat-label">Python</div></div><div class="stat-value">${bp.python||0}</div></div>
    <div class="stat-card"><div class="stat-top"><div class="icon-box ib-34 lavender"><i class="fa-solid fa-robot"></i></div><div class="stat-label">AI</div></div><div class="stat-value">${bp.ai||0}</div></div>
    <div class="stat-card"><div class="stat-top"><div class="icon-box ib-34 mint"><i class="fa-solid fa-server"></i></div><div class="stat-label">运维</div></div><div class="stat-value">${bp.devops||0}</div></div>
    <div class="stat-card"><div class="stat-top"><div class="icon-box ib-34 peach"><i class="fa-solid fa-rocket"></i></div><div class="stat-label">简历项目</div></div><div class="stat-value">${bp.projects||0}</div></div>
    <div class="stat-card"><div class="stat-top"><div class="icon-box ib-34 rose"><i class="fa-solid fa-terminal"></i></div><div class="stat-label">Linux</div></div><div class="stat-value">${bp.linux||0}</div></div>`;
  document.getElementById("totalNotesFooter").textContent = total;
}

function renderPillars() {
  document.getElementById("pillarGrid").innerHTML = Object.entries(pillars).map(([id,p]) => {
    const count = notes.filter(n=>n.pillar===id).length;
    const m = pillarMeta[id] || { icon:"fa-solid fa-book", light:"#eceaf3" };
    return `<div class="pillar-card p-${id}" onclick="filterByPillar('${id}')">
      <div class="pillar-top">
        <div class="icon-box ib-34" style="background:${m.light};color:${p.color}"><i class="${m.icon}"></i></div>
        <h3>${p.emoji} ${p.name}</h3>
        <span class="pillar-count">${count} 篇</span>
      </div>
      <div class="pillar-desc">${p.desc}</div></div>`;
  }).join("");
}

function renderNotes() {
  let filtered = notes;
  if (currentFilter !== "all") filtered = filtered.filter(n=>n.pillar===currentFilter);
  if (searchQuery) { const q=searchQuery.toLowerCase();
    filtered = filtered.filter(n=>n.title.toLowerCase().includes(q)||n.summary.toLowerCase().includes(q)); }
  if (!filtered.length) { document.getElementById("notesList").innerHTML=`<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i>没有匹配的笔记</div>`; return; }
  document.getElementById("notesList").innerHTML = filtered.map((n,i) => {
    const sc=statusColors[n.status]||statusColors.seedling;
    const isActive = activeNote===n.path;
    return `<div class="note-item ${isActive?'active':''}" onclick="openNote('${encodeURIComponent(n.path)}')">
      <div class="note-pillar-dot" style="background:${pillars[n.pillar]?.color||'#999'}"></div>
      <div class="note-info"><div class="note-title">${n.title}</div><div class="note-path">${n.path}</div></div>
      <div class="note-status-tag" style="background:${sc.bg};color:${sc.color}">${sc.label}</div></div>`;
  }).join("");
}

/* ======== 打开笔记 ======== */
function openNote(encodedPath) {
  const path = decodeURIComponent(encodedPath);
  const note = notes.find(n=>n.path===path);
  if (!note) return;
  activeNote = path;
  renderNotes();
  const sc = statusColors[note.status]||statusColors.seedling;
  const html = marked.parse(note.content||"*暂无内容*");
  document.getElementById("readerPanel").innerHTML = `
    <div class="reader-header">
      <div class="reader-title">${note.title}</div>
      <div class="reader-meta">
        <span class="tag" style="background:${sc.bg};color:${sc.color}">${sc.label}</span>
        <span class="path">${note.path}</span>
      </div>
      <div class="reader-actions">
        <button class="btn-obsidian" onclick="event.stopPropagation();openInObsidian('${encodeURIComponent(path)}')"><i class="fa-solid fa-pen-to-square"></i> 在 Obsidian 中编辑</button>
      </div>
    </div>
    <div class="reader-body">${html}</div>`;
  document.getElementById("readerPanel").scrollTop = 0;
}

function openInObsidian(encodedPath) {
  const path = decodeURIComponent(encodedPath).replace(/\.md$/,"");
  window.location.href = `obsidian://open?vault=${encodeURIComponent("知识库")}&file=${encodeURIComponent(path)}`;
}

/* ======== 筛选 ======== */
document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active"); currentFilter=btn.dataset.filter; renderNotes();
  });
});
document.getElementById("searchInput").addEventListener("input",e=>{ searchQuery=e.target.value; renderNotes(); });
function filterByPillar(id){ currentFilter=id;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.toggle("active",b.dataset.filter===id));
  renderNotes(); document.getElementById("notesList").scrollIntoView({behavior:"smooth",block:"start"}); }

/* ======== 图表 ======== */
function renderCharts() {
  const bp={}; notes.forEach(n=>bp[n.pillar]=(bp[n.pillar]||0)+1);
   new Chart(document.getElementById("pillarChart"),{type:"bar",data:{labels:["Python","AI学习","运维学习","简历项目","Linux"],datasets:[{data:[bp.python||0,bp.ai||0,bp.devops||0,bp.projects||0,bp.linux||0],backgroundColor:["#7ab4d9","#a78bda","#6bc4a6","#e8a87c","#e8889a"],borderRadius:8,barThickness:30}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1,precision:0},grid:{color:"#eceaf3"}},x:{grid:{display:false}}}}});
  const bs={}; notes.forEach(n=>bs[n.status]=(bs[n.status]||0)+1);
  new Chart(document.getElementById("statusChart"),{type:"doughnut",data:{labels:["Seedling 🌱","Evergreen 🌳","Permanent ⚡","Project 🎯"],datasets:[{data:[bs.seedling||0,bs.evergreen||0,bs.permanent||0,bs.project||0],backgroundColor:["#6bc4a6","#a78bda","#e4c56a","#e8a87c"],borderWidth:0,hoverOffset:6}]},options:{responsive:true,cutout:"62%",plugins:{legend:{position:"bottom",labels:{padding:14,usePointStyle:true,pointStyleWidth:10}}}}});
}

/* ======== 退出登录 ======== */
function logout(){
  if (!confirm('确定退出登录吗？本地打卡数据仍会保留。')) return;
  lsDel('zsk.user');
  location.href = 'login.html#out=1';
}

/* ======== 用户信息渲染 ======== */
function renderUser(){
  if (!curUser) return;
  const name = curUser.name || '学习者';
  document.getElementById("userName").textContent = name;
  document.getElementById("userAvatar").textContent = name.slice(0,1).toUpperCase();
}

/* ======== 初始化 ======== */
/* 先保证核心功能与用户信息渲染，图表放最后且容错（CDN 未加载时不中断页面） */
renderStats(); renderPillars(); renderNotes(); renderCheckinStrip(); renderUser();
try { renderCharts(); } catch(e) { console.warn('图表组件未就绪，跳过渲染:', e.message); }
</script>
</body>
</html>
