<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库仪表盘 · 自生长知识库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  /* ===== 马卡龙六色设计系统（源自 html-beautifier）===== */
  :root {
    --rose-500:#e8889a;  --rose-100:#fdf0f3;  --rose-deep:#c45a65;
    --mint-500:#6bc4a6;  --mint-100:#edf9f4;  --mint-deep:#3d8e72;
    --lavender-500:#a78bda; --lavender-100:#f3eefb; --lavender-deep:#6b4fa0;
    --butter-500:#e4c56a; --butter-100:#fdf8e8; --butter-deep:#b89520;
    --sky-500:#7ab4d9;   --sky-100:#edf5fb;   --sky-deep:#3a7aaa;
    --peach-500:#e8a87c; --peach-100:#fdf3ec; --peach-deep:#c47530;
    --ink-900:#1a1a2e; --ink-800:#2d2b3d; --ink-600:#4a4862; --ink-500:#6b6880; --ink-400:#908da3; --ink-200:#d8d6e3; --ink-100:#eceaf3;
    --base-50:#fafbfc;
    --card-border:#e8e6ef;
    --card-shadow:0 1px 3px rgba(100,80,140,.04), 0 4px 16px rgba(100,80,140,.05);
    --radius:16px; --radius-sm:10px;
  }
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  body{
    font-family:'Noto Sans SC','DM Sans',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--base-50); color:var(--ink-900); line-height:1.7;
  }
  .page{ max-width:1200px; margin:0 auto; padding:0 20px 40px; }

  /* ===== 顶部导航 ===== */
  .topnav{ display:flex; align-items:center; gap:18px; padding:14px 0; border-bottom:1px solid var(--card-border); margin-bottom:26px; }
  .topnav .logo{ display:flex; align-items:center; gap:10px; font-family:'Noto Serif SC',serif; font-weight:700; font-size:16px; }
  .topnav .logo .icon-box{ width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--lavender-500),var(--sky-500));
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; }
  .nav-links{ display:flex; gap:6px; margin-left:12px; }
  .nav-links a{ text-decoration:none; color:var(--ink-500); font-size:13.5px; font-weight:500; padding:7px 14px; border-radius:20px; }
  .nav-links a.active{ background:var(--lavender-100); color:var(--lavender-deep); font-weight:600; }
  .nav-user{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,var(--peach-500),var(--rose-500));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
  .nav-user .uname{ font-size:13px; font-weight:600; color:var(--ink-600); }
  .btn-logout{ background:none; border:1px solid var(--card-border); color:var(--ink-400); font-size:12px;
    padding:5px 12px; border-radius:16px; cursor:pointer; font-family:inherit; }
  .btn-logout:hover{ border-color:var(--rose-500); color:var(--rose-deep); }

  /* ===== Hero ===== */
  .hero{ background:#fff; border:1px solid var(--card-border); border-radius:var(--radius);
    box-shadow:var(--card-shadow); padding:30px 34px; margin-bottom:16px; }
  .hero-eyebrow{ display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; letter-spacing:.08em;
    color:var(--lavender-deep); background:var(--lavender-100); padding:4px 12px; border-radius:14px; text-transform:uppercase; }
  .hero h1{ font-family:'Noto Serif SC',serif; font-size:30px; font-weight:900; margin:10px 0 6px; }
  .hero h1 .gt{ background:linear-gradient(90deg,var(--lavender-500),var(--sky-500)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero .sub{ font-size:13.5px; color:var(--ink-500); }
  .hero-row{ display:flex; align-items:flex-start; gap:24px; flex-wrap:wrap; }
  .checkin-strip{ margin-left:auto; display:flex; align-items:center; gap:14px; background:linear-gradient(120deg,var(--lavender-100),var(--sky-100));
    border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:14px 20px; min-width:280px; }
  .checkin-strip .cs-icon{ width:42px; height:42px; border-radius:12px; background:#fff; color:var(--lavender-deep);
    display:flex; align-items:center; justify-content:center; font-size:19px; box-shadow:var(--card-shadow); }
  .checkin-strip .cs-main b{ display:block; font-family:'DM Sans',sans-serif; font-size:17px; }
  .checkin-strip .cs-main span{ font-size:11.5px; color:var(--ink-500); }
  .checkin-strip .btn-go{ white-space:nowrap; text-decoration:none; font-size:12.5px; font-weight:600; color:#fff;
    background:linear-gradient(90deg,var(--lavender-500),var(--sky-500)); padding:8px 15px; border-radius:9px; }

  /* ===== 统计卡 ===== */
  .stats-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:16px; }
  .stat-card{ background:#fff; border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:16px 18px; box-shadow:var(--card-shadow); }
  .stat-top{ display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .icon-box{ border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ib-34{ width:34px; height:34px; font-size:14px; }
  .ib-30{ width:30px; height:30px; font-size:13px; border-radius:8px; }
  .icon-box.rose{ background:var(--rose-100); color:var(--rose-deep); }
  .icon-box.mint{ background:var(--mint-100); color:var(--mint-deep); }
  .icon-box.sky{ background:var(--sky-100); color:var(--sky-deep); }
  .icon-box.butter{ background:var(--butter-100); color:var(--butter-deep); }
  .icon-box.lavender{ background:var(--lavender-100); color:var(--lavender-deep); }
  .icon-box.peach{ background:var(--peach-100); color:var(--peach-deep); }
  .stat-label{ font-size:11.5px; color:var(--ink-400); font-weight:600; }
  .stat-value{ font-family:'DM Sans',sans-serif; font-size:26px; font-weight:700; line-height:1.2; }

  /* ===== 章节 ===== */
  .sec-head{ display:flex; align-items:center; gap:9px; margin-bottom:4px; }
  .sec-head h2{ font-family:'Noto Serif SC',serif; font-size:17px; font-weight:700; }
  .sec-head .hint{ margin-left:auto; font-size:11.5px; color:var(--ink-400); font-weight:400; }
  .divider{ height:2px; width:44px; border-radius:2px; background:linear-gradient(90deg,var(--lavender-500),var(--sky-500)); margin:6px 0 14px; }
  .sec-block{ margin-bottom:22px; }

  /* ===== 支柱卡（白底 + 彩色点缀）===== */
  .pillar-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .pillar-card{ position:relative; background:#fff; border:1px solid var(--card-border); border-radius:var(--radius);
    box-shadow:var(--card-shadow); padding:18px 20px; cursor:pointer; overflow:hidden; }
  .pillar-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; }
  .pillar-card.p-python::before{ background:linear-gradient(90deg,var(--sky-500),var(--sky-100)); }
  .pillar-card.p-ai::before{ background:linear-gradient(90deg,var(--lavender-500),var(--lavender-100)); }
  .pillar-card.p-devops::before{ background:linear-gradient(90deg,var(--mint-500),var(--mint-100)); }
  .pillar-card.p-projects::before{ background:linear-gradient(90deg,var(--peach-500),var(--peach-100)); }
  .pillar-card.p-linux::before{ background:linear-gradient(90deg,var(--rose-500),var(--rose-100)); }
  .pillar-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .pillar-top h3{ font-size:15.5px; font-weight:700; flex:1; }
  .pillar-count{ font-family:'DM Sans',sans-serif; font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px; }
  .p-python .pillar-count{ background:var(--sky-100); color:var(--sky-deep); }
  .p-ai .pillar-count{ background:var(--lavender-100); color:var(--lavender-deep); }
  .p-devops .pillar-count{ background:var(--mint-100); color:var(--mint-deep); }
  .p-projects .pillar-count{ background:var(--peach-100); color:var(--peach-deep); }
  .p-linux .pillar-count{ background:var(--rose-100); color:var(--rose-deep); }
  .pillar-desc{ font-size:11.5px; color:var(--ink-500); line-height:1.7; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* ===== 笔记浏览器 ===== */
  .browser-wrap{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:960px){ .browser-wrap{ grid-template-columns:390px 1fr; } }
  .notes-list-panel{ background:#fff; border:1px solid var(--card-border); border-radius:var(--radius); box-shadow:var(--card-shadow); overflow:hidden; display:flex; flex-direction:column; max-height:76vh; }
  .notes-toolbar{ padding:13px 14px; border-bottom:1px solid var(--card-border); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .notes-toolbar input{ flex:1; min-width:130px; padding:9px 13px; border:1.5px solid var(--card-border); border-radius:var(--radius-sm); font-size:13px; outline:none; font-family:inherit; }
  .notes-toolbar input:focus{ border-color:var(--lavender-500); }
  .filter-btn{ padding:6px 11px; border:1.5px solid var(--card-border); border-radius:16px; background:#fff; font-size:12px; cursor:pointer; color:var(--ink-500); font-family:inherit; font-weight:500; }
  .filter-btn.active{ background:var(--lavender-500); border-color:var(--lavender-500); color:#fff; }
  #notesList{ overflow-y:auto; flex:1; }
  .note-item{ display:flex; align-items:center; gap:11px; padding:11px 15px; border-bottom:1px solid var(--base-50); cursor:pointer; }
  .note-item:hover{ background:var(--base-50); }
  .note-item.active{ background:var(--lavender-100); border-left:3px solid var(--lavender-500); padding-left:12px; }
  .note-pillar-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .note-info{ flex:1; min-width:0; }
  .note-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-path{ font-size:11px; color:var(--ink-400); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-status-tag{ padding:2px 9px; border-radius:10px; font-size:10px; font-weight:700; flex-shrink:0; font-family:'DM Sans',sans-serif; }

  /* ===== 阅读器 ===== */
  .reader-panel{ background:#fff; border:1px solid var(--card-border); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:26px 30px; max-height:76vh; overflow-y:auto; }
  .reader-empty{ text-align:center; padding:70px 20px; color:var(--ink-400); }
  .reader-empty .big{ width:72px; height:72px; margin:0 auto 14px; border-radius:20px; background:var(--lavender-100); color:var(--lavender-deep);
    display:flex; align-items:center; justify-content:center; font-size:30px; }
  .reader-header{ border-bottom:1px solid var(--card-border); padding-bottom:15px; margin-bottom:18px; }
  .reader-title{ font-family:'Noto Serif SC',serif; font-size:22px; font-weight:900; margin-bottom:8px; }
  .reader-meta{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .reader-meta .tag{ padding:3px 11px; border-radius:12px; font-size:11px; font-weight:700; font-family:'DM Sans',sans-serif; }
  .reader-meta .path{ font-size:11.5px; color:var(--ink-400); }
  .reader-actions{ margin-top:12px; display:flex; gap:10px; }
  .btn-obsidian{ padding:7px 14px; border-radius:9px; border:1.5px solid var(--card-border); background:#fff; font-size:12.5px; cursor:pointer; color:var(--ink-500); font-family:inherit; font-weight:500; }
  .btn-obsidian:hover{ border-color:var(--lavender-500); color:var(--lavender-deep); }
  .reader-body{ font-size:14.5px; line-height:1.85; color:var(--ink-800); }
  .reader-body h1{ font-family:'Noto Serif SC',serif; font-size:20px; margin:22px 0 10px; }
  .reader-body h2{ font-family:'Noto Serif SC',serif; font-size:17px; margin:20px 0 8px; }
  .reader-body h3{ font-size:15px; margin:16px 0 6px; }
  .reader-body p{ margin:10px 0; }
  .reader-body code{ background:var(--ink-100); padding:2px 6px; border-radius:4px; font-size:13px; font-family:'DM Sans',Consolas,monospace; }
  .reader-body pre{ background:var(--ink-900); color:#e8e6ef; padding:16px; border-radius:10px; overflow-x:auto; margin:14px 0; }
  .reader-body pre code{ background:transparent; color:inherit; padding:0; }
  .reader-body ul,.reader-body ol{ padding-left:24px; margin:10px 0; }
  .reader-body li{ margin:4px 0; }
  .reader-body blockquote{ border-left:3px solid var(--lavender-500); padding:10px 16px; background:var(--lavender-100); margin:14px 0; border-radius:0 10px 10px 0; }
  .reader-body table{ width:100%; border-collapse:collapse; margin:14px 0; font-size:13.5px; }
  .reader-body th{ background:var(--base-50); padding:8px 12px; text-align:left; font-weight:700; border-bottom:2px solid var(--card-border); }
  .reader-body td{ padding:8px 12px; border-bottom:1px solid var(--card-border); }
  .reader-body a{ color:var(--sky-deep); }

  /* ===== 图表 ===== */
  .charts-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .chart-card{ background:#fff; border:1px solid var(--card-border); border-radius:var(--radius); box-shadow:var(--card-shadow); padding:20px; }
  .chart-card h3{ font-size:14.5px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .chart-card canvas{ max-height:250px; }

  /* ===== Footer ===== */
  .footer{ text-align:center; color:var(--ink-400); font-size:12px; margin-top:26px; padding-top:18px; border-top:1px solid var(--card-border); }

  .empty-state{ text-align:center; padding:44px 20px; color:var(--ink-400); font-size:13px; }
  .empty-state i{ font-size:26px; display:block; margin-bottom:8px; color:var(--ink-200); }

  /* ===== 响应式 ===== */
  @media (max-width:960px){
     .stats-grid{ grid-template-columns:repeat(3,1fr); }
    .pillar-grid{ grid-template-columns:1fr 1fr; }
    .charts-row{ grid-template-columns:1fr; }
    .checkin-strip{ margin-left:0; }
  }
  @media (max-width:640px){
     .stats-grid{ grid-template-columns:1fr 1fr; }
    .pillar-grid{ grid-template-columns:1fr; }
    .notes-list-panel{ max-height:46vh; }
    .reader-panel{ max-height:none; }
    .nav-links{ display:none; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- ===== 顶部导航 ===== -->
  <nav class="topnav">
    <div class="logo">
      <div class="icon-box" style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--lavender-500),var(--sky-500));color:#fff;font-size:15px"><i class="fa-solid fa-seedling"></i></div>
      自生长知识库
    </div>
    <div class="nav-links">
      <a href="dashboard.html" class="active">📊 知识库</a>
      <a href="今日打卡.html">📅 每日打卡</a>
    </div>
    <div class="nav-user">
      <div class="avatar" id="userAvatar">学</div>
      <span class="uname" id="userName">未登录</span>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </nav>

  <!-- ===== Hero ===== -->
  <div class="hero">
    <div class="hero-row">
      <div>
        <span class="hero-eyebrow"><i class="fa-solid fa-seedling"></i> KNOWLEDGE GARDEN</span>
        <h1>自生长<span class="gt">知识库</span></h1>
        <div class="sub">捕获 / 处理 / 链接 / 回顾 —— 点击笔记即可阅读，与 Obsidian 同步更新</div>
      </div>
      <div class="checkin-strip">
        <div class="cs-icon"><i class="fa-solid fa-calendar-check"></i></div>
        <div class="cs-main">
          <b id="csTitle">今日打卡</b>
          <span id="csSub">加载中…</span>
        </div>
        <a class="btn-go" href="今日打卡.html">去打卡 →</a>
      </div>
    </div>
  </div>

  <!-- ===== 统计 ===== -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- ===== 支柱 ===== -->
  <div class="sec-block">
    <div class="sec-head">
      <div class="icon-box ib-30 lavender"><i class="fa-solid fa-layer-group"></i></div>
      <h2>知识支柱</h2>
      <span class="hint">点击卡片筛选该支柱的笔记</span>
    </div>
    <div class="divider"></div>
    <div class="pillar-grid" id="pillarGrid"></div>
  </div>

  <!-- ===== 笔记浏览器 ===== -->
  <div class="sec-block">
    <div class="sec-head">
      <div class="icon-box ib-30 sky"><i class="fa-solid fa-book-open"></i></div>
      <h2>笔记浏览器</h2>
      <span class="hint">点击左侧笔记在右侧阅读</span>
    </div>
    <div class="divider"></div>
    <div class="browser-wrap">
      <div class="notes-list-panel">
        <div class="notes-toolbar">
          <input type="text" id="searchInput" placeholder="搜索笔记…">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="python">🐍</button>
          <button class="filter-btn" data-filter="ai">🤖</button>
          <button class="filter-btn" data-filter="devops">🖥️</button>
          <button class="filter-btn" data-filter="projects">🚀</button>
          <button class="filter-btn" data-filter="linux">🐧</button>
        </div>
        <div id="notesList"></div>
      </div>
      <div class="reader-panel" id="readerPanel">
        <div class="reader-empty">
          <div class="big"><i class="fa-solid fa-book-open-reader"></i></div>
          <p>点击左侧任意笔记<br>在这里直接阅读内容</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 图表 ===== -->
  <div class="charts-row" style="margin-bottom:8px">
    <div class="chart-card"><h3><i class="fa-solid fa-chart-column" style="color:var(--sky-deep)"></i> 各支柱笔记分布</h3><canvas id="pillarChart" role="img" aria-label="Pillar distribution"></canvas></div>
    <div class="chart-card"><h3><i class="fa-solid fa-seedling" style="color:var(--mint-deep)"></i> 笔记状态分布</h3><canvas id="statusChart" role="img" aria-label="Status distribution"></canvas></div>
  </div>

  <div class="footer">最后更新: 2026-09-05 · 共 <strong id="totalNotesFooter">0</strong> 条笔记 · 与 Obsidian 双向同步 · Powered by html-beautifier 设计系统</div>
</div>

<div class="toast-holder"></div>

<script>
/* =====================================================
 * 知识库仪表盘（马卡龙设计系统重制版）
 * 数据与 Obsidian 库同步生成；新增：登录守卫 + 打卡摘要
 * ===================================================== */
const notes = [{"title": "Python数据类型与结构", "path": "语言学习/02-基础概念/20260717-Python数据类型与结构.md", "pillar": "python", "status": "seedling", "summary": "Python 中的数据主要分为两类：不可变的基本类型和可变的容器类型。前者包括 int、float、str、tuple、bool；后者包括 list、dict、set。", "content": "# Python 数据类型与结构\n\n## 是什么\n\nPython 中的数据主要分为两类：**不可变的基本类型**和**可变的容器类型**。前者包括 `int`、`float`、`str`、`tuple`、`bool`；后者包括 `list`、`dict`、`set`。\n\n## 为什么重要\n\n数据类型是编程的「建材」。选错类型，代码又慢又难读。比如用 `list` 做成员检查是 O(n)，用 `set` 是 O(1)——选择决定性能。\n\n## 核心要点\n\n- `list` 有序可变，适合顺序存取；`tuple` 有序不可变，适合做键和函数返回值。\n- `dict` 是 Python 的发动机——从对象属性到函数参数，底层都是字典。\n- `set` 自动去重，交/并/差运算一行搞定，成员检查极快。\n- 字符串不可变，每次拼接都会创建新对象——大批量拼接用 `\"\".join()`。\n- 变量名只是标签，指向对象；赋值不复制数据，只是换了标签贴的位置。\n\n## 一句话带走\n\n> list 存顺序，dict 存映射，set 存唯一；三者组合能表达 90% 的数据结构需求。\n\n## 相关笔记\n\n- [[函数与作用域]]\n- [[生成器与迭代器]]", "created": "2026-07-17T14:00:00"}, {"title": "Python装饰器", "path": "语言学习/02-基础概念/20260717-Python装饰器.md", "pillar": "python", "status": "seedling", "summary": "装饰器（Decorator）是一个接收函数作为参数、返回一个新函数的高阶函数，用于在不修改原函数代码的前提下扩展其行为。", "content": "# Python 装饰器\n\n## 定义\n\n装饰器（Decorator）是一个接收函数作为参数、返回一个新函数的高阶函数，用于在不修改原函数代码的前提下扩展其行为。\n\n```python\ndef my_decorator(func):\n    def wrapper(*args, **kwargs):\n        print(f\"调用 {func.__name__}\")\n        return func(*args, **kwargs)\n    return wrapper\n\n@my_decorator\ndef hello():\n    print(\"hello\")\n\nhello()\n# 输出: 调用 hello\n#       hello\n```\n\n## 为什么重要\n\n- **关注点分离**：把横切逻辑（日志、权限、缓存）从业务代码中抽离\n- **可复用**：一个装饰器可以应用到任意多个函数\n- **可组合**：多重装饰器可以叠加，如 `@auth @log @cache`\n\n## 相关概念\n\n- [[闭包]] — 装饰器本质上依赖闭包来保存外层状态\n- [[高阶函数]] — 装饰器是高阶函数的典型应用\n- [[functools.wraps]] — 保留被装饰函数的 `__name__` 和 `__doc__`\n\n## 应用\n\n| 场景 | 示例 |\n|------|------|\n| 计时 | `@timeit` 包裹函数，记录执行时间 |\n| 日志 | `@log` 自动记录函数调用和返回值 |\n| 权限校验 | `@requires_auth` 检查用户是否登录 |\n| 缓存 | `@lru_cache` 缓存函数结果（functools 内置） |\n| 重试 | `@retry(max=3)` 失败自动重试 |\n\n## 参考\n\n- Python 官方文档: [PEP 318 -- Decorators for Functions and Methods](https://www.python.org/dev/peps/pep-0318/)", "created": "2026-07-17T13:30:00"}, {"title": "函数与作用域", "path": "语言学习/02-基础概念/20260717-函数与作用域.md", "pillar": "python", "status": "seedling", "summary": "函数是一段可复用的代码块。Python 中函数是一等公民——可以赋值给变量、作为参数传递、作为返回值。「作用域」决定变量在哪里可见：遵循 LEGB 规则（Local → Enclosing → Global → Built-in）。", "content": "# 函数与作用域\n\n## 是什么\n\n函数是一段可复用的代码块。Python 中函数是一等公民——可以赋值给变量、作为参数传递、作为返回值。「作用域」决定变量在哪里可见：遵循 **LEGB** 规则（Local → Enclosing → Global → Built-in）。\n\n## 为什么重要\n\n理解作用域能避免 90% 的「变量未定义」和「变量被意外修改」的 bug。理解函数是一等公民，才能写出装饰器、闭包、回调这些 Python 高级特性。\n\n## 核心要点\n\n- `def` 定义函数，`lambda` 定义匿名单行函数。\n- 参数有四种：位置参数、默认参数、可变参数（`*args`）、关键字参数（`**kwargs`）。\n- 函数内部用 `global` 声明才能修改全局变量；用 `nonlocal` 修改外层闭包变量。\n- 函数式编程三件套：`map`（映射）、`filter`（过滤）、`reduce`（归约）。\n- 类型标注不是强制的，但加上后 IDE 能自动补全、mypy 能静态检查。\n\n## 一句话带走\n\n> 函数不是只能「调用」——它可以「传递」和「组合」。这是 Python 优雅的根源。\n\n## 相关笔记\n\n- [[Python数据类型与结构]]\n- [[装饰器与闭包]]\n- [[生成器与迭代器]]", "created": "2026-07-17T14:00:00"}, {"title": "异步编程-asyncio", "path": "语言学习/02-基础概念/20260717-异步编程-asyncio.md", "pillar": "python", "status": "seedling", "summary": "异步编程是一种「在等待时不阻塞」的编程方式。Python 的 asyncio 通过 事件循环（event loop） 管理多个协程，用 async/await 语法让代码看起来像同步但实际是异步执行。", "content": "# 异步编程 · asyncio\n\n## 是什么\n\n异步编程是一种「在等待时不阻塞」的编程方式。Python 的 `asyncio` 通过 **事件循环（event loop）** 管理多个协程，用 `async/await` 语法让代码看起来像同步但实际是异步执行。\n\n## 为什么重要\n\n你写爬虫，等网页响应的时候 CPU 在发呆——异步就是让 CPU 在等待时去干别的事。一个异步爬虫可以同时发 100 个请求，同步的只能一个接一个排队。\n\n## 核心要点\n\n- `async def` 定义协程函数；`await` 暂停当前协程，交出控制权给事件循环。\n- `asyncio.gather()` 并发跑多个协程；`asyncio.create_task()` 把协程包装成 Task 扔进后台。\n- IO 密集型（网络请求、文件读写）是异步的主场；CPU 密集型（计算）不适合，要用多进程。\n- `aiohttp` 替代 `requests`；`asyncpg` 替代 `psycopg2`——异步要全家桶替换。\n- Python 3.11+ 的 `asyncio.TaskGroup` 提供更好的异常处理，推荐替代 `gather`。\n\n## 一句话带走\n\n> 同步是「排队等」，异步是「拿号等」——号拿了就去做别的事，轮到你时再回来。\n\n## 相关笔记\n\n- [[函数与作用域]]\n- [[并发与多线程]]\n- [[生成器与迭代器]]", "created": "2026-07-17T14:00:00"}, {"title": "面向对象编程", "path": "语言学习/02-基础概念/20260717-面向对象编程.md", "pillar": "python", "status": "seedling", "summary": "Python 的 OOP 核心就是 类（class） 和 实例（instance）。类是一张「蓝图」，实例是按蓝图造出来的对象。三大支柱：封装（藏细节）、继承（复用代码）、多态（统一接口）。", "content": "# 面向对象编程（OOP）\n\n## 是什么\n\nPython 的 OOP 核心就是 **类（class）** 和 **实例（instance）**。类是一张「蓝图」，实例是按蓝图造出来的对象。三大支柱：封装（藏细节）、继承（复用代码）、多态（统一接口）。\n\n## 为什么重要\n\n不学 OOP，看别人的框架代码就像看天书。Django、FastAPI、SQLAlchemy 全是用类搭起来的。你写的脚本超过 500 行时，不用类会越来越难维护。\n\n## 核心要点\n\n- `class MyClass:` 定义类；`__init__` 是构造函数，`self` 指向实例本身。\n- `@property` 把方法伪装成属性；`@staticmethod` / `@classmethod` 区分普通方法和类方法。\n- 继承用 `class Child(Parent):`；`super()` 调用父类方法，避免硬编码父类名。\n- `__str__` 定义 `print()` 的输出；`__repr__` 定义调试时的显示。\n- 「鸭子类型」：不管对象是什么类，只要它有你需要的方法，就能用。Python 不强制接口。\n\n## 一句话带走\n\n> Python 的 OOP 不是束缚手脚的条条框框，而是帮代码从「能跑」进化到「好改」的组织方式。\n\n## 相关笔记\n\n- [[函数与作用域]]\n- [[Python装饰器]]", "created": "2026-07-17T14:00:00"}, {"title": "知识库总览", "path": "AI学习/00-知识库总览.md", "pillar": "ai", "status": "evergreen", "summary": "这是整个知识库的入口页。建议把它设为 Obsidian 的启动页或收藏夹。", "content": "# 知识库总览\n\n这是整个知识库的入口页。建议把它设为 Obsidian 的启动页或收藏夹。\n\n## 三大支柱\n\n- [[AI学习/AI学习-MOC|AI学习]]\n- [[语言学习/语言学习-MOC|语言学习]]\n- [[运维学习/运维学习-MOC|运维学习]]\n\n## 系统与流程\n\n- [[_系统/00-使用指南|使用指南]]\n- [[00-收件箱/00-收件箱说明|收件箱]]\n- [[99-归档/99-归档说明|归档]]\n- [[_系统/04-工作流/每日快速捕获|每日快速捕获]]\n- [[_系统/04-工作流/每周回顾|每周回顾]]\n- [[_系统/04-工作流/从收件箱到永久笔记|从收件箱到永久笔记]]\n\n## 常用脚本\n\n- [[_系统/03-脚本/新建笔记|新建笔记]]\n- [[_系统/03-脚本/周回顾|周回顾]]\n- [[_系统/03-脚本/vault统计|vault统计]]\n\n## 工具\n\n- **Obsidian**：可视化图谱、双向链接、Daily Notes\n- **VSCode**：批量编辑、脚本、Git 版本管理", "created": "2026-07-17T13:00:00"}, {"title": "AI Agent", "path": "AI学习/02-基础概念/20260717-AI-Agent.md", "pillar": "ai", "status": "seedling", "summary": "AI Agent 是一个能自主规划、使用工具、执行多步任务的 AI 系统。它不只是一问一答的聊天机器人，而是能「接任务 → 拆步骤 → 调工具 → 检查结果 → 调整重来」的自主执行者。", "content": "# AI Agent（智能体）\n\n## 是什么\n\nAI Agent 是一个能自主规划、使用工具、执行多步任务的 AI 系统。它不只是一问一答的聊天机器人，而是能「接任务 → 拆步骤 → 调工具 → 检查结果 → 调整重来」的自主执行者。\n\n## 为什么重要\n\n如果 LLM 是大脑，Agent 就是整个身体。2025-2026 年是 Agent 元年——从 AutoGPT 到 Claude Code、Manus、Cursor Agent，Agent 正在从玩具变成生产力工具。\n\n## 核心要点\n\n- **核心循环**：思考（Plan）→ 行动（Act）→ 观察（Observe）→ 反思（Reflect）→ 重复。\n- **工具调用（Tool Use / Function Calling）**：Agent 能调用 API、读写文件、执行代码——这是它和纯聊天机器人的本质区别。\n- **记忆系统**：短期记忆（上下文窗口）+ 长期记忆（外部存储/向量库），让 Agent 能跨会话保持状态。\n- **多 Agent 协作**：多个专业 Agent 分工合作——一个规划、一个写代码、一个测试，类似软件开发团队。\n- **当前局限**：长任务容易迷路（上下文漂移）、成本高（每步都调一次模型）、安全边界模糊。\n\n## 一句话带走\n\n> LLM 只会回答问题，Agent 会完成任务。差一个「行动能力」。\n\n## 相关笔记\n\n- [[大语言模型]]\n- [[提示工程]]\n- [[检索增强生成]]", "created": "2026-07-17T14:00:00"}, {"title": "大语言模型", "path": "AI学习/02-基础概念/20260717-大语言模型.md", "pillar": "ai", "status": "seedling", "summary": "LLM 是基于 Transformer 架构、在海量文本上训练的巨型神经网络。它学会了语言的统计规律，能「续写」文本——而不是真正「理解」语义。ChatGPT、Claude、文心一言、通义千问都是 LLM。", "content": "# 大语言模型（LLM）\n\n## 是什么\n\nLLM 是基于 Transformer 架构、在海量文本上训练的巨型神经网络。它学会了语言的统计规律，能「续写」文本——而不是真正「理解」语义。ChatGPT、Claude、文心一言、通义千问都是 LLM。\n\n## 为什么重要\n\nLLM 正在改变人机交互的方式。以前你得学编程才能让计算机做事，现在用自然语言就能。它不等于 AGI，但它是第一个让「通用」看起来可能的 AI 形态。\n\n## 核心要点\n\n- 核心机制是「预测下一个 token」——不是推理，是统计猜测，但结果往往足够有用。\n- 训练分三步：预训练（学语言）→ 监督微调（学对话）→ RLHF（学对齐人类偏好）。\n- 上下文窗口决定一次能塞多少信息；RAG（检索增强）可以突破这个限制。\n- 幻觉问题是 LLM 的固有缺陷——它会自信地编造不存在的事实，使用时必须验证。\n- 本地部署用 Ollama + GGUF 量化模型，8GB 显存就能跑 7B 参数模型。\n\n## 一句话带走\n\n> LLM 是一个超级「接话器」——它不知道真相，但说出来的话有时候恰好是真的。\n\n## 相关笔记\n\n- [[提示工程]]\n- [[检索增强生成]]\n- [[AI Agent]]", "created": "2026-07-17T14:00:00"}, {"title": "提示工程", "path": "AI学习/02-基础概念/20260717-提示工程.md", "pillar": "ai", "status": "seedling", "summary": "提示工程是通过精心设计输入文本，引导 LLM 产出目标输出的一系列方法。它不是编程，更像是一种「对话设计」——你怎么问，决定了它怎么答。", "content": "# 提示工程（Prompt Engineering）\n\n## 是什么\n\n提示工程是通过精心设计输入文本，引导 LLM 产出目标输出的一系列方法。它不是编程，更像是一种「对话设计」——你怎么问，决定了它怎么答。\n\n## 为什么重要\n\n同样的模型，好的提示和烂的提示产出天差地别。掌握提示工程，等于掌握了从 LLM 榨取最大价值的钥匙。不需要改模型，只需要改问法。\n\n## 核心要点\n\n- **角色设定**：开头就告诉它「你是一位资深 Python 工程师」，输出质量立刻提升。\n- **少样本提示**：给 1-3 个输入→输出示例，模型就能模仿格式和风格。\n- **思维链**：加上「让我们一步步思考」，复杂推理任务准确率能翻倍。\n- **结构化输出**：要求「用 JSON 格式输出」，减少后处理成本和格式错误。\n- **避免陷阱**：不说「不要怎样」而要「请怎样」——否定句容易触发你不想提的内容。\n\n## 一句话带走\n\n> 提示工程不神秘——本质上就是把「心里想的」翻译成「模型能精准执行的」。越具体，越准确。\n\n## 相关笔记\n\n- [[大语言模型]]\n- [[检索增强生成]]\n- [[AI Agent]]", "created": "2026-07-17T14:00:00"}, {"title": "检索增强生成", "path": "AI学习/02-基础概念/20260717-检索增强生成.md", "pillar": "ai", "status": "seedling", "summary": "RAG（Retrieval-Augmented Generation）让 LLM 在回答问题前先去外部知识库「翻资料」，把检索到的相关内容塞进上下文，再生成答案。相当于给 LLM 配了一个图书馆管理员。", "content": "# 检索增强生成（RAG）\n\n## 是什么\n\nRAG（Retrieval-Augmented Generation）让 LLM 在回答问题前先去外部知识库「翻资料」，把检索到的相关内容塞进上下文，再生成答案。相当于给 LLM 配了一个图书馆管理员。\n\n## 为什么重要\n\nLLM 有两大短板：知识截止训练日期、容易幻觉。RAG 同时解决了这两个问题——检索的是实时外部数据，生成的答案可以溯源到具体文档。\n\n## 核心要点\n\n- **三步流水线**：索引（文档切块→向量化→存库）→ 检索（问题向量化→相似度搜索）→ 生成（检索结果 + 问题 → LLM → 答案）。\n- **文档切块**是 RAG 最被低估的环节：块太大检索不准，块太小丢失上下文，推荐 500-1000 token 带重叠。\n- **Embedding 模型**决定了检索质量：中文推荐 `bge-large-zh`，多语言用 `text-embedding-3-large`。\n- 向量数据库选型：小项目用 Chroma/FAISS 够用，生产级用 Milvus/Pinecone/Weaviate。\n- **高级技巧**：HyDE（先生成假设答案再检索）、重排序（rerank）、多路召回（关键词+向量混合检索）。\n\n## 一句话带走\n\n> RAG = LLM + 搜索引擎。模型不知道的，先去查再回答。\n\n## 相关笔记\n\n- [[大语言模型]]\n- [[提示工程]]\n- [[向量数据库]]", "created": "2026-07-17T14:00:00"}, {"title": "CI与CD", "path": "运维学习/02-基础概念/20260717-CI与CD.md", "pillar": "devops", "status": "seedling", "summary": "CI（持续集成）：代码一提交，自动跑测试、构建、检查——确保新代码不弄坏旧功能。CD 有两层：持续交付（自动构建出可部署的产物）和持续部署（自动把产物推到生产环境）。", "content": "# CI 与 CD\n\n## 是什么\n\n**CI（持续集成）**：代码一提交，自动跑测试、构建、检查——确保新代码不弄坏旧功能。**CD 有两层**：持续交付（自动构建出可部署的产物）和持续部署（自动把产物推到生产环境）。\n\n## 为什么重要\n\n没有 CI/CD，上线靠手动——复制文件、重启服务、祈祷不出错。有了 CI/CD，你 push 代码，剩下的机器自动干。从「上线恐惧症」到「一天发十版」的转变就靠它。\n\n## 核心要点\n\n- **流水线（Pipeline）**：一条流水线 = 多个阶段（Stage），每个阶段 = 多个任务（Job）。阶段之间串行，任务之间可并行。\n- **常见流程**：Push 代码 → 自动拉取 → 安装依赖 → 跑测试 → 构建镜像 → 推送到镜像仓库 → 部署到测试环境 → 跑 E2E 测试 → 部署到生产。\n- **GitLab CI**：用 `.gitlab-ci.yml` 定义流水线，Runner 执行任务。GitHub Actions 同理，用 `.github/workflows/*.yml`。\n- **回滚是底线**：每次部署必须保留上一版本，出问题一键回滚——不能因为自动化就放弃可逆性。\n- **不要一开始追求全自动**：先做到自动测试+自动构建，稳定后再加自动部署。逐步来，别一口吃成胖子。\n\n## 一句话带走\n\n> CI 管「代码对不对」，CD 管「代码上没上线」。合在一起就是：你只管写好代码，剩下交给机器。\n\n## 相关笔记\n\n- [[容器化]]\n- [[Docker]]\n- [[GitLab-CI]]", "created": "2026-07-17T16:00:00"}, {"title": "Linux基础", "path": "运维学习/02-基础概念/20260717-Linux基础.md", "pillar": "devops", "status": "seedling", "summary": "Linux 是一个开源操作系统内核，加上 GNU 工具链构成了完整的操作系统。绝大多数服务器、云平台、嵌入式设备跑的都是 Linux。你用的 Android 手机、访问的网站、AI 训练集群，底层都是它。", "content": "# Linux 基础\n\n## 是什么\n\nLinux 是一个开源操作系统内核，加上 GNU 工具链构成了完整的操作系统。绝大多数服务器、云平台、嵌入式设备跑的都是 Linux。你用的 Android 手机、访问的网站、AI 训练集群，底层都是它。\n\n## 为什么重要\n\n不会 Linux，运维就无从谈起。Docker 容器里是 Linux，Kubernetes 节点上是 Linux，CI/CD Runner 也是 Linux。哪怕你是纯 Python 开发，生产环境大概率也是 Linux。\n\n## 核心要点\n\n- **文件系统**：一切皆文件——硬盘、进程、网络连接都以文件形式暴露在 `/dev`、`/proc`、`/sys` 下。\n- **用户与权限**：`root` 是超级管理员；`chmod 755` 的数字代表 拥有者/组/其他人 的 读(4)写(2)执行(1)权限。\n- **管道与重定向**：`|` 把前一个命令的输出变成后一个的输入；`>` 写入文件，`>>` 追加。\n- **进程管理**：`ps aux` 看所有进程，`top` / `htop` 实时监控，`kill -9` 强制终止。\n- **软件包管理**：Ubuntu 用 `apt`，CentOS 用 `yum/dnf`，Arch 用 `pacman`——但 Docker 让包管理变得不那么重要了。\n\n## 一句话带走\n\n> Linux 不难——你只需要习惯「没有 GUI，只有命令行」。常用的 20 个命令能覆盖 80% 的日常工作。\n\n## 相关笔记\n\n- [[容器化]]\n- [[监控与可观测性]]", "created": "2026-07-17T14:00:00"}, {"title": "容器化", "path": "运维学习/02-基础概念/20260717-容器化.md", "pillar": "devops", "status": "seedling", "summary": "容器是一种轻量级的虚拟化技术，把应用及其所有依赖打包成一个「集装箱」，可以在任何 Linux 机器上一致运行。Docker 是最流行的容器引擎，Kubernetes（K8s）是容器的编排管理系统。", "content": "# 容器化\n\n## 是什么\n\n容器是一种轻量级的虚拟化技术，把应用及其所有依赖打包成一个「集装箱」，可以在任何 Linux 机器上一致运行。Docker 是最流行的容器引擎，Kubernetes（K8s）是容器的编排管理系统。\n\n## 为什么重要\n\n「在我机器上能跑啊」——这句话终结于容器。容器解决了环境不一致、依赖冲突、部署繁琐三大痛点。现在的微服务、CI/CD、云原生，全部建立在容器之上。\n\n## 核心要点\n\n- **镜像 vs 容器**：镜像是只读模板（类似 ISO），容器是镜像的运行实例（类似虚拟机）。一个镜像可以启动无数个容器。\n- **Dockerfile**：用 `FROM` 选基础镜像，`RUN` 执行命令，`COPY` 放入文件，`CMD` 定义启动命令。层是增量的，改一行只重建后续层。\n- **docker-compose**：用 YAML 编排多容器应用——Web + 数据库 + 缓存，一个 `up` 全起来。\n- **Kubernetes 核心概念**：Pod（最小调度单元，一或多个容器）、Service（网络入口）、Deployment（声明式部署，滚动更新）。\n- **容器不是虚拟机**：容器共享宿主机内核，启动快（秒级）、占用小（MB 级），但不提供完整隔离——安全敏感场景需要额外防护。\n\n## 一句话带走\n\n> Docker 让「在哪儿跑都一样」，Kubernetes 让「跑多少台都一样」。\n\n## 相关笔记\n\n- [[Linux基础]]\n- [[监控与可观测性]]\n- [[CI与CD]]", "created": "2026-07-17T14:00:00"}, {"title": "监控与可观测性", "path": "运维学习/02-基础概念/20260717-监控与可观测性.md", "pillar": "devops", "status": "seedling", "summary": "监控告诉你「系统坏了没有」，可观测性告诉你「为什么坏了以及怎么修」。三根支柱：日志（Logs） 记录事件、指标（Metrics） 量化状态、链路追踪（Traces） 还原调用路径。", "content": "# 监控与可观测性\n\n## 是什么\n\n监控告诉你「系统坏了没有」，可观测性告诉你「为什么坏了以及怎么修」。三根支柱：**日志（Logs）** 记录事件、**指标（Metrics）** 量化状态、**链路追踪（Traces）** 还原调用路径。\n\n## 为什么重要\n\n没有监控，线上故障靠用户电话通知。有了监控+可观测性，你能在用户察觉之前发现问题，在 3 分钟而不是 3 小时内定位根因。这是运维从「救火」到「预防」的关键跨越。\n\n## 核心要点\n\n- **Prometheus + Grafana** 是事实标准：Prometheus 拉取并存储时序指标，Grafana 画仪表盘和配告警。\n- **ELK / Loki** 管日志：Elasticsearch 重量但功能全，Loki 轻量且和 Prometheus 标签体系一致。\n- **分布式追踪**（Jaeger / Tempo）：还原一个请求经过 N 个微服务的完整链路，哪个节点拖后腿一目了然。\n- **四个黄金信号**：延迟（Latency）、流量（Traffic）、错误率（Errors）、饱和度（Saturation）——任何服务盯着这四个就够了。\n- **告警不是越多越好**：告警疲劳比没告警更危险。只对用户可感知的问题告警，其他记日志就行。\n\n## 一句话带走\n\n> 监控是仪表盘，可观测性是探针。前者看仪表亮灯，后者能诊断为什么亮灯。\n\n## 相关笔记\n\n- [[容器化]]\n- [[Linux基础]]\n- [[CI与CD]]", "created": "2026-07-17T14:00:00"}, {"title": "网络基础", "path": "运维学习/02-基础概念/20260717-网络基础.md", "pillar": "devops", "status": "seedling", "summary": "计算机网络就是让多台机器互相通信的一套规则。核心四层：应用层（HTTP/DNS）、传输层（TCP/UDP）、网络层（IP）、链路层（以太网/WiFi）。运维最常打交道的是 TCP/IP 协议栈。", "content": "# 网络基础\n\n## 是什么\n\n计算机网络就是让多台机器互相通信的一套规则。核心四层：应用层（HTTP/DNS）、传输层（TCP/UDP）、网络层（IP）、链路层（以太网/WiFi）。运维最常打交道的是 TCP/IP 协议栈。\n\n## 为什么重要\n\n服务调不通、端口被占、DNS 解析失败——运维的日常故障有一半是网络问题。理解网络，才知道 `ping` 通但 `curl` 不通是怎么回事。\n\n## 核心要点\n\n- **TCP 三次握手**：SYN → SYN-ACK → ACK。建立连接后才传数据，可靠但慢。UDP 不握手直接发，快但可能丢包。\n- **端口**：0-65535，一个 IP + 一个端口 = 一个服务。常见端口：22(SSH)、80(HTTP)、443(HTTPS)、3306(MySQL)、6379(Redis)。\n- **DNS**：域名 → IP 的翻译官。`nslookup` 查解析，`/etc/hosts` 可本地覆盖。DNS 挂了，所有服务都不可用。\n- **防火墙**：用 iptables/nftables 控制进出流量。云上还有安全组——不在安全组白名单里的 IP 连端口都摸不到。\n- **HTTP/HTTPS**：状态码记几个关键的：200(OK)、301(永久重定向)、403(禁止)、404(没找到)、500(服务器挂了)、502(网关错误)。\n\n## 一句话带走\n\n> 网络就是「谁跟谁说话，走哪条路，说什么语言」。TCP 保证送到，UDP 保证够快。\n\n## 相关笔记\n\n- [[Linux基础]]\n- [[容器化]]\n- [[监控与可观测性]]", "created": "2026-07-17T16:00:00"}, {"title": "Docker实践", "path": "运维学习/03-工具与实践/20260717-Docker实践.md", "pillar": "devops", "status": "seedling", "summary": "Docker 是容器化的事实标准。它能在一台机器上跑多个互相隔离的应用，每个应用带着自己的运行环境（依赖、配置、系统库），互不干扰。", "content": "# Docker 实践\n\n## 是什么\n\nDocker 是容器化的事实标准。它能在一台机器上跑多个互相隔离的应用，每个应用带着自己的运行环境（依赖、配置、系统库），互不干扰。\n\n## 为什么重要\n\n「在我机器上能跑」的终极解决方案。开发环境、测试环境、生产环境——三个地方用同一个 Docker 镜像，环境差异归零。\n\n## 常用命令速查\n\n```bash\n# 镜像管理\ndocker pull nginx:latest          # 拉镜像\ndocker images                     # 看本地镜像\ndocker rmi <image_id>             # 删镜像\ndocker build -t myapp:v1 .        # 用 Dockerfile 构建\n\n# 容器管理\ndocker run -d -p 8080:80 --name web nginx   # 后台运行，端口映射\ndocker ps                         # 看运行中的容器\ndocker logs -f web                # 实时看日志\ndocker exec -it web bash          # 进容器内 Shell\ndocker stop web && docker rm web  # 停掉并删除\n\n# 调试\ndocker inspect web                # 看容器详细信息\ndocker stats                      # 实时资源占用\ndocker system prune -a            # 清理无用的镜像/容器/网络\n```\n\n## 核心要点\n\n- **Dockerfile 最佳实践**：多阶段构建减小镜像体积；`.dockerignore` 排除无用文件；尽量用官方镜像做基础。\n- **docker-compose**：一个 YAML 管多个容器。`depends_on` 控制启动顺序，`volumes` 挂载持久化数据。\n- **网络**：默认 bridge 网络容器间可用服务名互相访问；`docker network create` 建自定义网络隔离环境。\n- **不要往容器里写数据**：容器删了数据就没了——数据必须挂载 volume 或 bind mount 到宿主机。\n\n## 一句话带走\n\n> Docker 让应用变成「集装箱」——从开发到生产，全程统一格式，到哪儿都能跑。\n\n## 相关笔记\n\n- [[容器化]]\n- [[Kubernetes]]\n- [[CI与CD]]", "created": "2026-07-17T16:00:00"}, {"title": "GitLab-CI实践", "path": "运维学习/03-工具与实践/20260717-GitLab-CI实践.md", "pillar": "devops", "status": "seedling", "summary": "GitLab-CI 是 GitLab 内置的 CI/CD 系统。在项目根目录放一个 .gitlab-ci.yml，每次 push 代码，GitLab 自动按你定义的流水线跑测试、构建、部署。", "content": "# GitLab-CI 实践\n\n## 是什么\n\nGitLab-CI 是 GitLab 内置的 CI/CD 系统。在项目根目录放一个 `.gitlab-ci.yml`，每次 push 代码，GitLab 自动按你定义的流水线跑测试、构建、部署。\n\n## 为什么重要\n\n免费用、无需额外搭 Jenkins、和 GitLab 仓库深度集成——中小团队 CI/CD 入门首选。Merge Request 里直接看到流水线状态，测试没过就不让合并。\n\n## 一个最小可用的 .gitlab-ci.yml\n\n```yaml\nstages:\n  - test\n  - build\n  - deploy\n\ntest:\n  stage: test\n  image: python:3.12\n  script:\n    - pip install -r requirements.txt\n    - pytest\n  only:\n    - merge_requests\n\nbuild:\n  stage: build\n  image: docker:latest\n  services:\n    - docker:dind\n  script:\n    - docker build -t myapp:$CI_COMMIT_SHORT_SHA .\n    - docker push myapp:$CI_COMMIT_SHORT_SHA\n  only:\n    - main\n\ndeploy:\n  stage: deploy\n  script:\n    - kubectl set image deployment/myapp app=myapp:$CI_COMMIT_SHORT_SHA\n  only:\n    - main\n  when: manual   # 手动触发部署，不自动\n```\n\n## 核心要点\n\n- **Runner**：执行流水线的机器。可用 GitLab 共享 Runner（免费有限额），也可自建 Runner（Docker 一条命令起一个）。\n- **Stage 串行，Job 并行**：同一 stage 里的 job 同时跑；下一 stage 等上一 stage 全部通过才启动。\n- **artifacts**：把构建产物（编译好的二进制、测试报告）传给后续 job。\n- **Cache vs Artifacts**：cache 存依赖（pip/node_modules），可跨流水线复用；artifacts 存产物，只在同一次流水线内传递。\n- **环境变量**：在 GitLab 项目 Settings → CI/CD → Variables 里设，敏感信息（密码/Token）一定要设成 Masked+Protected。\n\n## 一句话带走\n\n> Push 代码 → GitLab-CI 自动测试 → 自动构建 → 手动确认部署。你只管写好 `.gitlab-ci.yml`，剩下的不操心。\n\n## 相关笔记\n\n- [[CI与CD]]\n- [[Docker]]\n- [[Kubernetes]]", "created": "2026-07-17T16:00:00"}, {"title": "Kubernetes实践", "path": "运维学习/03-工具与实践/20260717-Kubernetes实践.md", "pillar": "devops", "status": "seedling", "summary": "Kubernetes（K8s）是一个容器编排平台，帮你管理几十上百个容器的部署、伸缩、负载均衡、故障恢复。它不关心你容器里跑的是什么，只关心「你要几个副本」「网络怎么通」「挂了怎么办」。", "content": "# Kubernetes 实践\n\n## 是什么\n\nKubernetes（K8s）是一个容器编排平台，帮你管理几十上百个容器的部署、伸缩、负载均衡、故障恢复。它不关心你容器里跑的是什么，只关心「你要几个副本」「网络怎么通」「挂了怎么办」。\n\n## 为什么重要\n\n手动管 3 个容器还行，30 个就疯了。K8s 让你声明「我要 5 个 Web 实例 + 2 个 Worker」，它自己搞定调度、健康检查、自动重启。这就是「云原生」的操作系统。\n\n## 核心组件速记\n\n| 组件 | 作用 |\n|------|------|\n| Pod | 最小调度单元，1 个 Pod = 1 或多个容器共享网络和存储 |\n| Service | 给一组 Pod 提供一个固定的访问入口（IP + DNS），Pod 重启 IP 会变，Service 不变 |\n| Deployment | 声明式管理 Pod 的副本数、更新策略、回滚 |\n| ConfigMap / Secret | 配置和敏感信息（密码/Token）与代码分离 |\n| Ingress | 把外部 HTTP 流量路由到集群内的 Service |\n\n## 常用操作\n\n```bash\nkubectl get pods -n <namespace>         # 看 Pod 状态\nkubectl describe pod <name>             # 看 Pod 详细信息（排查首选）\nkubectl logs -f <pod>                   # 实时日志\nkubectl exec -it <pod> -- bash          # 进容器\nkubectl apply -f deployment.yaml        # 声明式部署\nkubectl rollout restart deployment <name>  # 重启所有 Pod\nkubectl rollout undo deployment <name>  # 回滚\n```\n\n## 一句话带走\n\n> K8s 是运维的自动驾驶系统——你告诉它目的地（期望状态），它自己找路、避障、停车。\n\n## 相关笔记\n\n- [[容器化]]\n- [[Docker]]\n- [[CI与CD]]", "created": "2026-07-17T16:00:00"}, {"title": "家庭服务器搭建", "path": "运维学习/04-项目与案例/20260717-家庭服务器搭建.md", "pillar": "devops", "status": "seedling", "summary": "用一台旧电脑或树莓派，搭一个家庭服务器，跑 NAS + Docker + 内网穿透，实现文件共享、媒体中心、个人网站、自动下载。", "content": "# 家庭服务器搭建\n\n## 目标\n\n用一台旧电脑或树莓派，搭一个家庭服务器，跑 NAS + Docker + 内网穿透，实现文件共享、媒体中心、个人网站、自动下载。\n\n## 关键任务\n\n- [ ] 选硬件：旧笔记本/树莓派/N100 小主机均可，功耗低优先\n- [ ] 装系统：Ubuntu Server 22.04 LTS，无 GUI 省资源\n- [ ] 基础配置：固定 IP、SSH 免密登录、关密码登录防暴力破解\n- [ ] 装 Docker + Portainer（Web 管理界面，告别命令行管容器）\n- [ ] 搭 NAS：Samba 文件共享 + Nextcloud 私有云盘\n- [ ] 搭媒体中心：Jellyfin（视频）+ Calibre-Web（电子书）\n- [ ] 内网穿透：frp/Cloudflare Tunnel，出门也能访问家里的服务\n- [ ] 自动下载：qBittorrent + Sonarr/Radarr，追剧全自动\n\n## 踩坑预警\n\n- 运营商大概率给了你内网 IP，frp/Cloudflare Tunnel 是必需品\n- 树莓派 SD 卡不耐写——日志和数据库放外接硬盘\n- 不要暴露 22 端口到公网，用 VPN 或 SSH 跳板机访问\n\n## 结果\n\n## 相关笔记\n\n- [[Linux基础]]\n- [[Docker]]\n- [[网络基础]]", "created": "2026-07-17T16:00:00"}, {"title": "容器化部署实践", "path": "运维学习/04-项目与案例/20260717-容器化部署实践.md", "pillar": "devops", "status": "seedling", "summary": "把一个实际应用（比如你写的 Python Web 项目）从「手动部署」改造为「一条命令部署」的容器化方案，覆盖开发 → 测试 → 生产的完整链路。", "content": "# 容器化部署实践\n\n## 目标\n\n把一个实际应用（比如你写的 Python Web 项目）从「手动部署」改造为「一条命令部署」的容器化方案，覆盖开发 → 测试 → 生产的完整链路。\n\n## 关键任务\n\n- [ ] 选一个实际项目：可以是 Flask/FastAPI Web 应用，或者一个定时任务脚本\n- [ ] 写 Dockerfile：多阶段构建——第一阶段装依赖，第二阶段只保留运行时\n- [ ] 写 docker-compose.yml：Web 服务 + 数据库 + Redis 缓存，一个 `up` 全启动\n- [ ] 本地测试：`docker-compose up` 确认服务正常，curl/pytest 验证\n- [ ] 推送镜像：打 tag，push 到 Docker Hub 或私有 Registry（Harbor）\n- [ ] 部署到服务器：在云服务器或家庭服务器上 `docker-compose pull && up -d`\n- [ ] 配置自动更新：用 Watchtower 自动拉新镜像，或结合 GitLab-CI 自动触发\n- [ ] 加健康检查：`HEALTHCHECK` 指令 + `depends_on` condition，服务挂了自动重启\n\n## 验收标准\n\n- `git clone` 后一条 `docker-compose up -d` 能跑起来\n- 数据库数据持久化（容器重启不丢）\n- 日志可查看（`docker-compose logs`）\n\n## 结果\n\n## 相关笔记\n\n- [[Docker]]\n- [[Kubernetes]]\n- [[CI与CD]]", "created": "2026-07-17T16:00:00"}, {"title": "8 个项目的底层逻辑（通俗易懂版）", "path": "简历项目实战/00-底层逻辑图解.md", "pillar": "projects", "status": "evergreen", "summary": "> [!tip] 怎么用这篇笔记\n> 技术方案千千万，但每个项目背后都有一个朴素的问题和一个朴素的解决思路。先理解这一层，再看操作步骤时，每条命令你都知道它在解决什么。面试时也一样——面试官真正想听的就是这一层。", "content": "# 8 个项目的底层逻辑 — 先懂\"为什么\"，再学\"怎么做\"\n\n> [!tip] 怎么用这篇笔记\n> 技术方案千千万，但每个项目背后都有一个**朴素的问题**和一个**朴素的解决思路**。先理解这一层，再看操作步骤时，每条命令你都知道它在解决什么。面试时也一样——面试官真正想听的就是这一层。\n\n---\n\n## 🖥️ 运维四件套：解决\"机器多了人忙不过来\"\n\n运维的根本矛盾只有一句话：**服务器的数量和复杂度在涨，人的时间和精力不涨**。四个项目分别对付这个矛盾的一个侧面。\n\n### 1. CI/CD 流水线 —— 把\"人肉部署\"变成\"按一下按钮\"\n\n**朴素的问题**：手动部署 = 登录服务器 → 拉代码 → 装依赖 → 构建 → 重启服务 → 祈祷没漏步骤。做 10 次总会漏 1 次，漏的那次就是半夜的事故。\n\n**底层逻辑**：部署是一串**固定顺序的步骤**，凡是固定步骤就该交给机器执行。流水线（Pipeline）的本质是\"**把操作手册写成代码**\"：\n```\n代码提交（触发）→ 机器按手册逐步执行 → 任何一步失败立即停下报警\n```\n> [!note] 关键认知\n> 人做重复事会疲劳出错，机器不会。CI/CD 卖的不是\"快\"，是\"**每次都一样**\"——可重复性消灭了\"在我电脑上明明是好的\"这类问题。配套的两个安全设计：失败即停（测试不过就不许上线）、版本留痕（每个镜像对应一个 commit，出事能秒回滚）。\n\n### 2. Kubernetes 容器编排 —— 给容器们请一个\"全天候调度员\"\n\n**朴素的问题**：你有 20 个容器要跑在 5 台机器上。谁跑在哪台上？某台机器烧了，上面的容器谁来救？流量突然涨 3 倍，谁去加容器？\n\n**底层逻辑**：人工回答这些问题太慢，所以 K8s 的核心思想是\"**声明式管理**\"——你不命令它怎么做，只**声明你要的最终状态**：\n```\n你说：\"web 服务要永远保持 3 个副本活着\"\nK8s：死一个 → 自动补一个；机器挂了 → 把上面的副本挪到活机器上\n```\n> [!note] 关键认知\n> 这和管理一个道理：好的管理者不说\"你每天几点几分做什么\"，而是定好目标（3 个副本）和规则（健康标准），剩下让系统自己纠偏。**K8s = 一个永不睡觉、永不出错的值班运维**。滚动更新、自愈、扩缩容，全都是\"声明目标 + 自动纠偏\"这一个思想的不同应用。\n\n### 3. Prometheus 监控 —— 从\"用户骂了才知道\"到\"机器自己喊疼\"\n\n**朴素的问题**：没有监控时，故障的发现路径是：用户用不了 → 投诉 → 客服转给技术 → 技术开始查。**最宝贵的时间浪费在了\"传递坏消息\"上**。\n\n**底层逻辑**：让每台机器**主动、持续地汇报自己的生命体征**（CPU、内存、磁盘……），中心存下这些时间序列数据，再配一套\"**什么算不正常**\"的判断规则：\n```\n机器每 15 秒上报指标 → 规则引擎比对阈值 → 异常持续 5 分钟 → 自动通知到人\n```\n> [!note] 关键认知\n> 监控的本质是**把\"排障\"变成\"看表\"**。三个设计心法都有朴素道理：持续上报（体温要常测，不是病了才量）、持续一段时间才告警（打喷嚏不是肺炎，避免狼来了）、分级通知（发高烧打电话，小擦伤发消息就行）。\n\n### 4. Ansible 自动化 —— 把\"逐台登录操作\"变成\"一次批量执行\"\n\n**朴素的问题**：3 台服务器装软件，你 SSH 上去逐台敲同样的命令，第 3 台时已经开始走神敲错。300 台呢？\n\n**底层逻辑**：既然每台机器要做的事**一模一样**，那就\"**写一份剧本，所有机器照着演**\"。Ansible 的两个核心设计：\n```\n无 agent：通过 SSH 直接远程执行，被管机器零安装（为什么这很重要？因为要装 agent \n          本身就得先逐台登录一遍——鸡生蛋问题）\n幂等：  剧本跑 1 遍和跑 100 遍效果相同 → 你敢随时重跑，不怕搞乱\n```\n> [!note] 关键认知\n> 类比：Shell 脚本是\"**现场指挥**\"（你必须人在场一步步喊），Ansible 剧本是\"**施工图纸**\"（写清楚要什么状态，工人自己核对现状，缺什么补什么）。幂等性就是图纸上写\"房间里要有一盏灯\"——已经有的房间工人不会砸墙重装。\n\n---\n\n## 🤖 AI 四件套：解决\"模型很强但不会干活、不懂业务\"\n\nAI 工程的根本矛盾：**大模型有通用智能，但它不知道你的数据、不会调用你的工具、不懂你的行话**。四个项目恰好是四种\"给模型补短板\"的手段，层层递进：\n\n### 5. RAG 知识库问答 —— 给模型配一个\"开卷考试的资料室\"\n\n**朴素的问题**：问大模型\"我们公司的报销流程\"，它不知道——它的知识截止于训练那一刻，且从来不包含你的内部文档。但它**会读**——只要你把相关资料摆到它面前。\n\n**底层逻辑**：**开卷考试**。不让模型背整间资料室（不可能也记不住），而是先按问题去资料室**检索**最相关的几页，摊在模型面前让它**看着资料回答**：\n```\n问题 → 去向量库查最相似的文档片段（检索）→ 片段+问题一起喂给模型（增强）→ 模型照资料作答（生成）\n```\n> [!note] 关键认知\n> 向量检索的原理朴素得可爱：把每段文字变成一串数字（向量），意思相近的文字数字也接近——于是\"查资料\"变成了\"算距离\"。\"报销流程\"和\"费用审批步骤\"字面不同但向量很近，这就是语义搜索比关键词搜索聪明的原因。\n\n### 6. 私有化 LLM 部署 —— 把\"租来的大脑\"换成\"自己的大脑\"\n\n**朴素的问题**：调 OpenAI/DeepSeek 的 API，你的数据要发到别人的服务器上。金融、政务、医疗的数据**法律上就不允许出门**。\n\n**底层逻辑**：开源模型（Qwen、DeepSeek）的**权重文件是公开下载的**——模型本质上就是一个几百 GB 的\"超大参数文件 + 推理程序\"。下载到自己服务器上跑，数据一步不出内网：\n```\n别人的 API：你的数据 → 翻山越岭 → 别人的 GPU → 结果回来（数据出门了）\n私有化：   你的数据 → 你机房的 GPU（模型文件就住在里面）→ 结果（数据没动过）\n```\n> [!note] 关键认知\n> 这个项目的工程难点不在\"跑起来\"（一条 docker 命令），而在**让 GPU 的显存装得下、算得快**——所以核心技术都是围绕显存的艺术：量化（参数从 2 字节压到 0.5 字节，模型\"瘦身\"）、KV Cache 管理（多用户对话历史怎么挤进显存，vLLM 的看家本领）、批处理（GPU 不能闲着，来一个算一个不如攒一批一起算）。\n\n### 7. AI Agent —— 从\"你问它答\"到\"你下任务它执行\"\n\n**朴素的问题**：聊天机器人只会\"说\"，不会\"做\"。你说\"把上周销售数据整理成报表发群里\"，它只能教你步骤，活还得你自己干。\n\n**底层逻辑**：给模型装上\"**手和脚**\"（工具）和\"**工作循环**\"（闭环）：\n```\n模型不是一次说完答案，而是反复循环：\n想（Reasoning）：\"我要完成报表，先得查数据\"\n做（Acting）：    调用查数据库的工具 → 拿到结果\n再想：           \"数据有了，该生成 Excel 了\"\n再做：           调用生成文件的工具……\n直到任务完成才开口汇报\n```\n> [!note] 关键认知\n> Agent = LLM（大脑）+ 工具（手脚）+ 循环（工作方法）。大脑决定**下一步做什么**，手脚负责**真去做**，循环保证**做砸了能根据结果调整再来**。工程上最重要的护栏也因此而来：查数据可以放手，发消息必须人确认——**自主权画在\"不可逆操作\"之前**。\n\n### 8. LoRA 微调 —— 送模型去\"岗前培训班\"\n\n**朴素的问题**：通用模型什么都会一点，但说起你们行业的\"黑话\"就露怯——医疗文书、法律条款、客服话术，语气、格式、术语全不对。\n\n**底层逻辑**：模型的行为由参数决定，参数从训练中来。想让它学会新风格，就**拿行业范例再训练一轮**。但全量重训 70 亿参数要天价，LoRA 的巧思是：\n```\n不重训整个大脑，只在大脑的关键位置插几片\"记忆贴片\"（低秩矩阵）\n原参数全部冻结 → 只训练贴片（0.3% 的参数）→ 消费级显卡也玩得起\n学完：基座模型的通用能力还在，贴片注入了行业风格\n```\n> [!note] 关键认知\n> **微调 vs RAG 的分工是面试必考题，也是理解两者的钥匙**：RAG 解决\"知识问题\"（不知道的事去查），微调解决\"能力/风格问题\"（知道但不会用行话说）。知识天天变用 RAG（改文档就行），风格长期稳定用微调（训一次管很久）。实际系统经常两个都用。\n\n---\n\n## 🧩 一张图看懂 8 个项目的关系\n\n```\n运维线（让系统跑起来、跑得稳）：\n  Ansible(把机器配好) → CI/CD(把应用发上去) → K8s(让应用稳定跑) → Prometheus(盯着别出事)\n\nAI 线（让模型懂业务、会干活）：\n  私有化部署(有自己的大脑) → RAG(大脑接上知识库) → Agent(大脑学会用工具) → 微调(大脑学会行话)\n\n交叉点：私有化 LLM 部署 是运维和 AI 的交叉技能，差异化最强\n```\n\n## 相关笔记\n\n- [[简历项目实战-MOC|返回专栏首页]] — 看每个项目的详细操作步骤\n- 建议学习顺序：先读本篇建立整体认知，再按 MOC 里的顺序逐个实操", "created": "2026-07-31T09:00:00"}, {"title": "Ansible 自动化运维实战", "path": "简历项目实战/01-运维项目/20260730-Ansible自动化运维.md", "pillar": "projects", "status": "seedling", "summary": "> 服务器自动化运维体系 · 项目角色：独立实施 · 2026.XX\n>\n> - 针对多机环境重复手工操作（初始化、补丁、巡检）耗时且不一致的问题，编写 Ansible Playbook 实现标准化批量管理\n> - 新机器初始化从 2 小时/台 降至 3 分钟/台且零遗漏；批量安全补丁执行从 3 天", "content": "# Ansible 自动化运维 — 百台服务器批量管理\n\n## 📄 简历写法（可直接抄）\n\n> **服务器自动化运维体系** · 项目角色：独立实施 · 2026.XX\n>\n> - 针对多机环境**重复手工操作**（初始化、补丁、巡检）耗时且不一致的问题，编写 **Ansible Playbook** 实现标准化批量管理\n> - 新机器初始化从 **2 小时/台** 降至 **3 分钟/台**且零遗漏；批量安全补丁执行从 **3 天** 缩短到 **30 分钟**\n> - 编写**自动巡检 Playbook**，每日定时执行并生成 HTML 报告，隐患发现率提升 **50%**\n\n> [!tip] 旁批：个人怎么练\"百台\"\n> 不用真有一百台——开 2~3 台云服务器（或用 Multipass/Docker 在本机起多个容器当\"主机\"）即可完整练习所有概念。面试时讲\"设计目标是支持百台规模\" + 展示 playbook 的分批执行（serial）、并发（forks）设计，一样证明能力。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它 |\n|------|------|------------|\n| Ansible | 自动化引擎 | **无 agent**（SSH 直连）是最核心的选型理由——不用在 100 台机器上先装客户端 |\n| YAML Playbook | 任务定义 | 声明式、可读性强、可进 Git 版本管理 |\n| Ansible Galaxy | 复用社区角色 | nginx、docker 等常见角色不用从零写 |\n| Cron / AWX | 定时执行 | AWX 是 Ansible 的开源 Web 管理界面（可选进阶） |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 1：控制机安装与免密配置\n\n```bash\n# 控制机（你的电脑或一台管理机）安装\npip install ansible\nansible --version\n\n# 生成 SSH 密钥并分发到所有被管机器\nssh-keygen -t ed25519\nssh-copy-id user@192.168.1.10\nssh-copy-id user@192.168.1.11\nssh-copy-id user@192.168.1.12\n```\n\n### 步骤 2：编写主机清单（Inventory）\n\n```ini\n# inventory/hosts.ini\n[web]\n192.168.1.10\n192.168.1.11\n\n[db]\n192.168.1.12\n\n[all:vars]\nansible_user=ubuntu\nansible_ssh_private_key_file=~/.ssh/id_ed25519\n```\n\n```bash\n# 验证连通性——Ansible 的\"Hello World\"\nansible all -i inventory/hosts.ini -m ping\n# 192.168.1.10 | SUCCESS => { \"ping\": \"pong\" } ...\n```\n\n> [!tip] 旁批：分组是批量管理的核心思想\n> web/db 分组后，可以只对 web 组推应用、只对 db 组做备份策略。进阶还能用动态 inventory 从云平台 API 自动拉取主机列表——公司机器经常上下线，静态文件维护不过来。\n\n### 步骤 3：第一个实战 Playbook — 新机器初始化\n\n```yaml\n# playbooks/init-server.yml\n- name: 新服务器标准化初始化\n  hosts: all\n  become: yes                    # sudo 执行\n  vars:\n    timezone: Asia/Shanghai\n    ssh_port: 22222\n\n  tasks:\n    - name: 更新软件源缓存\n      apt:\n        update_cache: yes\n\n    - name: 安装基础工具\n      apt:\n        name:\n          - vim\n          - htop\n          - curl\n          - net-tools\n          - fail2ban              # SSH 防爆破，安全基线\n        state: present\n\n    - name: 设置时区\n      timezone:\n        name: \"{{ timezone }}\"\n\n    - name: 修改 SSH 端口（安全加固）\n      lineinfile:\n        path: /etc/ssh/sshd_config\n        regexp: '^#?Port '\n        line: \"Port {{ ssh_port }}\"\n      notify: 重启sshd\n\n    - name: 禁用密码登录，仅密钥\n      lineinfile:\n        path: /etc/ssh/sshd_config\n        regexp: '^#?PasswordAuthentication '\n        line: \"PasswordAuthentication no\"\n      notify: 重启sshd\n\n    - name: 创建运维账号并授权\n      user:\n        name: ops\n        groups: sudo\n        shell: /bin/bash\n\n  handlers:\n    - name: 重启sshd\n      service:\n        name: sshd\n        state: restarted\n```\n\n```bash\n# 执行：-C 先 dry-run 预览，确认无误后真跑\nansible-playbook -i inventory/hosts.ini playbooks/init-server.yml -C\nansible-playbook -i inventory/hosts.ini playbooks/init-server.yml\n```\n\n> [!important] 旁批：幂等性 — Ansible 最重要的概念（面试必考）\n> 同一个 playbook 跑 100 遍，结果和跑 1 遍一样：装过的包跳过、改过的配置不重复改。这是 `apt`/`lineinfile` 等**模块**的功劳——它们检查当前状态再决定是否动作。\n> **反例**：自己写 `shell: echo \"Port 22\" >> sshd_config`，每跑一遍多一行，机器就废了。能用模块就不用 shell/command。\n\n### 步骤 4：批量安装 Docker + node_exporter（和监控项目联动）\n\n```yaml\n# playbooks/setup-monitor-agent.yml\n- name: 批量部署 Docker 与监控 agent\n  hosts: all\n  become: yes\n  tasks:\n    - name: 安装 Docker\n      apt:\n        name: docker.io\n        state: present\n\n    - name: 启动 Docker 服务\n      service:\n        name: docker\n        state: started\n        enabled: yes\n\n    - name: 部署 node_exporter 容器\n      docker_container:\n        name: node-exporter\n        image: prom/node-exporter:latest\n        restart_policy: always\n        ports:\n          - \"9100:9100\"\n        volumes:\n          - /proc:/host/proc:ro\n          - /sys:/host/sys:ro\n        command:\n          - --path.procfs=/host/proc\n          - --path.sysfs=/host/sys\n```\n\n### 步骤 5：自动巡检 Playbook（体现\"主动运维\"思维）\n\n```yaml\n# playbooks/daily-inspect.yml\n- name: 每日巡检并生成报告\n  hosts: all\n  gather_facts: yes\n  tasks:\n    - name: 采集磁盘使用率\n      shell: df -h / | awk 'NR==2 {print $5}'\n      register: disk_usage\n      changed_when: false\n\n    - name: 采集内存使用率\n      shell: free | awk '/Mem:/ {printf \"%.0f\", $3/$2*100}'\n      register: mem_usage\n      changed_when: false\n\n    - name: 采集最近登录失败次数\n      shell: grep \"Failed password\" /var/log/auth.log 2>/dev/null | wc -l\n      register: failed_logins\n      changed_when: false\n      ignore_errors: yes\n\n    - name: 汇总到控制机生成报告\n      template:\n        src: templates/report-row.j2\n        dest: \"./reports/{{ inventory_hostname }}.txt\"\n      delegate_to: localhost       # 关键：在控制机本地生成\n```\n\n```bash\n# 挂 cron 每天 9 点自动跑\n0 9 * * * cd /opt/ansible && ansible-playbook -i inventory/hosts.ini playbooks/daily-inspect.yml\n```\n\n> [!tip] 旁批：changed_when: false 是什么\n> shell 模块默认每次都报 \"changed\"（它不知道你的命令改没改东西），巡检这种只读操作要显式声明 `changed_when: false`，否则 playbook 统计全是黄色 changed，看不出真正的问题。\n\n### 步骤 6：控制执行节奏（百台规模的精髓）\n\n```yaml\n- name: 分批滚动更新\n  hosts: web\n  serial: \"30%\"            # 每批只动 30% 的机器，出问题立刻停\n  max_fail_percentage: 10  # 超过 10% 失败就整体中止\n  tasks:\n    - name: 更新应用\n      # ...\n```\n\n> [!tip] 旁批：serial 是血泪经验\n> 一次推全部 100 台，配置写错就是 100 台同时挂 = 重大事故。`serial: 30%` 让更新像 K8s 滚动发布一样分批走，第一批有问题 Ctrl+C 还来得及。面试讲出这个，说明你有**变更风险意识**——这是初级和中级运维的分水岭。\n\n## 📊 成果量化模板\n\n| 指标 | 手工时代 | Ansible 后 |\n|------|----------|------------|\n| 新机初始化 | 2 小时/台，靠文档 + 记忆 | 3 分钟/台，playbook 即文档 |\n| 批量补丁 | 3 天（逐台登录） | 30 分钟（一键执行） |\n| 环境一致性 | 各机器配置漂移严重 | 幂等执行，配置统一 |\n| 巡检 | 想做但没时间 | 每日自动 + 报告 |\n\n## ❓ 面试高频问题\n\n1. **Ansible 和 Shell 脚本批发的本质区别？** → 幂等性、模块化、声明式、可读性、可版本管理；Shell 脚本是\"怎么做\"，Playbook 是\"要什么状态\"\n2. **Ansible 和 SaltStack/Puppet 比呢？** → Ansible 无 agent（SSH），上手最快；SaltStack 有 agent 但性能强、事件驱动；公司存量用什么就兼容什么，思路相通\n3. **Playbook 里密钥怎么管？** → ansible-vault 加密敏感变量文件，`--ask-vault-pass` 执行时解密\n4. **Ansible 适合做什么、不适合什么？** → 适合：配置管理、批量变更、部署编排；不适合：实时监控（那是 Prometheus 的活）、长时间状态维持（那是 K8s 的活）\n\n## 相关笔记\n\n- [[20260730-Prometheus监控体系|Prometheus 监控体系]] — Ansible 批量装 exporter，监控负责盯梢，天生一对\n- [[20260730-CI-CD流水线搭建|CI/CD 流水线搭建]] — 服务器初始化是 CI/CD 的前置条件\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "CI/CD 流水线搭建实战", "path": "简历项目实战/01-运维项目/20260730-CI-CD流水线搭建.md", "pillar": "projects", "status": "seedling", "summary": "> CI/CD 自动化部署平台 · 项目角色：主导搭建 · 2026.XX\n>\n> - 针对手动部署平均耗时 2 小时、人为失误率高的问题，基于 GitLab CI + Docker 设计并实现覆盖「构建→测试→部署→通知」的全自动流水线\n> - 单次发布耗时降至 10 分钟，发布频率从每周 1 次", "content": "# CI/CD 流水线搭建 — 部署从 2 小时到 10 分钟\n\n## 📄 简历写法（可直接抄）\n\n> **CI/CD 自动化部署平台** · 项目角色：主导搭建 · 2026.XX\n>\n> - 针对手动部署平均耗时 **2 小时**、人为失误率高的问题，基于 **GitLab CI + Docker** 设计并实现覆盖「构建→测试→部署→通知」的全自动流水线\n> - 单次发布耗时降至 **10 分钟**，发布频率从每周 1 次提升至每日多次，部署事故率下降 **80%**\n> - 引入**镜像版本管理 + 一键回滚**机制，回滚操作从 30 分钟缩短到 **1 分钟内**\n\n> [!tip] 旁批：数字怎么来\n> 没有公司数据就按个人项目如实写：\"个人博客/开源项目 CI/CD 改造\"。面试官追问时，讲清楚**改造前后的对比逻辑**（手动部署有哪些步骤、每步多久、哪步易错）比编数字更有说服力。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它（面试考点） |\n|------|------|------------------------|\n| GitLab CE / Gitee Go | 代码托管 + CI 引擎 | 国内网络可达，自带 CI 免维护 Jenkins |\n| GitLab Runner | 执行流水线任务的 agent | 支持 Docker executor，环境隔离干净 |\n| Docker | 应用容器化打包 | 环境一致性，\"一次构建到处运行\" |\n| Docker Compose | 目标机编排 | 单机场景比 K8s 轻量，学习成本低 |\n| Nginx | 反向代理 + 静态资源 | 标配，支持蓝绿切换 |\n| 钉钉/企微 Webhook | 部署结果通知 | 免费，团队可见 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 0：准备环境\n\n```bash\n# 一台 2C4G 云服务器（Ubuntu 22.04）\n# 安装 Docker\ncurl -fsSL https://get.docker.com | sh\nsudo systemctl enable --now docker\n\n# 安装 Docker Compose\nsudo apt install docker-compose-plugin -y\ndocker compose version\n```\n\n### 步骤 1：部署 GitLab（或用 Gitee 免费版替代）\n\n```bash\n# Docker 一键起 GitLab CE（4G 内存刚好够）\ndocker run -d --name gitlab \\\n  -p 8929:8929 -p 2224:22 \\\n  -v /srv/gitlab/config:/etc/gitlab \\\n  -v /srv/gitlab/logs:/var/log/gitlab \\\n  -v /srv/gitlab/data:/var/opt/gitlab \\\n  gitlab/gitlab-ce:latest\n```\n\n> [!tip] 旁批：内存不够的替代方案\n> GitLab 很吃内存（空载 ~2.5G）。服务器只有 2G 的话直接用 **Gitee Go**（码云自带流水线，免费 200 分钟/月构建时长），pipeline 语法和 GitLab CI 几乎一样，简历上写哪个都行。\n\n### 步骤 2：注册 GitLab Runner\n\n```bash\n# 安装 Runner（Docker 方式）\ndocker run -d --name gitlab-runner --restart always \\\n  -v /srv/gitlab-runner/config:/etc/gitlab-runner \\\n  -v /var/run/docker.sock:/var/run/docker.sock \\\n  gitlab/gitlab-runner:latest\n\n# 注册到 GitLab（token 在 GitLab → Settings → CI/CD → Runners 获取）\ndocker exec -it gitlab-runner gitlab-runner register \\\n  --url http://你的IP:8929 \\\n  --token <REGISTRATION_TOKEN> \\\n  --executor docker \\\n  --docker-image docker:24\n```\n\n> [!warning] 旁批：为什么挂载 docker.sock\n> Runner 用 Docker executor 跑任务时，构建镜像需要访问宿主机 Docker。挂 sock 是最简单的方式（叫 Docker-out-of-Docker）。面试可能追问安全性——答案：生产环境可用 `kaniko` 无特权构建替代。\n\n### 步骤 3：编写 `.gitlab-ci.yml`（项目核心）\n\n在应用仓库根目录创建：\n\n```yaml\nstages:\n  - test\n  - build\n  - deploy\n\nvariables:\n  IMAGE_NAME: registry.example.com/myapp\n  IMAGE_TAG: $CI_COMMIT_SHORT_SHA        # 用 commit 短哈希做版本号\n\n# ---- 阶段1：测试 ----\nunit-test:\n  stage: test\n  image: python:3.11\n  script:\n    - pip install -r requirements.txt\n    - pytest tests/ -v --junitxml=report.xml\n  artifacts:\n    reports:\n      junit: report.xml                  # 测试结果在 GitLab UI 展示\n\n# ---- 阶段2：构建镜像并推送 ----\nbuild-image:\n  stage: build\n  image: docker:24\n  services:\n    - docker:24-dind\n  script:\n    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS registry.example.com\n    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .\n    - docker push $IMAGE_NAME:$IMAGE_TAG\n    - docker push $IMAGE_NAME:latest\n  only:\n    - main                               # 只有 main 分支才构建\n\n# ---- 阶段3：部署到生产服务器 ----\ndeploy-prod:\n  stage: deploy\n  image: alpine:latest\n  before_script:\n    - apk add --no-cache openssh-client\n    - eval $(ssh-agent -s)\n    - echo \"$SSH_PRIVATE_KEY\" | tr -d '\\r' | ssh-add -\n    - mkdir -p ~/.ssh && chmod 700 ~/.ssh\n    - ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts\n  script:\n    - ssh $PROD_USER@$PROD_HOST \"\n        cd /opt/myapp &&\n        docker compose pull &&\n        docker compose up -d &&\n        docker image prune -f\"\n  after_script:\n    - 'curl -H \"Content-Type: application/json\" -d \"{\\\"msgtype\\\":\\\"text\\\",\\\"text\\\":{\\\"content\\\":\\\"✅ myapp 部署完成: $IMAGE_TAG\\\"}}\" $DINGTALK_WEBHOOK'\n  when: manual                           # 手动触发，生产环境保险\n```\n\n> [!tip] 旁批：三个关键设计决策（面试必问）\n> 1. **IMAGE_TAG 用 commit 哈希而非 latest**：每个镜像可追溯、可回滚——用 latest 你永远不知道线上跑的是哪个版本\n> 2. **deploy 设 `when: manual`**：自动到 build 为止，生产部署留一个人工确认按钮，这是公司里的标准做法\n> 3. **密钥全走 CI Variables**（Settings → CI/CD → Variables），永不写进仓库——SSH_PRIVATE_KEY、REGISTRY_PASS 都设成 masked 变量\n\n### 步骤 4：编写应用 Dockerfile（多阶段构建）\n\n```dockerfile\n# ---- 构建阶段 ----\nFROM python:3.11-slim AS builder\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --user -r requirements.txt\n\n# ---- 运行阶段 ----\nFROM python:3.11-slim\nWORKDIR /app\nCOPY --from=builder /root/.local /root/.local\nCOPY . .\nENV PATH=/root/.local/bin:$PATH\nEXPOSE 8000\nCMD [\"uvicorn\", \"main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\"]\n```\n\n> [!tip] 旁批：为什么多阶段构建\n> 构建工具（gcc、pip 缓存）不进最终镜像，镜像体积从 ~1.1GB 降到 ~200MB。镜像越小：推送越快、部署越快、攻击面越小。面试说得出这三个理由就过关。\n\n### 步骤 5：目标服务器 compose 配置\n\n```yaml\n# /opt/myapp/docker-compose.yml\nservices:\n  app:\n    image: registry.example.com/myapp:latest\n    restart: always\n    ports:\n      - \"8000:8000\"\n    environment:\n      - ENV=production\n  nginx:\n    image: nginx:alpine\n    restart: always\n    ports:\n      - \"80:80\"\n    volumes:\n      - ./nginx.conf:/etc/nginx/conf.d/default.conf\n```\n\n### 步骤 6：验证回滚（面试加分项）\n\n```bash\n# 出问题时，在目标机执行——直接改镜像 tag 回上一版\ncd /opt/myapp\nsed -i 's/myapp:latest/myapp:abc1234/' docker-compose.yml\ndocker compose up -d\n# 全程 < 1 分钟\n```\n\n## 📊 成果量化模板\n\n| 指标 | 改造前 | 改造后 |\n|------|--------|--------|\n| 单次部署耗时 | 2 小时（手动 12 步） | 10 分钟（自动） |\n| 发布频率 | 每周 1 次 | 每日多次 |\n| 回滚耗时 | 30 分钟（重装环境） | 1 分钟（切镜像） |\n| 部署事故率 | 月均 2~3 次 | 趋近于 0 |\n\n## ❓ 面试高频问题\n\n1. **流水线里怎么做测试？** → test 阶段跑 pytest，失败则流水线中断，后续阶段不执行；测试报告用 artifacts 上传展示\n2. **怎么保证密钥安全？** → CI Variables（masked）+ 权限分级，密钥不进仓库、不进镜像、不进日志\n3. **蓝绿部署和滚动更新区别？** → 蓝绿：两套环境瞬时切换，回滚快但资源翻倍；滚动：分批替换，省资源但发布过程中新旧版本并存\n4. **CI 和 CD 的边界在哪？** → CI 到\"构建出可部署的产物（镜像）\"为止；CD 是\"把产物安全地放到生产\"\n\n## 相关笔记\n\n- [[20260730-K8s容器编排实战|K8s 容器编排实战]] — 流水线产出镜像后，K8s 负责大规模运行\n- [[20260730-Ansible自动化运维|Ansible 自动化运维]] — 目标服务器初始化可用 Ansible 批量完成\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "K8s 容器编排实战", "path": "简历项目实战/01-运维项目/20260730-K8s容器编排实战.md", "pillar": "projects", "status": "seedling", "summary": "> 微服务容器化与 K8s 编排改造 · 项目角色：方案设计 + 实施 · 2026.XX\n>\n> - 将 N 个微服务从单机 Docker Compose 迁移至 Kubernetes 集群，实现服务自动调度、故障自愈与弹性扩缩容\n> - 通过 Deployment 滚动更新 + Readines", "content": "# K8s 容器编排实战 — 零停机滚动发布\n\n## 📄 简历写法（可直接抄）\n\n> **微服务容器化与 K8s 编排改造** · 项目角色：方案设计 + 实施 · 2026.XX\n>\n> - 将 **N 个微服务**从单机 Docker Compose 迁移至 **Kubernetes 集群**，实现服务自动调度、故障自愈与弹性扩缩容\n> - 通过 **Deployment 滚动更新 + Readiness 探针**实现发布全程**零停机**，用户无感知\n> - 配置 **HPA 水平自动扩缩容**（基于 CPU/内存），高峰期自动从 2 副本扩到 8 副本，资源成本较固定高配方案下降 **35%**\n\n> [!tip] 旁批：个人没有微服务系统怎么办\n> 用开源项目练手即可：`microservices-demo`（Google 出品，11 个微服务的在线商店）或 `mall`（国产电商系统）。部署别人的系统同样能覆盖 K8s 全部核心技能点，简历写\"基于开源微服务系统完成 K8s 部署改造与调优\"。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它 |\n|------|------|------------|\n| k3s / kubeadm | 搭 K8s 集群 | k3s 单机 1 条命令起集群，个人练习神器；kubeadm 是生产标准 |\n| Kubernetes | 容器编排 | 云原生事实标准 |\n| Helm | 应用打包部署 | K8s 的\"应用商店\"，复杂应用一键装 |\n| Ingress-Nginx | 统一入口/域名路由 | 替代每个服务一个 NodePort 的混乱 |\n| Metrics Server | 资源指标采集 | HPA 扩缩容的数据来源 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 1：一条命令起 k3s 集群\n\n```bash\n# 在服务器上执行（1~2 分钟完成）\ncurl -sfL https://get.k3s.io | sh -\n\n# 验证\nsudo k3s kubectl get nodes\n# NAME    STATUS   ROLES                  AGE   VERSION\n# node1   Ready    control-plane,master   1m    v1.29.x\n\n# 把 kubeconfig 配好，之后直接用 kubectl\nmkdir -p ~/.kube\nsudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config\nsudo chown $USER ~/.kube/config\n```\n\n> [!tip] 旁批：k3s vs kubeadm vs minikube 怎么选\n> - **minikube**：跑在自己电脑虚拟机里，适合纯学习，但\"不像生产\"\n> - **k3s**：轻量发行版（<100MB），单台 2C4G 云服务器就能跑，体验和真实集群 99% 一致 —— **个人实操首选**\n> - **kubeadm**：生产标准部署方式，面试时聊\"我用 kubeadm 搭过 3 节点集群\"是加分项，时间充裕再练\n\n### 步骤 2：部署应用 — 三个核心对象\n\n```yaml\n# app.yaml —— Deployment + Service + Ingress 三件套\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: webapp\nspec:\n  replicas: 3                          # 3 副本，挂 1 个还剩 2 个\n  strategy:\n    rollingUpdate:\n      maxSurge: 1                      # 更新时最多多 1 个\n      maxUnavailable: 0                # 更新时最少可用 0 个 = 零停机关键\n  selector:\n    matchLabels:\n      app: webapp\n  template:\n    metadata:\n      labels:\n        app: webapp\n    spec:\n      containers:\n      - name: webapp\n        image: registry.example.com/myapp:v1.2.0\n        ports:\n        - containerPort: 8000\n        resources:\n          requests:                    # 调度依据：保证有 100m CPU\n            cpu: 100m\n            memory: 128Mi\n          limits:                      # 防爆：最多用 500m\n            cpu: 500m\n            memory: 512Mi\n        readinessProbe:                # 就绪探针：没 ready 不接流量\n          httpGet:\n            path: /health\n            port: 8000\n          initialDelaySeconds: 5\n          periodSeconds: 10\n        livenessProbe:                 # 存活探针：假死自动重启\n          httpGet:\n            path: /health\n            port: 8000\n          initialDelaySeconds: 15\n          periodSeconds: 20\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: webapp-svc\nspec:\n  selector:\n    app: webapp\n  ports:\n  - port: 80\n    targetPort: 8000\n---\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: webapp-ingress\nspec:\n  rules:\n  - host: app.example.com\n    http:\n      paths:\n      - path: /\n        pathType: Prefix\n        backend:\n          service:\n            name: webapp-svc\n            port:\n              number: 80\n```\n\n```bash\nkubectl apply -f app.yaml\nkubectl get pods -w        # 观察 3 个 Pod 逐个 Running\n```\n\n> [!important] 旁批：零停机的两个支柱（面试必考）\n> 1. **`maxUnavailable: 0`** — 更新过程中可用副本数永远 ≥ 期望值，先拉起新版本、就绪后才杀旧版本\n> 2. **Readiness 探针** — 新 Pod 必须通过了 `/health` 检查才被加进 Service 的负载池接流量。没有它，应用启动慢的几秒内流量会打到还没准备好的 Pod 上 = 请求失败\n>\n> 只改镜像不加探针 ≠ 零停机，很多人实操栽在这里。\n\n### 步骤 3：发布新版本（体验滚动更新）\n\n```bash\n# 改镜像版本 = 触发滚动更新\nkubectl set image deployment/webapp webapp=registry.example.com/myapp:v1.3.0\n\n# 实时观察：新 Pod 逐个创建→就绪→旧 Pod 逐个删除\nkubectl rollout status deployment/webapp\n\n# 出问题？一条命令回滚到上一版\nkubectl rollout undo deployment/webapp\n\n# 查看历史版本\nkubectl rollout history deployment/webapp\n```\n\n### 步骤 4：配置 HPA 自动扩缩容\n\n```bash\n# 先装 metrics-server（k3s 自带，kubeadm 集群需要单独装）\nkubectl top nodes        # 验证能拿到指标\n\n# 创建 HPA：CPU 超过 50% 就扩容，2~8 副本之间伸缩\nkubectl autoscale deployment webapp \\\n  --cpu-percent=50 --min=2 --max=8\n```\n\n> [!tip] 旁批：扩缩容阈值怎么定\n> CPU 50% 是常用起点。定太高（如 90%）：等触发扩容时服务已经卡了；定太低（如 20%）：稍微抖动就扩容，浪费钱。面试可以补一句：\"生产环境更精细的做法是基于 QPS/延迟的自定义指标（KEDA）\"。\n\n### 步骤 5：压测验证弹性（最有成就感的环节）\n\n```bash\n# 起一个压测 Pod 狂打流量\nkubectl run -i --tty loadgen --image=busybox --restart=Never -- /bin/sh\n# 容器内执行：\nwhile true; do wget -q -O- http://webapp-svc/; done\n\n# 另开终端观察：CPU 飙升 → HPA 触发 → 副本数 2→4→8\nkubectl get hpa -w\nkubectl get pods -w\n```\n\n### 步骤 6：HTTPS 证书（可选加分）\n\n```bash\n# Helm 装 cert-manager，自动签发 Let's Encrypt 证书\nhelm repo add jetstack https://charts.jetstack.io\nhelm install cert-manager jetstack/cert-manager \\\n  --namespace cert-manager --create-namespace \\\n  --set installCRDs=true\n```\n\n## 📊 成果量化模板\n\n| 指标 | 改造前（Compose） | 改造后（K8s） |\n|------|-------------------|---------------|\n| 发布停机时间 | 每次 5~10 分钟 | 0 秒 |\n| 故障恢复 | 人工发现+重启，~30 分钟 | 自愈，~30 秒 |\n| 高峰应对 | 固定 8 台常开 | 2~8 弹性伸缩，省 35% 成本 |\n| 扩容操作 | 手动加机器部署，小时级 | 自动，分钟级 |\n\n## ❓ 面试高频问题\n\n1. **Pod 挂了就数据丢了怎么办？** → 无状态应用无所谓；有状态（数据库）用 StatefulSet + PV/PVC 持久卷，数据库一般不放进 K8s 或用 Operator 管理\n2. **Service 是怎么找到 Pod 的？** → 通过 label selector，Service 维护 endpoints 列表，kube-proxy 负责转发（iptables/ipvs 模式）\n3. **Deployment 和 StatefulSet 区别？** → Deployment 面向无状态，Pod  interchangeable；StatefulSet 有稳定网络标识和存储，面向有状态应用\n4. **K8s 集群里 DNS 怎么工作？** → CoreDNS 提供集群内服务发现，`服务名.命名空间.svc.cluster.local`\n5. **node 挂了 Pod 怎么办？** → 控制器发现 Pod 失联，自动在健康节点重建（自愈）\n\n## 相关笔记\n\n- [[20260730-CI-CD流水线搭建|CI/CD 流水线搭建]] — 流水线负责\"构建镜像\"，K8s 负责\"运行镜像\"，两个项目串起来讲是完整故事\n- [[20260730-Prometheus监控体系|Prometheus 监控体系]] — K8s 集群的监控标准方案\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "Prometheus 监控体系搭建", "path": "简历项目实战/01-运维项目/20260730-Prometheus监控体系.md", "pillar": "projects", "status": "seedling", "summary": "> 全栈监控告警平台建设 · 项目角色：独立搭建 · 2026.XX\n>\n> - 基于 Prometheus + Grafana + Alertmanager 搭建覆盖「主机→容器→应用」三层的监控体系，纳管 N 台服务器与核心服务\n> - 设计 20+ 条告警规则并分级（P0 电话/P1 钉钉/P", "content": "# Prometheus 监控体系 — MTTR 从 45 分钟降到 10 分钟\n\n## 📄 简历写法（可直接抄）\n\n> **全栈监控告警平台建设** · 项目角色：独立搭建 · 2026.XX\n>\n> - 基于 **Prometheus + Grafana + Alertmanager** 搭建覆盖「主机→容器→应用」三层的监控体系，纳管 **N 台**服务器与核心服务\n> - 设计 **20+ 条告警规则**并分级（P0 电话/P1 钉钉/P2 邮件），告警准确率 90%+，故障平均发现时间从 **45 分钟降至 3 分钟**\n> - 输出标准化 Grafana 仪表盘，实现故障定位时间（MTTR）缩短 **75%**\n\n> [!tip] 旁批：MTTR 是运维面试的硬通货\n> MTTR（Mean Time To Repair，平均故障修复时间）= 发现时间 + 定位时间 + 修复时间。监控主要压缩前两段。面试时按这个公式讲，显得你理解监控的**目的**而不只是工具。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它 |\n|------|------|------------|\n| Prometheus | 指标采集与存储 | 云原生监控标准，PromQL 查询语言强大 |\n| node_exporter | 主机指标采集 | CPU/内存/磁盘/网络全覆盖，官方出品 |\n| Grafana | 可视化仪表盘 | 图表美观，社区模板一键导入 |\n| Alertmanager | 告警路由与静默 | 告警分组、去重、分级路由 |\n| 钉钉/企微 Webhook | 告警通知 | 国内团队触达最快 |\n| cAdvisor / kube-state-metrics | 容器/K8s 指标 | 有 K8s 项目时用 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 1：Docker Compose 一键起核心三件套\n\n```yaml\n# /opt/monitor/docker-compose.yml\nservices:\n  prometheus:\n    image: prom/prometheus:latest\n    container_name: prometheus\n    restart: always\n    ports:\n      - \"9090:9090\"\n    volumes:\n      - ./prometheus.yml:/etc/prometheus/prometheus.yml\n      - ./rules/:/etc/prometheus/rules/\n      - prometheus-data:/prometheus\n    command:\n      - '--config.file=/etc/prometheus/prometheus.yml'\n      - '--storage.tsdb.retention.time=30d'    # 数据保留 30 天\n\n  grafana:\n    image: grafana/grafana:latest\n    container_name: grafana\n    restart: always\n    ports:\n      - \"3000:3000\"\n    volumes:\n      - grafana-data:/var/lib/grafana\n    environment:\n      - GF_SECURITY_ADMIN_PASSWORD=改个强密码\n\n  alertmanager:\n    image: prom/alertmanager:latest\n    container_name: alertmanager\n    restart: always\n    ports:\n      - \"9093:9093\"\n    volumes:\n      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml\n\nvolumes:\n  prometheus-data:\n  grafana-data:\n```\n\n```bash\ncd /opt/monitor && docker compose up -d\n```\n\n### 步骤 2：被监控机器装 node_exporter\n\n```bash\n# 每台要监控的服务器执行\ndocker run -d --name node-exporter --restart always \\\n  -p 9100:9100 \\\n  -v /proc:/host/proc:ro \\\n  -v /sys:/host/sys:ro \\\n  -v /:/rootfs:ro \\\n  prom/node-exporter:latest \\\n  --path.procfs=/host/proc --path.sysfs=/host/sys\n```\n\n### 步骤 3：配置 Prometheus 采集\n\n```yaml\n# prometheus.yml\nglobal:\n  scrape_interval: 15s          # 每 15 秒抓一次指标\n  evaluation_interval: 15s      # 每 15 秒算一次告警规则\n\nrule_files:\n  - \"rules/*.yml\"\n\nalerting:\n  alertmanagers:\n    - static_configs:\n        - targets: [\"alertmanager:9093\"]\n\nscrape_configs:\n  - job_name: \"prometheus\"\n    static_configs:\n      - targets: [\"localhost:9090\"]\n\n  - job_name: \"nodes\"\n    static_configs:\n      - targets:\n          - \"192.168.1.10:9100\"    # 被监控机器1\n          - \"192.168.1.11:9100\"    # 被监控机器2\n        labels:\n          env: production\n```\n\n> [!tip] 旁批：scrape_interval 设多少合适\n> 15s 是社区默认值，兼顾实时性与存储开销。关键业务可设 5s，但要注意：间隔越短数据量越大，30 天 retention 下每 5s 一个指标一年约 1GB。别设 1s——那是 APM 的领域不是监控的。\n\n### 步骤 4：编写告警规则（项目灵魂）\n\n```yaml\n# rules/host-alerts.yml\ngroups:\n- name: host-alerts\n  rules:\n  # P1: CPU 持续 5 分钟超 85%\n  - alert: HighCPUUsage\n    expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 85\n    for: 5m\n    labels:\n      severity: warning\n    annotations:\n      summary: \"主机 {{ $labels.instance }} CPU 使用率过高\"\n      description: \"当前 CPU 使用率 {{ $value | humanize }}%，持续超过 5 分钟\"\n\n  # P0: 磁盘剩余不足 10%\n  - alert: DiskSpaceLow\n    expr: (1 - node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100 > 90\n    for: 2m\n    labels:\n      severity: critical\n    annotations:\n      summary: \"主机 {{ $labels.instance }} 磁盘即将写满\"\n\n  # P0: 机器失联（exporter 挂了或机器挂了）\n  - alert: InstanceDown\n    expr: up == 0\n    for: 1m\n    labels:\n      severity: critical\n    annotations:\n      summary: \"主机 {{ $labels.instance }} 监控失联\"\n\n  # P2: 内存超 90%\n  - alert: HighMemoryUsage\n    expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90\n    for: 5m\n    labels:\n      severity: info\n    annotations:\n      summary: \"主机 {{ $labels.instance }} 内存使用率过高\"\n```\n\n> [!important] 旁批：告警设计的三个心法（面试加分）\n> 1. **告警要有 `for` 持续时间**：瞬时抖动不报警，避免\"狼来了\"导致团队对告警麻木——这是监控建设最大的坑\n> 2. **按 severity 分级路由**：critical 打电话/钉钉强提醒，warning 发群里，info 只记录。所有告警一个通道 = 没有告警\n> 3. **annotation 写人话**：值班的人凌晨 3 点看到 \"CPU 过高，当前 92%，持续 5 分钟\" 比看到 \"HighCPUUsage firing\" 有用一万倍\n\n### 步骤 5：配置 Alertmanager 分级通知\n\n```yaml\n# alertmanager.yml\nglobal:\n  resolve_timeout: 5m\n\nroute:\n  receiver: default\n  group_by: ['alertname', 'severity']\n  group_wait: 30s          # 同组告警等 30s 聚合发送，防轰炸\n  group_interval: 5m\n  repeat_interval: 4h      # 未恢复的告警 4 小时重发一次\n  routes:\n    - match:\n        severity: critical\n      receiver: dingtalk-urgent\n    - match:\n        severity: warning\n      receiver: dingtalk-normal\n\nreceivers:\n- name: default\n  webhook_configs:\n    - url: http://dingtalk-webhook:8060/dingtalk/ops/send\n\n- name: dingtalk-urgent\n  webhook_configs:\n    - url: http://dingtalk-webhook:8060/dingtalk/ops/send\n      send_resolved: true    # 恢复也通知，闭环\n\n- name: dingtalk-normal\n  webhook_configs:\n    - url: http://dingtalk-webhook:8060/dingtalk/notice/send\n```\n\n> [!tip] 旁批：钉钉 webhook 怎么接\n> Alertmanager 原生不支持钉钉，社区方案是跑一个 `prometheus-webhook-dingtalk` 小服务做格式转换，Docker 一行起。群机器人创建：钉钉群 → 智能群助手 → 添加机器人 → 自定义，拿到 webhook 地址填进去。\n\n### 步骤 6：Grafana 仪表盘（5 分钟出效果）\n\n```bash\n# Grafana → Connections → Data sources → 添加 Prometheus\n# URL 填 http://prometheus:9090\n\n# 然后导入社区现成模板（不用自己画）：\n# Dashboards → Import → 输入模板 ID：\n#   1860   —— Node Exporter Full（主机监控，最经典）\n#   315    —— Kubernetes cluster monitoring（有 K8s 时用）\n#   893    —— Docker 监控\n```\n\n导入后你就有了一个**看起来很贵**的监控大屏——CPU/内存/磁盘/网络/进程全有，多机对比、历史趋势齐全。\n\n### 步骤 7：演练！亲手制造一次故障\n\n```bash\n# 在被监控机器上跑死 CPU，验证全链路\nstress-ng --cpu 4 --timeout 300s\n\n# 观察：Prometheus 指标飙升 → 5分钟后告警触发 → 钉钉收到消息\n# → stress 停止 → 指标回落 → 收到\"已恢复\"通知\n```\n\n> [!important] 旁批：演练是必做项\n> 没演练过的告警等于没有告警——你永远不知道哪一环是断的（webhook 地址错了？规则表达式写错了？Alertmanager 没 reload？）。简历上写\"通过定期故障演练验证告警链路有效性\"是很亮眼的细节。\n\n## 📊 成果量化模板\n\n| 指标 | 建设前 | 建设后 |\n|------|--------|--------|\n| 故障发现 | 用户报障才知道，~45 分钟 | 告警主动推送，~3 分钟 |\n| 故障定位 | 逐台登录机器排查 | 看大盘锁定异常机器，~10 分钟 |\n| 磁盘写满事故 | 每季度 2~3 次 | 提前 1~2 天预警，0 次 |\n| 告警有效性 | — | 分级 + 演练，准确率 90%+ |\n\n## ❓ 面试高频问题\n\n1. **Prometheus 是推还是拉？** → 拉（pull）：Prometheus 定期去各 exporter 的 `/metrics` 端点抓数据。好处：中心化管理目标、实例挂了马上知道（up==0）；缺点：短生命周期任务抓不到 → 用 Pushgateway 补充\n2. **PromQL 里 rate 和 irate 区别？** → rate 取区间平均速率（平滑，适合告警）；irate 取最后两个点的瞬时速率（敏感，适合看图找尖刺）\n3. **Prometheus 高可用怎么做？** → 双实例并行采集（数据重复但可接受）+ Thanos/VictoriaMetrics 做长期存储与全局视图\n4. **监控和告警的边界？** → 监控覆盖面要广（能看一切），告警面要窄（只报需要人立即处理的）——\"告警即工单\"\n\n## 相关笔记\n\n- [[20260730-K8s容器编排实战|K8s 容器编排实战]] — K8s 的监控就是 Prometheus 全家桶，两个项目互相成就\n- [[20260730-Ansible自动化运维|Ansible 自动化运维]] — 用 Ansible 批量装 node_exporter 是天然搭档\n- [[简历项目实战-MOC|返回专栏首页]]", "created": "2026-07-30T16:00:00"}, {"title": "ELK Stack 日志收集与分析平台", "path": "简历项目实战/01-运维项目/20260827-ELK日志收集分析平台.md", "pillar": "projects", "status": "seedling", "summary": "> ELK日志收集与分析平台 · 项目角色：主导搭建 · 2026.XX\n>\n> - 针对分布式系统日志分散难以集中查看、故障排查需要登录多台服务器逐个检查的问题，基于 Elasticsearch + Logstash + Kibana + Filebeat 设计并实现企业级日志收集与分析平台\n> ", "content": "# ELK Stack 日志收集与分析平台\n\n## 📄 简历写法（可直接抄）\n\n> **ELK日志收集与分析平台** · 项目角色：主导搭建 · 2026.XX\n>\n> - 针对分布式系统**日志分散难以集中查看**、故障排查**需要登录多台服务器逐个检查**的问题，基于 **Elasticsearch + Logstash + Kibana + Filebeat** 设计并实现企业级日志收集与分析平台\n> - 实现**全链路日志集中管理**，故障定位时间从 **2小时** 缩短至 **5分钟**，日志查询效率提升 **90%**\n> - 配置**智能告警规则**，关键错误实时通知，故障响应时间从 **30分钟** 缩短至 **5分钟**，MTTR降低 **80%**\n\n> [!tip] 旁批：数字怎么来\n> 没有公司数据就按个人项目如实写：\"个人博客/开源项目日志平台搭建\"。面试官追问时，讲清楚**改造前后的对比逻辑**（没有日志平台时如何排查问题、有多痛苦）比编数字更有说服力。\n\n## 🧰 技术栈\n\n| 工具 | 用途 | 为什么选它（面试考点） |\n|------|------|------------------------|\n| Elasticsearch 8.x | 日志存储与搜索引擎 | 分布式、近实时、全文搜索、RESTful API |\n| Logstash 8.x | 日志收集、解析、转换 | 强大的数据处理管道，支持多种输入输出 |\n| Kibana 8.x | 日志可视化与分析 | 丰富的图表、仪表盘、告警功能 |\n| Filebeat 8.x | 轻量级日志收集器 | 资源占用少、可靠传输、支持背压 |\n| Docker | 容器化部署 | 环境一致性、快速部署、易于扩展 |\n\n## 🛠️ 详细操作步骤\n\n### 步骤 0：准备环境\n\n**在哪里操作**：您的本地电脑（Windows/Mac/Linux都可以）\n\n**操作目的**：准备一台云服务器作为实验环境\n\n```bash\n# 1. 购买云服务器（推荐配置）\n# - 阿里云/腾讯云/华为云 学生机（约¥10/月）\n# - 配置：4核CPU、8GB内存、80GB硬盘（ELK比较吃内存）\n# - 系统：Ubuntu 22.04 LTS（推荐）\n# - 注意：ELK至少需要8GB内存，4GB会很卡\n\n# 2. 登录服务器（在本地电脑终端执行）\n# Windows用户：使用PowerShell或Git Bash\n# Mac/Linux用户：打开终端\nssh root@你的服务器IP\n\n# 3. 更新系统（必须执行）\nsudo apt update && sudo apt upgrade -y\n\n# 4. 安装必要工具\nsudo apt install -y curl wget git vim net-tools\n```\n\n> [!warning] 旁批：内存要求\n> Elasticsearch默认JVM堆内存是1GB，但建议设置为物理内存的一半。8GB内存的服务器，建议设置为4GB。\n\n### 步骤 1：安装Docker和Docker Compose\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：安装容器化环境\n\n```bash\n# 1. 安装Docker\ncurl -fsSL https://get.docker.com | sh\n\n# 2. 启动Docker并设置开机自启\nsudo systemctl start docker\nsudo systemctl enable docker\n\n# 3. 将当前用户添加到docker组（免sudo执行docker命令）\nsudo usermod -aG docker $USER\n\n# 4. 重新登录服务器（使组权限生效）\nexit\nssh root@你的服务器IP\n\n# 5. 验证Docker安装\ndocker --version\n# 应该显示类似：Docker version 24.0.7\n\n# 6. 安装Docker Compose\nsudo apt install -y docker-compose-plugin\n\n# 7. 验证Docker Compose安装\ndocker compose version\n# 应该显示类似：Docker Compose version v2.23.3\n```\n\n**代码解释**：\n- `curl -fsSL https://get.docker.com | sh`：一键安装Docker官方脚本\n- `usermod -aG docker $USER`：将当前用户添加到docker组，这样就不需要每次sudo\n- `docker compose`：Docker官方的多容器编排工具（旧版本是`docker-compose`）\n\n> [!tip] 旁批：为什么用Docker部署ELK\n> 手动安装ELK需要配置Java、Elasticsearch、Logstash、Kibana等多个组件，非常复杂。Docker一键部署，几分钟就能跑起来。\n\n### 步骤 2：创建ELK项目目录\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：创建项目目录结构\n\n```bash\n# 1. 创建项目目录\nmkdir -p /opt/elk\ncd /opt/elk\n\n# 2. 创建必要的子目录\nmkdir -p config/elasticsearch\nmkdir -p config/logstash\nmkdir -p config/kibana\nmkdir -p data/elasticsearch\nmkdir -p data/logstash\nmkdir -p logs\n\n# 3. 查看目录结构\ntree -L 2\n# 应该看到：\n# /opt/elk\n# ├── config\n# │   ├── elasticsearch\n# │   ├── kibana\n# │   └── logstash\n# ├── data\n# │   ├── elasticsearch\n# │   └── logstash\n# └── logs\n```\n\n**代码解释**：\n- `/opt/elk`：ELK项目根目录\n- `config`：存放配置文件，方便管理和备份\n- `data`：存放数据，Elasticsearch索引数据会在这里\n- `logs`：存放日志文件\n\n### 步骤 3：配置Elasticsearch\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：配置Elasticsearch搜索引擎\n\n```bash\n# 1. 创建Elasticsearch配置文件\ncat > /opt/elk/config/elasticsearch/elasticsearch.yml << 'EOF'\n# 集群名称\ncluster.name: \"elk-cluster\"\n\n# 节点名称\nnode.name: \"elasticsearch-1\"\n\n# 数据存储路径\npath.data: /usr/share/elasticsearch/data\n\n# 日志存储路径\npath.logs: /usr/share/elasticsearch/logs\n\n# 网络设置\nnetwork.host: 0.0.0.0\nhttp.port: 9200\n\n# 集群发现设置（单节点模式）\ndiscovery.type: single-node\n\n# 内存锁定（重要！防止使用swap）\nbootstrap.memory_lock: true\n\n# 安全设置（生产环境必须配置）\nxpack.security.enabled: false\nxpack.security.enrollment.enabled: false\n\n# 性能优化\nindices.memory.index_buffer_size: 20%\nthread_pool.write.queue_size: 1000\nEOF\n\n# 2. 创建Elasticsearch环境变量文件\ncat > /opt/elk/config/elasticsearch/.env << 'EOF'\n# JVM堆内存设置（建议物理内存的一半）\nES_JAVA_OPTS=\"-Xms2g -Xmx2g\"\n\n# 环境变量\nELASTIC_PASSWORD=changeme\nDISCOVERY_TYPE=single-node\nxpack.security.enabled=false\nEOF\n\n# 3. 设置数据目录权限\nsudo chown -R 1000:1000 /opt/elk/data/elasticsearch\n```\n\n**代码解释**：\n- `cluster.name`：Elasticsearch集群名称，同一集群的所有节点必须相同\n- `node.name`：当前节点名称，必须唯一\n- `network.host: 0.0.0.0`：监听所有网络接口，允许外部访问\n- `discovery.type: single-node`：单节点模式，不需要配置集群发现\n- `bootstrap.memory_lock: true`：锁定内存，防止使用swap，提升性能\n- `ES_JAVA_OPTS`：JVM堆内存设置，`-Xms`是初始大小，`-Xmx`是最大大小\n\n> [!warning] 旁批：内存锁定\n> 如果出现\"memory locking failed\"错误，需要禁用swap：\n> ```bash\n> sudo swapoff -a\n> sudo sed -i '/ swap / s/^\\(.*\\)$/#\\1/g' /etc/fstab\n> ```\n\n### 步骤 4：配置Logstash\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：配置日志收集和处理管道\n\n```bash\n# 1. 创建Logstash配置文件\ncat > /opt/elk/config/logstash/logstash.yml << 'EOF'\n# HTTP API设置\nhttp.host: \"0.0.0.0\"\nhttp.port: 9600\n\n# 持久化队列（防止数据丢失）\nqueue.type: persisted\nqueue.max_bytes: 1gb\n\n# 日志级别\nlog.level: info\n\n# 监控设置\nxpack.monitoring.enabled: false\nEOF\n\n# 2. 创建Logstash管道配置（核心！）\ncat > /opt/elk/config/logstash/pipeline/logstash.conf << 'EOF'\n# 输入配置：从Filebeat接收日志\ninput {\n  beats {\n    port => 5044\n  }\n  \n  # 可选：直接读取文件（用于测试）\n  # file {\n  #   path => \"/var/log/*.log\"\n  #   start_position => \"beginning\"\n  # }\n}\n\n# 过滤配置：解析和转换日志\nfilter {\n  # 解析JSON格式日志\n  if [message] =~ /^\\{/ {\n    json {\n      source => \"message\"\n      target => \"parsed\"\n      skip_on_invalid_json => true\n    }\n  }\n  \n  # 解析Nginx日志格式\n  if [fileset][name] == \"access\" {\n    grok {\n      match => { \n        \"message\" => \"%{COMBINEDAPACHELOG}\" \n      }\n    }\n    date {\n      match => [ \"timestamp\", \"dd/MMM/yyyy:HH:mm:ss Z\" ]\n    }\n    geoip {\n      source => \"clientip\"\n    }\n  }\n  \n  # 解析系统日志（syslog）\n  if [fileset][module] == \"system\" {\n    grok {\n      match => { \n        \"message\" => \"%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\\[%{POSINT:syslog_pid}\\])?: %{GREEDYDATA:syslog_message}\" \n      }\n    }\n  }\n  \n  # 添加字段\n  mutate {\n    add_field => { \n      \"environment\" => \"production\"\n      \"project\" => \"elk-demo\"\n    }\n    remove_field => [ \"host\" ]\n  }\n  \n  # 过滤健康检查日志（减少噪音）\n  if [message] =~ /healthcheck|heartbeat/ {\n    drop { }\n  }\n}\n\n# 输出配置：发送到Elasticsearch\noutput {\n  elasticsearch {\n    hosts => [\"http://elasticsearch:9200\"]\n    index => \"%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}\"\n    user => \"elastic\"\n    password => \"${ELASTIC_PASSWORD}\"\n  }\n  \n  # 可选：同时输出到控制台（调试用）\n  # stdout {\n  #   codec => rubydebug\n  # }\n}\nEOF\n\n# 3. 设置Logstash配置目录权限\nsudo chmod -R 755 /opt/elk/config/logstash\n```\n\n**代码解释**：\n- **input**：定义日志输入源，这里使用Filebeat的beats输入\n- **filter**：定义日志处理管道，包括：\n  - `json`：解析JSON格式日志\n  - `grok`：使用正则表达式解析文本日志\n  - `date`：解析时间戳\n  - `geoip`：根据IP地址获取地理位置\n  - `mutate`：修改字段（添加、删除、重命名）\n  - `drop`：丢弃不需要的日志\n- **output**：定义日志输出目标，发送到Elasticsearch\n- `%{[@metadata][beat]}`：使用Filebeat的元数据作为索引名\n\n> [!tip] 旁批：Grok模式\n> Grok是Logstash最强大的过滤器，可以解析复杂的文本格式。常用模式：\n> - `%{IP:clientip}`：匹配IP地址\n> - `%{TIMESTAMP_ISO8601:timestamp}`：匹配ISO8601时间格式\n> - `%{GREEDYDATA:message}`：匹配任意内容\n\n### 步骤 5：配置Kibana\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：配置日志可视化界面\n\n```bash\n# 1. 创建Kibana配置文件\ncat > /opt/elk/config/kibana/kibana.yml << 'EOF'\n# 服务器设置\nserver.port: 5601\nserver.host: \"0.0.0.0\"\nserver.name: \"kibana\"\n\n# Elasticsearch连接\nelasticsearch.hosts: [\"http://elasticsearch:9200\"]\n\n# 监控设置\nxpack.monitoring.ui.container.elasticsearch.enabled: false\n\n# 界面设置\ni18n.locale: \"zh-CN\"\nEOF\n\n# 2. 创建Kibana环境变量文件\ncat > /opt/elk/config/kibana/.env << 'EOF'\nELASTICSEARCH_USERNAME=elastic\nELASTICSEARCH_PASSWORD=changeme\nEOF\n```\n\n**代码解释**：\n- `server.port: 5601`：Kibana默认端口\n- `server.host: \"0.0.0.0\"`：监听所有网络接口\n- `elasticsearch.hosts`：Elasticsearch连接地址\n- `i18n.locale: \"zh-CN\"`：界面语言设置为中文\n\n### 步骤 6：创建Docker Compose文件\n\n**在哪里操作**：SSH连接到您的云服务器\n\n**操作目的**：定义ELK服务编排\n\n```bash\n# 1. 创建docker-compose.yml\ncat > /opt/elk/docker-compose.yml << 'EOF'\nversion: '3.8'\n\nservices:\n  # Elasticsearch服务\n  elasticsearch:\n    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0\n    container_name: elasticsearch\n    environment:\n      - discovery.type=single-node\n      - ES_JAVA_OPTS=-Xms2g -Xmx2g\n      - xpack.security.enabled=false\n      - bootstrap.memory_lock=true\n    ulimits:\n      memlock:\n        soft: -1\n        hard: -1\n    volumes:\n      - ./data/elasticsearch:/usr/share/elasticsearch/data\n      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml\n    ports:\n      - \"9200:9200\"\n      - \"9300:9300\"\n    networks:\n      - elk\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD-SHELL\", \"curl -s http://localhost:9200/_cluster/health | grep -q '\\\"status\\\":\\\"green\\\"\\\\|\\\"status\\\":\\\"yellow\\\"'\"]\n      interval: 30s\n      timeout: 10s\n      retries: 5\n\n  # Logstash服务\n  logstash:\n    image: docker.elastic.co/logstash/logstash:8.12.0\n    container_name: logstash\n    environment:\n      - LS_JAVA_OPTS=-Xms1g -Xmx1g\n    volumes:\n      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml\n      - ./config/logstash/pipeline:/usr/share/logstash/pipeline\n      - ./data/logstash:/usr/share/logstash/data\n    ports:\n      - \"5044:5044\"\n      - \"9600:9600\"\n    networks:\n      - elk\n    depends_on:\n      elasticsearch:\n        condition: service_healthy\n    restart: unless-stopped\n\n  # Kibana服务\n  kibana:\n    image: docker.elastic.co/kibana/kibana:8.12.0\n    container_name: kibana\n    environment:\n      - ELASTICSEARCH_HOSTS=http://
