# docker-compose.yml - 编排文件：一份说明书管多个容器
# 作用：定义"这个项目由哪些服务组成"，一条命令全部启动

services:
  web:
    build: .                        # 用当前目录的 Dockerfile 构建镜像
    container_name: todo-web
    ports:
      - "5000:5000"                 # 宿主机5000 → 容器5000（你访问 localhost:5000）
    environment:                    # 传给容器的环境变量（应用代码里 os.getenv 读取）
      - DB_HOST=db                  # 关键！直接用服务名 "db" 代替 IP 地址
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=todo
    depends_on:
      db:
        condition: service_healthy  # 等数据库"健康检查"通过再启动应用，避免连不上库
    restart: unless-stopped         # 挂了自动重启（除非你手动停）

  db:
    image: mysql:8.0                # 直接用现成的官方镜像，不用自己写
    container_name: todo-db
    environment:
      - MYSQL_ROOT_PASSWORD=123456  # MySQL 首次启动时自动建库建账号
      - MYSQL_DATABASE=todo
    volumes:
      - db_data:/var/lib/mysql      # 数据存到数据卷，容器删了数据不丢（生产必配）
    healthcheck:                    # 健康检查：告诉 compose "我准备好了"
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s                  # 每 5 秒查一次
      retries: 10                   # 连续失败 10 次才认为不健康
    restart: unless-stopped

volumes:
  db_data:                          # 声明数据卷（数据存放的地方）
